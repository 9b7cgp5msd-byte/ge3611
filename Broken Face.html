<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Broken Face</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Cinzel (電影標題感) & Inter & Noto Serif TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500;600&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Three.js 與後處理模組 (Import Map) -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "@pixiv/three-vrm": "./three-vrm.module.js"
      }
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #07090e;
      font-family: 'Inter', 'Noto Serif TC', sans-serif;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 1;
    }

    #canvas-container canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 電影寬銀幕遮幅與暗角 (Cinematic Vignette & Letterbox) */
    .cinematic-vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      background: radial-gradient(circle at center, transparent 52%, rgba(4, 6, 10, 0.72) 100%);
      box-shadow: inset 0 0 110px rgba(0, 0, 0, 0.85);
    }

    /* 電影膠片微顆粒濾鏡 (Subtle Film Grain) */
    .film-grain {
      position: fixed;
      inset: -50%;
      width: 200%;
      height: 200%;
      pointer-events: none;
      z-index: 6;
      opacity: 0.045;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      animation: grainShift 0.6s steps(4) infinite;
    }

    @keyframes grainShift {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-2%, 2%); }
      50% { transform: translate(2%, -1%); }
      75% { transform: translate(-1%, -2%); }
      100% { transform: translate(1%, 1%); }
    }

    /* 電影上下遮幅黑邊 (可切換) */
    .letterbox-bar {
      position: fixed;
      left: 0;
      width: 100%;
      height: 0vh;
      background: #030406;
      z-index: 7;
      pointer-events: none;
      transition: height 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .letterbox-bar.top { top: 0; }
    .letterbox-bar.bottom { bottom: 0; }
    body.cinema-bars .letterbox-bar {
      height: 5.5vh;
    }

    .font-cinzel {
      font-family: 'Cinzel', 'Noto Serif TC', serif;
    }

    /* 磨砂玻璃質感面板 */
    .glass-hud {
      background: rgba(12, 15, 22, 0.58);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 232, 195, 0.14);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
    }

    .hud-btn {
      transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .hud-btn:hover {
      background: rgba(245, 190, 110, 0.18);
      border-color: rgba(245, 190, 110, 0.45);
      transform: translateY(-1px);
    }
    .hud-btn.active {
      background: linear-gradient(135deg, rgba(217, 146, 59, 0.36), rgba(168, 92, 34, 0.28));
      border-color: rgba(251, 198, 120, 0.75);
      color: #ffedd5;
      box-shadow: 0 0 16px rgba(245, 166, 66, 0.28);
    }

    /* 載入過場動畫 */
    .virtual-joystick {
      position: fixed;
      right: max(22px, env(safe-area-inset-right));
      left: auto;
      bottom: max(22px, env(safe-area-inset-bottom));
      width: 124px;
      height: 124px;
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      touch-action: none;
      user-select: none;
      transition: opacity 420ms ease;
    }
    body.ready .virtual-joystick {
      opacity: 1;
      pointer-events: auto;
    }
    .virtual-joystick__base {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(244, 218, 174, 0.26);
      background:
        radial-gradient(circle at 42% 38%, rgba(244, 205, 145, 0.10), rgba(28, 20, 14, 0.26) 62%),
        rgba(34, 24, 17, 0.24);
      box-shadow:
        inset 0 0 22px rgba(0, 0, 0, 0.28),
        0 10px 28px rgba(0, 0, 0, 0.14);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      transition: border-color 180ms ease, background-color 180ms ease;
    }
    .virtual-joystick.is-active .virtual-joystick__base {
      border-color: rgba(251, 211, 150, 0.44);
      background-color: rgba(52, 37, 24, 0.28);
    }
    .virtual-joystick__knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 46px;
      height: 46px;
      margin: -23px 0 0 -23px;
      border-radius: 50%;
      border: 1px solid rgba(255, 229, 187, 0.42);
      background: rgba(214, 176, 116, 0.26);
      box-shadow:
        inset 0 0 12px rgba(232, 242, 235, 0.12),
        0 4px 14px rgba(0, 0, 0, 0.2);
      will-change: transform;
      transition: transform 220ms cubic-bezier(0.2, 0.7, 0.2, 1), background-color 180ms ease;
    }
    .virtual-joystick.is-active .virtual-joystick__knob {
      background: rgba(235, 197, 137, 0.36);
      transition: transform 60ms linear, background-color 180ms ease;
    }

    .umbrella-pickup {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 34;
      width: 44px;
      height: 44px;
      color: rgba(214, 231, 220, 0.9);
      border: 1px solid rgba(197, 220, 206, 0.34);
      border-radius: 50%;
      background: rgba(12, 25, 19, 0.44);
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.18), inset 0 0 14px rgba(188, 216, 199, 0.06);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      pointer-events: none;
      opacity: 0;
      transform: translate3d(-100px, -100px, 0) translate(-50%, -50%);
      transition: opacity 180ms ease, transform 220ms cubic-bezier(0.2, 0.7, 0.2, 1);
    }
    .umbrella-pickup.is-visible {
      opacity: 1;
      pointer-events: auto;
      cursor: pointer;
      touch-action: manipulation;
    }
    .umbrella-pickup--static.is-visible {
      pointer-events: none;
      cursor: default;
    }
    .umbrella-pickup__icon {
      position: absolute;
      inset: 10px;
      width: 24px;
      height: 24px;
      overflow: visible;
      opacity: 0.7;
      transform: rotate(-90deg);
    }
    .umbrella-pickup--phone .umbrella-pickup__icon {
      transform: none;
    }
    .umbrella-pickup--phone {
      color: rgba(244, 218, 174, 0.95);
      border-color: rgba(244, 218, 174, 0.4);
      background: rgba(39, 30, 23, 0.58);
    }
    .umbrella-pickup--leave .umbrella-pickup__icon {
      transform: none;
    }
    .umbrella-pickup--leave {
      color: rgba(244, 218, 174, 0.96);
      border-color: rgba(244, 218, 174, 0.42);
      background: rgba(39, 30, 23, 0.62);
    }
    .umbrella-pickup--leave .umbrella-pickup__ring {
      border-color: rgba(244, 218, 174, 0.32);
    }
    .umbrella-pickup__ring {
      position: absolute;
      inset: -4px;
      border: 1px solid rgba(198, 225, 208, 0.32);
      border-radius: 50%;
      opacity: 0;
    }
    .umbrella-pickup.is-visible .umbrella-pickup__ring {
      animation: umbrella-pickup-pulse 2.4s ease-out infinite;
    }
    @keyframes umbrella-pickup-pulse {
      0% { opacity: 0.32; transform: scale(0.9); }
      75%, 100% { opacity: 0; transform: scale(1.28); }
    }
    @media (prefers-reduced-motion: reduce) {
      .umbrella-pickup, .umbrella-pickup__ring { animation: none; transition: none; }
    }

    .yuri-dialogue {
      position: fixed;
      left: 50%;
      bottom: clamp(88px, 12vh, 136px);
      z-index: 8;
      width: min(560px, calc(100vw - 40px));
      padding: 16px 22px 18px;
      transform: translate(-50%, 12px);
      background: rgba(39, 30, 23, 0.84);
      border: 1px solid rgba(244, 218, 174, 0.5);
      border-radius: 2px;
      box-shadow: 0 16px 45px rgba(25, 16, 9, 0.35);
      backdrop-filter: blur(10px);
      color: #f5e8d2;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 350ms ease, transform 450ms cubic-bezier(0.2, 0.8, 0.2, 1), visibility 350ms;
    }
    .yuri-dialogue.is-visible {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0);
      pointer-events: auto;
      cursor: pointer;
    }
    .yuri-dialogue__speaker {
      color: rgba(244, 218, 174, 0.82);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }
    .yuri-dialogue__line {
      margin: 7px 0 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(17px, 1.8vw, 22px);
      line-height: 1.42;
      letter-spacing: 0.01em;
    }
    /* Narrow layouts: keep the dialogue box above the bottom-right joystick. */
    @media (max-width: 860px) {
      .yuri-dialogue {
        bottom: calc(max(22px, env(safe-area-inset-bottom)) + 136px);
      }
    }
    @media (max-width: 720px), (max-height: 520px) {
      .yuri-dialogue { padding: 14px 18px 16px; }
    }

    .brand {
      position: fixed;
      top: clamp(22px, 4vw, 48px);
      left: clamp(22px, 4vw, 56px);
      z-index: 5;
      pointer-events: none;
      color: #f8ecd9;
      text-shadow: 0 2px 20px rgba(49, 32, 14, 0.32);
    }
    .brand .eyebrow {
      font-size: 10px;
      letter-spacing: 0.16em;
      opacity: 0.82;
      margin-bottom: 9px;
      font-weight: 600;
    }
    .brand h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(24px, 3.4vw, 41px);
      font-weight: 400;
      letter-spacing: 0.012em;
      line-height: 1;
    }
    .brand p {
      margin: 11px 0 0;
      font-size: 11px;
      letter-spacing: 0.11em;
      color: rgba(255, 247, 233, 0.74);
      font-weight: 400;
    }
    .loader-copy {
      text-align: center;
      margin-bottom: 30px;
      color: #f8ecd9;
      text-shadow: 0 2px 18px rgba(49, 32, 14, 0.4);
    }
    .loader-copy h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(28px, 4vw, 46px);
      font-weight: 400;
      letter-spacing: 0.01em;
    }
    .loader-copy p {
      margin: 12px 0 0;
      font-size: 10px;
      letter-spacing: 0.16em;
      color: rgba(255, 247, 233, 0.68);
      text-transform: uppercase;
    }
    .loader-spinner {
      width: 26px;
      height: 26px;
      margin: 0 auto 18px;
      border-radius: 50%;
      border: 1px solid rgba(244, 218, 174, 0.24);
      border-top-color: rgba(244, 218, 174, 0.78);
      animation: loader-turn 1.2s linear infinite;
    }
    @keyframes loader-turn {
      to { transform: rotate(360deg); }
    }
    @media (max-width: 720px) {
      .brand p { display: none; }
    }

    #loader-screen {
      transition: opacity 1s ease, visibility 1s ease;
    }
    #loader-screen.hidden-loader {
      opacity: 0;
      visibility: hidden;
    }
    .scene-cursor {
      --cursor-line: rgba(244, 218, 174, 0.28);
      --cursor-ink: rgba(246, 232, 208, 0.92);
      --cursor-accent: #dfb56d;
      --cursor-surface: rgba(34, 24, 17, 0.26);
      --cursor-glow: rgba(245, 166, 66, 0.22);
    }
    /* Scene cursor: bottom-left portrait badge + label */
    .scene-cursor {
      position: fixed;
      left: max(22px, env(safe-area-inset-left));
      bottom: max(22px, env(safe-area-inset-bottom));
      z-index: 35;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transform: translateY(6px) scale(0.96);
      transition: opacity 420ms ease, transform 420ms ease;
      pointer-events: none;
    }
    body.ready .scene-cursor {
      opacity: 1;
      transform: none;
    }
    .scene-cursor__badge {
      width: 90px;
      height: 90px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 1px solid var(--cursor-line);
      background:
        radial-gradient(circle at 42% 38%, var(--cursor-glow), transparent 62%),
        var(--cursor-surface);
      box-shadow:
        inset 0 0 22px rgba(0, 0, 0, 0.28),
        0 10px 28px rgba(0, 0, 0, 0.14);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
    }
    .scene-cursor__icon {
      width: 74%;
      height: 74%;
      display: block;
      object-fit: contain;
    }
    .scene-cursor__label {
      color: var(--cursor-ink);
      font: 600 11px/1.15 ui-sans-serif, system-ui, sans-serif;
      letter-spacing: 0.12em;
      white-space: nowrap;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.55);
      opacity: 0.88;
    }
    @media (max-width: 720px), (max-height: 520px) {
      .scene-cursor {
        left: max(16px, env(safe-area-inset-left));
        bottom: max(16px, env(safe-area-inset-bottom));
        gap: 8px;
      }
      .scene-cursor__badge {
        width: 74px;
        height: 74px;
      }
      .scene-cursor__label {
        font-size: 10px;
        letter-spacing: 0.1em;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .scene-cursor { transition: none; }
    }

      .task-hint {
      --task-line: rgba(244, 218, 174, 0.22);
      --task-ink: rgba(246, 232, 208, 0.82);
      --task-accent: #dfb56d;
      --task-surface: rgba(22, 15, 10, 0.46);
      --task-glow: rgba(245, 166, 66, 0.18);
    }
    /* Objective hint: minimal serif line with hairline rules */
    .task-hint {
      position: fixed;
      top: max(22px, env(safe-area-inset-top));
      right: max(22px, env(safe-area-inset-right));
      z-index: 36;
      width: max-content;
      max-width: min(560px, calc(100vw - 44px));
      padding: 12px 26px;
      background: radial-gradient(ellipse at 50% 48%, var(--task-surface), transparent 72%);
      border: 0;
      border-radius: 0;
      box-shadow: none;
      color: var(--task-ink);
      opacity: 0;
      transform: translateY(-5px);
      transition: opacity 420ms ease, transform 420ms ease;
      pointer-events: none;
      text-align: center;
    }
    body.ready .task-hint {
      opacity: 1;
      transform: none;
    }
    .task-hint::before,
    .task-hint::after {
      content: "";
      position: absolute;
      left: 6%;
      right: 6%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--task-line) 16%, var(--task-line) 84%, transparent);
      box-shadow: 0 0 6px var(--task-glow);
      pointer-events: none;
    }
    .task-hint::before { top: 0; }
    .task-hint::after { bottom: 0; }
    .task-hint__text {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(8px, 2.2vw, 12px);
      font-weight: 400;
      line-height: 1.25;
      letter-spacing: 0.015em;
      white-space: nowrap;
      text-shadow: 0 0 14px var(--task-glow);
    }
    .task-hint__check {
      position: absolute;
      right: 10px;
      top: 50%;
      width: 12px;
      height: 12px;
      transform: translateY(-50%);
      color: var(--task-accent);
      opacity: 0;
      filter: drop-shadow(0 0 4px var(--task-glow));
      transition: opacity 260ms ease;
    }
    .task-hint__check svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .task-hint.is-done .task-hint__check {
      opacity: 0.9;
    }
    @media (max-width: 720px) {
      .task-hint {
        top: 120px;
        right: max(16px, env(safe-area-inset-right));
        max-width: calc(100vw - 32px);
        padding: 10px 20px;
      }
      .task-hint__text {
        font-size: clamp(8px, 2.2vw, 10.5px);
      }
      .task-hint__check {
        right: 6px;
        width: 10px;
        height: 10px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .task-hint,
      .task-hint__check { transition: none; }
    }

      .overhead-name {
      --overhead-ink: rgba(246, 232, 208, 0.82);
      --overhead-glow: rgba(245, 166, 66, 0.22);
    }
    /* Overhead character names: text only */
    .overhead-name {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 12;
      display: none;
      transform: translate(-50%, -100%);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 11px;
      font-weight: 400;
      line-height: 1;
      letter-spacing: 0.08em;
      color: var(--overhead-ink);
      text-shadow:
        0 1px 5px rgba(0, 0, 0, 0.72),
        0 0 12px var(--overhead-glow);
      white-space: nowrap;
      pointer-events: none;
      will-change: transform;
    }
    @media (max-width: 720px) {
      .overhead-name { font-size: 10px; }
    }

  </style>
<link rel="stylesheet" href="./audio-guide.css">

  <!-- 頂部電影標題與狀態列 -->
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { VRMLoaderPlugin } from '@pixiv/three-vrm';
    import { createAudience } from './audience.js?v=51';
    import { createJoystick } from './joystick.js?v=51';
    import { createPickupPrompt } from './pickupPrompt.js?v=4';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    // ============================================================================
    // 1. 程式化紋理工廠 (Procedural High-Res Canvas Textures)
    //    確保無任何外部圖片依賴，同時具有法線/粗糙度/自發光貼圖細節
    // ============================================================================
    const TextureFactory = {
      // 濕潤鵝卵石路面貼圖（含水窪低粗糙度區域與凸起凹凸貼圖）
      createCobblestoneTextures() {
        const size = 1024;
        const diffCanvas = document.createElement('canvas');
        const roughCanvas = document.createElement('canvas');
        const bumpCanvas = document.createElement('canvas');
        diffCanvas.width = roughCanvas.width = bumpCanvas.width = size;
        diffCanvas.height = roughCanvas.height = bumpCanvas.height = size;

        const dCtx = diffCanvas.getContext('2d');
        const rCtx = roughCanvas.getContext('2d');
        const bCtx = bumpCanvas.getContext('2d');

        // 底色（石縫泥沙）
        dCtx.fillStyle = '#15181e';
        dCtx.fillRect(0, 0, size, size);

        // 預設粗糙度為中等偏濕 (0.45 -> 灰階 115)
        rCtx.fillStyle = 'rgb(115, 115, 115)';
        rCtx.fillRect(0, 0, size, size);

        bCtx.fillStyle = 'rgb(25, 25, 25)';
        bCtx.fillRect(0, 0, size, size);

        // 繪製交錯排列的鵝卵石磚塊
        const rows = 28;
        const cols = 16;
        const rowH = size / rows;
        const colW = size / cols;

        for (let r = 0; r < rows; r++) {
          const offsetX = (r % 2) * (colW * 0.5);
          for (let c = -1; c <= cols; c++) {
            const x = c * colW + offsetX + (Math.random() - 0.5) * 4;
            const y = r * rowH + (Math.random() - 0.5) * 2;
            const w = colW - 5;
            const h = rowH - 4;

            // 石塊色彩變化（藍灰、暖褐、深板岩色）
            const shade = 34 + Math.floor(Math.random() * 26);
            const warmShift = Math.floor(Math.random() * 8);
            dCtx.fillStyle = `rgb(${shade + warmShift}, ${shade + 2}, ${shade + 7})`;
            this._roundRect(dCtx, x + 2, y + 2, w, h, 7);
            dCtx.fill();

            // 頂部微高光邊緣
            dCtx.strokeStyle = `rgba(140, 155, 175, 0.16)`;
            dCtx.lineWidth = 1.5;
            dCtx.stroke();

            // 凹凸貼圖（石塊中心高起）
            const bGrad = bCtx.createRadialGradient(x + w / 2, y + h / 2, 2, x + w / 2, y + h / 2, w * 0.65);
            bGrad.addColorStop(0, 'rgb(235, 235, 235)');
            bGrad.addColorStop(0.75, 'rgb(165, 165, 165)');
            bGrad.addColorStop(1, 'rgb(40, 40, 40)');
            bCtx.fillStyle = bGrad;
            this._roundRect(bCtx, x + 2, y + 2, w, h, 7);
            bCtx.fill();

            // 石塊表面粗糙度（略高於水窪，呈現濕潤反光感）
            const rVal = 85 + Math.floor(Math.random() * 45);
            rCtx.fillStyle = `rgb(${rVal}, ${rVal}, ${rVal})`;
            this._roundRect(rCtx, x + 2, y + 2, w, h, 7);
            rCtx.fill();
          }
        }

        // 繪製有機形狀的積水水窪（極低粗糙度 = 鏡面反射街燈與霓虹！）
        for (let i = 0; i < 9; i++) {
          const px = Math.random() * size;
          const py = Math.random() * size;
          const prx = 70 + Math.random() * 140;
          const pry = 45 + Math.random() * 110;

          // 在平鋪邊界重複繪製以保持無縫貼圖
          for (let ox of [-size, 0, size]) {
            for (let oy of [-size, 0, size]) {
              const pGrad = rCtx.createRadialGradient(px + ox, py + oy, 10, px + ox, py + oy, prx);
              pGrad.addColorStop(0, 'rgb(8, 8, 8)');     // 鏡面積水中心
              pGrad.addColorStop(0.65, 'rgb(22, 22, 22)');
              pGrad.addColorStop(1, 'rgba(100, 100, 100, 0)');
              rCtx.fillStyle = pGrad;
              rCtx.beginPath();
              rCtx.ellipse(px + ox, py + oy, prx, pry, Math.random() * Math.PI, 0, Math.PI * 2);
              rCtx.fill();

              // 水窪處漫反射略深
              const dGrad = dCtx.createRadialGradient(px + ox, py + oy, 10, px + ox, py + oy, prx);
              dGrad.addColorStop(0, 'rgba(8, 11, 16, 0.55)');
              dGrad.addColorStop(1, 'rgba(8, 11, 16, 0)');
              dCtx.fillStyle = dGrad;
              dCtx.beginPath();
              dCtx.ellipse(px + ox, py + oy, prx, pry, 0, 0, Math.PI * 2);
              dCtx.fill();
            }
          }
        }

        const map = new THREE.CanvasTexture(diffCanvas);
        const roughnessMap = new THREE.CanvasTexture(roughCanvas);
        const bumpMap = new THREE.CanvasTexture(bumpCanvas);

        [map, roughnessMap, bumpMap].forEach(t => {
          t.wrapS = THREE.RepeatWrapping;
          t.wrapT = THREE.RepeatWrapping;
          t.repeat.set(4, 36);
          t.anisotropy = 8;
        });
        map.colorSpace = THREE.SRGBColorSpace;

        return { map, roughnessMap, bumpMap };
      },

      // 維多利亞復古紅磚牆紋理
      createBrickTextures(baseHue = 'red') {
        const size = 512;
        const diffCanvas = document.createElement('canvas');
        const bumpCanvas = document.createElement('canvas');
        diffCanvas.width = bumpCanvas.width = size;
        diffCanvas.height = bumpCanvas.height = size;

        const dCtx = diffCanvas.getContext('2d');
        const bCtx = bumpCanvas.getContext('2d');

        // 灰漿底色
        dCtx.fillStyle = '#3b3632';
        dCtx.fillRect(0, 0, size, size);
        bCtx.fillStyle = '#303030';
        bCtx.fillRect(0, 0, size, size);

        const rows = 16;
        const cols = 8;
        const rowH = size / rows;
        const colW = size / cols;

        for (let r = 0; r < rows; r++) {
          const offset = (r % 2) * (colW * 0.5);
          for (let c = -1; c <= cols; c++) {
            const x = c * colW + offset;
            const y = r * rowH;
            const w = colW - 3;
            const h = rowH - 3;

            let R, G, B;
            const v = Math.random();
            if (baseHue === 'red') {
              R = 95 + Math.floor(v * 42);
              G = 42 + Math.floor(v * 20);
              B = 34 + Math.floor(v * 16);
            } else if (baseHue === 'ochre') {
              // 倫敦黃褐色老磚 (London Stock Brick)
              R = 118 + Math.floor(v * 35);
              G = 98 + Math.floor(v * 28);
              B = 68 + Math.floor(v * 20);
            } else {
              // 煙燻深褐磚
              R = 72 + Math.floor(v * 28);
              G = 48 + Math.floor(v * 18);
              B = 42 + Math.floor(v * 15);
            }

            dCtx.fillStyle = `rgb(${R}, ${G}, ${B})`;
            dCtx.fillRect(x + 1.5, y + 1.5, w, h);

            // 磚面歲月斑駁感
            if (Math.random() > 0.65) {
              dCtx.fillStyle = 'rgba(15, 12, 10, 0.25)';
              dCtx.fillRect(x + 1.5, y + 1.5, w, h);
            }

            bCtx.fillStyle = `rgb(${180 + Math.floor(v * 50)}, ${180 + Math.floor(v * 50)}, ${180 + Math.floor(v * 50)})`;
            bCtx.fillRect(x + 1.5, y + 1.5, w, h);
          }
        }

        // 添加雨水垂直流淌痕跡（增加電影真實舊化感）
        for (let i = 0; i < 24; i++) {
          const sx = Math.random() * size;
          const grad = dCtx.createLinearGradient(0, 0, 0, size);
          grad.addColorStop(0, 'rgba(10, 12, 14, 0.35)');
          grad.addColorStop(0.5, 'rgba(10, 12, 14, 0.12)');
          grad.addColorStop(1, 'rgba(10, 12, 14, 0.28)');
          dCtx.fillStyle = grad;
          dCtx.fillRect(sx, 0, 4 + Math.random() * 12, size);
        }

        const map = new THREE.CanvasTexture(diffCanvas);
        const bumpMap = new THREE.CanvasTexture(bumpCanvas);
        [map, bumpMap].forEach(t => {
          t.wrapS = THREE.RepeatWrapping;
          t.wrapT = THREE.RepeatWrapping;
          t.repeat.set(2, 3);
        });
        map.colorSpace = THREE.SRGBColorSpace;
        return { map, bumpMap };
      },

      // 花崗岩人行道石板紋理
      createSidewalkTexture() {
        const size = 512;
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = size;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#252930';
        ctx.fillRect(0, 0, size, size);

        const rows = 4;
        const cols = 4;
        const w = size / cols;
        const h = size / rows;

        for (let r = 0; r < rows; r++) {
          const off = (r % 2) * (w * 0.5);
          for (let c = -1; c <= cols; c++) {
            const shade = 52 + Math.floor(Math.random() * 18);
            ctx.fillStyle = `rgb(${shade}, ${shade + 3}, ${shade + 7})`;
            ctx.fillRect(c * w + off + 2, r * h + 2, w - 4, h - 4);
          }
        }

        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(2, 48);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      },

      // 透光維多利亞窗戶紋理（帶窗格與室內暖光剪影）
      createWindowTexture(lit = true, warmTone = '#ffb44c') {
        const w = 256;
        const h = 384;
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');

        if (lit) {
          const grad = ctx.createRadialGradient(w * 0.5, h * 0.55, 10, w * 0.5, h * 0.5, h * 0.65);
          grad.addColorStop(0, '#fff3d1');
          grad.addColorStop(0.45, warmTone);
          grad.addColorStop(1, '#7c3410');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, w, h);

          // 室內模糊吊燈或窗簾剪影
          ctx.fillStyle = 'rgba(45, 18, 6, 0.35)';
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(w * 0.25, h * 0.45, 0, h);
          ctx.fill();

          ctx.beginPath();
          ctx.moveTo(w, 0);
          ctx.quadraticCurveTo(w * 0.75, h * 0.45, w, h);
          ctx.fill();
        } else {
          const grad = ctx.createLinearGradient(0, 0, w, h);
          grad.addColorStop(0, '#16202e');
          grad.addColorStop(0.5, '#0d131c');
          grad.addColorStop(1, '#1c293a');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, w, h);
        }

        // 白色木製窗欞十字格 (Georgian Sash Window Bars)
        ctx.fillStyle = '#e7e2d8';
        // 外框
        ctx.fillRect(0, 0, w, 14);
        ctx.fillRect(0, h - 14, w, 14);
        ctx.fillRect(0, 0, 14, h);
        ctx.fillRect(w - 14, 0, 14, h);
        // 中間橫推拉窗樑
        ctx.fillRect(0, h * 0.48, w, 12);
        // 細窗格
        ctx.fillRect(w * 0.33, 0, 5, h);
        ctx.fillRect(w * 0.66, 0, 5, h);
        ctx.fillRect(0, h * 0.24, w, 5);
        ctx.fillRect(0, h * 0.74, w, 5);

        const tex = new THREE.CanvasTexture(canvas);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      },

      // 店鋪匾額招牌紋理
      createSignTexture(title, subtitle, bgColor = '#112a1e', textColor = '#f5c767', borderColor = '#d49b35') {
        const w = 1024;
        const h = 256;
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');

        // 烤漆木板底色
        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, w, h);

        // 雙層金箔邊框
        ctx.strokeStyle = borderColor;
        ctx.lineWidth = 10;
        ctx.strokeRect(18, 18, w - 36, h - 36);
        ctx.lineWidth = 3;
        ctx.strokeRect(30, 30, w - 60, h - 60);

        // 無文字裝飾：中央細金線與菱形紋樣
        ctx.fillStyle = textColor;
        ctx.fillRect(w * 0.34, h * 0.45, w * 0.32, 4);
        ctx.fillRect(w * 0.41, h * 0.57, w * 0.18, 2);
        ctx.save();
        ctx.translate(w / 2, h / 2);
        ctx.rotate(Math.PI / 4);
        ctx.strokeStyle = borderColor;
        ctx.lineWidth = 3;
        ctx.strokeRect(-22, -22, 44, 44);
        ctx.restore();

        const tex = new THREE.CanvasTexture(canvas);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;

      // 懸掛式復古酒館鐵藝招牌
      createHangingSignTexture() {
        const w = 512;
        const h = 512;
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#1b1410';
        ctx.fillRect(0, 0, w, h);

        ctx.strokeStyle = '#e2ad47';
        ctx.lineWidth = 14;
        ctx.strokeRect(20, 20, w - 40, h - 40);

        // 繪製金色皇冠與船錨圖騰
        ctx.fillStyle = '#f4c158';
        ctx.beginPath();
        ctx.moveTo(170, 210);
        ctx.lineTo(155, 135);
        ctx.lineTo(210, 175);
        ctx.lineTo(256, 120);
        ctx.lineTo(302, 175);
        ctx.lineTo(357, 135);
        ctx.lineTo(342, 210);
        ctx.closePath();
        ctx.fill();

        // 無文字裝飾：皇冠下方的金色橫線
        ctx.fillStyle = '#f4c158';
        ctx.fillRect(w * 0.34, 285, w * 0.32, 6);
        ctx.fillRect(w * 0.4, 320, w * 0.2, 3);
        ctx.fillRect(w * 0.31, 360, w * 0.38, 4);
        ctx.fillStyle = '#d4b483';
        ctx.fillRect(w * 0.42, 430, w * 0.16, 2);

        const tex = new THREE.CanvasTexture(canvas);

      // 倫敦西敏寺區經典琺瑯路牌 (BAKER STREET W1)
      createStreetSignTexture() {
        const w = 512;
        const h = 192;

        ctx.strokeRect(10, 10, w - 20, h - 20);

        // 無文字裝飾：黑白琺瑯路牌色塊
        ctx.fillStyle = '#141414';
        ctx.fillRect(w * 0.28, 38, w * 0.44, 8);
        ctx.fillStyle = '#b91c1c';
        ctx.fillRect(w * 0.34, 76, w * 0.32, 52);
        ctx.fillStyle = '#141414';
        ctx.fillRect(w * 0.3, 152, w * 0.4, 7);

        const tex = new THREE.CanvasTexture(canvas);

      // 條紋遮陽篷紋理
      createAwningTexture(color1 = '#6b141a', color2 = '#e8dec8') {
        const w = 512;
        const h = 256;
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');

        const stripes = 12;
        const sw = w / stripes;
        for (let i = 0; i < stripes; i++) {
          ctx.fillStyle = i % 2 === 0 ? color1 : color2;
          ctx.fillRect(i * sw, 0, sw, h);
        }

        const tex = new THREE.CanvasTexture(canvas);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      },

      // 柔和徑向光暈/煙霧粒子貼圖
      createSoftParticleTexture() {
        const size = 128;
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = size;
        const ctx = canvas.getContext('2d');

        const grad = ctx.createRadialGradient(size / 2, size / 2, 2, size / 2, size / 2, size / 2);
        grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
        grad.addColorStop(0.4, 'rgba(255, 255, 255, 0.45)');
        grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, size, size);

        return new THREE.CanvasTexture(canvas);
      },

      _roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }
    };

    // ============================================================================
    // 2. Web Audio API 合成倫敦雨夜環境音效 (無外部音檔依賴)
    // ============================================================================
    class RainAmbienceAudio {
      constructor() {
        this.ctx = null;
        this.isPlaying = false;
        this.masterGain = null;
      }

      toggle() {
        if (!this.ctx) {
          this._init();
        }
        if (this.isPlaying) {
          this.masterGain.gain.setTargetAtTime(0.0001, this.ctx.currentTime, 0.4);
          this.isPlaying = false;
        } else {
          if (this.ctx.state === 'suspended') this.ctx.resume();
          this.masterGain.gain.setTargetAtTime(0.28, this.ctx.currentTime, 0.6);
          this.isPlaying = true;
        }
        return this.isPlaying;
      }

      _init() {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 0.0001;
        this.masterGain.connect(this.ctx.destination);

        // 生成 4 秒粉紅噪聲緩衝區模擬細雨聲
        const bufferSize = this.ctx.sampleRate * 4;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          b0 = 0.99886 * b0 + white * 0.0555179;
          b1 = 0.99332 * b1 + white * 0.0750759;
          b2 = 0.96900 * b2 + white * 0.1538520;
          b3 = 0.86650 * b3 + white * 0.3104856;
          b4 = 0.55000 * b4 + white * 0.5329522;
          b5 = -0.7616 * b5 - white * 0.0168980;
          data[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.04;
          b6 = white * 0.115926;
        }

        const rainSource = this.ctx.createBufferSource();
        rainSource.buffer = buffer;
        rainSource.loop = true;

        // 帶通濾波讓雨聲聽起來更柔和細膩
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 1100;
        filter.Q.value = 0.6;

        // 城市低頻遠處嗡鳴 (City Rumble)
        const cityOsc = this.ctx.createOscillator();
        cityOsc.type = 'sine';
        cityOsc.frequency.value = 58;
        const cityGain = this.ctx.createGain();
        cityGain.gain.value = 0.12;

        rainSource.connect(filter);
        filter.connect(this.masterGain);
        cityOsc.connect(cityGain);
        cityGain.connect(this.masterGain);

        rainSource.start();
        cityOsc.start();
      }
    }

    const normalizeEmergencyModel = (source, targetLength, yOffset = 0.02) => {
      source.updateMatrixWorld(true);
      const bounds = new THREE.Box3().setFromObject(source);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();
      bounds.getSize(size);
      bounds.getCenter(center);
      const scale = targetLength / Math.max(0.001, size.z);
      source.scale.setScalar(scale);
      source.position.set(
        -center.x * scale,
        -bounds.min.y * scale + yOffset,
        -center.z * scale
      );
      source.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });
    };

        color: 0xfff3d6,

      const beam = new THREE.SpotLight(0xffe4a8, 14, 24, Math.PI * 0.18, 0.55, 1.4);
      beam.position.set(0, bodyY, frontZ);
      beam.target.position.set(0, 0.2, frontZ + 14);
      carrier.add(beam);

    function buildVictorianTownhouse(options) {
      const {

      const depth = 8.5;
      const groundH = 3.8;
      const upperFloorH = 3.1;
      const totalWallH = groundH + (floors - 1) * upperFloorH;

      // 主建築量體
      const bodyGeo = new THREE.BoxGeometry(width, totalWallH, depth);
      const bodyMesh = new THREE.Mesh(bodyGeo, brickMaterials[brickIndex % brickMaterials.length]);
      bodyMesh.position.set(0, totalWallH / 2, -depth / 2);
      bodyMesh.castShadow = true;
      bodyMesh.receiveShadow = true;
      group.add(bodyMesh);

      // 白色石膏腰線與屋頂簷口 (Cornice)
      const cornice = new THREE.Mesh(new THREE.BoxGeometry(width + 0.25, 0.36, depth + 0.35), plasterMat);
      cornice.position.set(0, totalWallH, -depth / 2 + 0.1);
      group.add(cornice);

      const beltCourse = new THREE.Mesh(new THREE.BoxGeometry(width + 0.12, 0.2, depth + 0.12), plasterMat);
      beltCourse.position.set(0, groundH, -depth / 2 + 0.04);
      group.add(beltCourse);

      const roofH = 2.6;
      const roofGeo = new THREE.ConeGeometry(width * 0.74, roofH, 4);
      const roofMesh = new THREE.Mesh(roofGeo, slateRoofMat);
      roofMesh.position.set(0, totalWallH + roofH / 2, -depth / 2);
      roofMesh.rotation.y = Math.PI / 4;

    // 放置兩座標誌性紅色電話亭
    // Red telephone booths replaced by the supplied GLB.
    new GLTFLoader().load('./phonebooth.glb', (gltf) => {
      const source = gltf.scene;
      source.updateMatrixWorld(true);
      const bounds = new THREE.Box3().setFromObject(source);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();
      bounds.getSize(size);
      bounds.getCenter(center);
      const scale = 4.8 / Math.max(0.001, size.y);
      source.scale.setScalar(scale);
      source.position.set(
        -center.x * scale,
        -bounds.min.y * scale + 0.18,
        -center.z * scale
      );
      const normalized = new THREE.Group();
      normalized.add(source);

      const addBoothLight = (root) => {
        const light = new THREE.PointLight(0xffc46b, 7.0, 6.0, 1.6);
        light.position.set(0, 2.35, 0);
        root.add(light);
        const bulb = new THREE.Mesh(
          new THREE.SphereGeometry(0.075, 12, 8),
          new THREE.MeshBasicMaterial({ color: 0xffe0a0 })
        );
        bulb.position.set(0, 2.35, 0);
        root.add(bulb);
      };

      const right = normalized.clone(true);
      right.position.set(5.65, 0, 8.2);
      right.rotation.y = -Math.PI / 2;
      addBoothLight(right);
      scene.add(right);
      const left = normalized.clone(true);
      left.position.set(-5.65, 0, -14.5);
      left.rotation.y = Math.PI / 2;
      addBoothLight(left);
      scene.add(left);

      console.log('[PhoneBooth] GLB loaded at both sidewalk positions.');
    }, undefined, (error) => console.warn('[PhoneBooth] Failed to load phonebooth.glb.', error));

    const clock = new THREE.Clock();

    function setRideBone(humanoid, name, x, y, z) {
      const node = humanoid.getNormalizedBoneNode(name);
      if (node) node.quaternion.setFromEuler(new THREE.Euler(x, y, z, 'XYZ')).normalize();
    }

    const _ccdDelta = new THREE.Quaternion();
    const _ccdFrom = new THREE.Vector3();
    const _ccdTo = new THREE.Vector3();
    const _ccdPivot = new THREE.Vector3();
    const _ccdEnd = new THREE.Vector3();
    const _ccdParent = new THREE.Quaternion();
    const _ccdWorld = new THREE.Quaternion();

    function rotateBoneToward(bone, endBone, targetWorld, root) {
      bone.getWorldPosition(_ccdPivot);
      endBone.getWorldPosition(_ccdEnd);
      _ccdFrom.subVectors(_ccdEnd, _ccdPivot);
      _ccdTo.subVectors(targetWorld, _ccdPivot);
      if (_ccdFrom.lengthSq() < 1e-6 || _ccdTo.lengthSq() < 1e-6) return;
      _ccdDelta.setFromUnitVectors(_ccdFrom.normalize(), _ccdTo.normalize());
      bone.getWorldQuaternion(_ccdWorld);
      bone.parent.getWorldQuaternion(_ccdParent);
      _ccdWorld.premultiply(_ccdDelta);
      bone.quaternion.copy(_ccdParent.invert().multiply(_ccdWorld)).normalize();
      root.updateMatrixWorld(true);
    }

    function solveLegIK(rig, upper, lower, foot, targetWorld) {
      // A few CCD passes are enough because the target moves only a little
      // each frame and the legs start from a natural seated pose.
      for (let i = 0; i < 4; i++) {
        if (lower) rotateBoneToward(lower, foot, targetWorld, rig.root);
        if (upper) rotateBoneToward(upper, foot, targetWorld, rig.root);
      }
    }

    function getPalmWorld(humanoid, side) {
      const hand = humanoid.getNormalizedBoneNode(`${side}Hand`);
      const index = humanoid.getNormalizedBoneNode(`${side}IndexProximal`);
      if (!hand) return null;
      const handPos = new THREE.Vector3();
      hand.getWorldPosition(handPos);
      if (!index) return handPos;
      const indexPos = new THREE.Vector3();
      index.getWorldPosition(indexPos);
      return handPos.lerp(indexPos, 0.55);
    }

    function solveArmIK(rig, upper, lower, hand, targetWorld) {
      for (let i = 0; i < 4; i++) {
        if (lower) rotateBoneToward(lower, hand, targetWorld, rig.root);
        if (upper) rotateBoneToward(upper, hand, targetWorld, rig.root);
      }
    }

    function applyYuriFall(dt) {
      const rig = yuriRideRig;
      yuriFallState.elapsed += dt;
      const t = Math.min(1, yuriFallState.elapsed / yuriFallState.duration);
      const eased = 1 - Math.pow(1 - t, 3);

      // The bicycle rolls sideways and drops to the road.
      rig.root.position.y = THREE.MathUtils.lerp(yuriFallState.startY, 0.02, eased);
      const fallQ = new THREE.Quaternion().setFromAxisAngle(
        new THREE.Vector3(0, 0, 1),
        yuriFallState.direction * 1.46 * eased
      );
      rig.root.quaternion.copy(yuriFallState.startQuat).multiply(fallQ);
      rig.root.updateMatrixWorld(true);

      // Yuri is thrown free of the bike. Animate his world-space position
      // and rotation independently, then clamp his lowest point onto the road.
      const start = yuriFallState.startRiderWorld;
      rig.rider.position.x = start.x - yuriFallState.direction * 1.15 * eased;
      rig.rider.position.z = start.z + 0.75 * eased;
      rig.rider.position.y = start.y + Math.sin(eased * Math.PI) * 0.22;
      const riderFallQ = new THREE.Quaternion().setFromAxisAngle(
        new THREE.Vector3(1, 0, 0),
        -yuriFallState.direction * 1.42 * eased
      );
      rig.rider.quaternion.copy(yuriFallState.startRiderQuat).premultiply(riderFallQ);

      // Open both arms outward as Yuri is thrown from the handlebars.
      const humanoid = rig.humanoid;
      const armOpen = eased;
      const lerpArm = (a, b) => a + (b - a) * armOpen;
      setRideBone(humanoid, 'leftUpperArm',
        lerpArm(-0.058, 0.10), lerpArm(-0.884, -0.50), lerpArm(-0.134, 0.92));
      setRideBone(humanoid, 'rightUpperArm',
        lerpArm(-0.058, 0.10), lerpArm(0.884, 0.50), lerpArm(0.134, -0.92));
      setRideBone(humanoid, 'leftLowerArm',
        lerpArm(-0.324, 0.0), lerpArm(-0.781, -0.28), lerpArm(0.105, 0.18));
      setRideBone(humanoid, 'rightLowerArm',
        lerpArm(-0.324, 0.0), lerpArm(0.781, 0.28), lerpArm(-0.105, -0.18));
      rig.vrm.update(0);
      rig.rider.updateMatrixWorld(true);

      // Ground the whole body from posed bones. Feet alone can sit high while
      // the pelvis/back floats, so include the torso, hips and hands too.
      const headNode = humanoid.getNormalizedBoneNode('head');
      const hipsNode = humanoid.getNormalizedBoneNode('hips');
      const chestNode = humanoid.getNormalizedBoneNode('chest');
      const leftHand = humanoid.getNormalizedBoneNode('leftHand');
      const rightHand = humanoid.getNormalizedBoneNode('rightHand');
      let lowestBoneY = Infinity;
      for (const node of [rig.leftFoot, rig.rightFoot, headNode, hipsNode, chestNode, leftHand, rightHand]) {
        if (!node) continue;
        const world = new THREE.Vector3();
        node.getWorldPosition(world);
        lowestBoneY = Math.min(lowestBoneY, world.y);
      }
      if (Number.isFinite(lowestBoneY)) {
        // Lower the whole pose until the lowest body joint is almost on the
        // road. A tiny extra drop removes the visible gap under the torso.
        rig.rider.position.y -= lowestBoneY - 0.025;
        rig.rider.position.y -= 0.04;
      }
      rig.rider.updateMatrixWorld(true);

      // Start covering immediately on impact, while the fall is still in
      // progress: one palm to the nose, one palm to the abdomen.
      {
        const headNode = humanoid.getNormalizedBoneNode('head');
        const chestNode = humanoid.getNormalizedBoneNode('chest');
        const hipsNode = humanoid.getNormalizedBoneNode('hips');
        if (headNode && chestNode && hipsNode) {
          const headPos = new THREE.Vector3();
          const headQuat = new THREE.Quaternion();
          const chestPos = new THREE.Vector3();
          const chestQuat = new THREE.Quaternion();
          const hipsPos = new THREE.Vector3();
          headNode.getWorldPosition(headPos);
          headNode.getWorldQuaternion(headQuat);
          chestNode.getWorldPosition(chestPos);
          chestNode.getWorldQuaternion(chestQuat);
          hipsNode.getWorldPosition(hipsPos);

          const noseTarget = headPos.clone().add(new THREE.Vector3(0.02, 0.03, 0.10).applyQuaternion(headQuat));
          const bellyTarget = chestPos.clone().lerp(hipsPos, 0.32)
            .add(new THREE.Vector3(0, 0.08, 0.10).applyQuaternion(chestQuat));

          // Align the palm centre, not the wrist, with the face / abdomen.
          // Adjusting the wrist target iteratively keeps the forearm from
          // becoming the part that covers the nose.
          for (let pass = 0; pass < 3; pass++) {
            solveArmIK(rig, rig.rightUpperArm, rig.rightLowerArm, rig.rightHand, noseTarget);
            solveArmIK(rig, rig.leftUpperArm, rig.leftLowerArm, rig.leftHand, bellyTarget);
            rig.vrm.update(0);
            rig.rider.updateMatrixWorld(true);
            const rightPalm = getPalmWorld(humanoid, 'right');
            const leftPalm = getPalmWorld(humanoid, 'left');
            if (rightPalm) noseTarget.add(noseTarget.clone().sub(rightPalm));
            if (leftPalm) bellyTarget.add(bellyTarget.clone().sub(leftPalm));
          }
          rig.vrm.update(0);
          rig.rider.updateMatrixWorld(true);
        }
      }

      rig.vrm.update(dt);

      if (t >= 0.999 && !yuriFallColliderAdded) {
        yuriFallColliderAdded = true;
        rig.root.updateMatrixWorld(true);
        rig.rider.updateMatrixWorld(true);

        // Two tight world-space AABBs: one for the fallen bike, one for Yuri.
        const bikeBox = new THREE.Box3().setFromObject(rig.root);
        const riderBox = new THREE.Box3().setFromObject(rig.rider);
        for (const name of ['head', 'chest', 'hips', 'leftHand', 'rightHand', 'leftFoot', 'rightFoot']) {
          const node = rig.humanoid.getNormalizedBoneNode(name);
          if (!node) continue;
          const world = new THREE.Vector3();
          node.getWorldPosition(world);
          riderBox.expandByPoint(world);
        }
        const bikeCenter = new THREE.Vector3();
        const bikeSize = new THREE.Vector3();
        bikeBox.getCenter(bikeCenter);
        bikeBox.getSize(bikeSize);
        bikeSize.multiplyScalar(0.85);
        bikeBox.setFromCenterAndSize(bikeCenter, bikeSize);
        bikeBox.expandByScalar(0.01);
        riderBox.expandByScalar(0.02);
        audienceObstacles.push(bikeBox, riderBox);
        yuriBodyColliders.push(riderBox, bikeBox);
        audience.userData.setObstacles?.(audienceObstacles);
        // After the red car has knocked Yuri down, unlock the joystick without
        // waiting for the car to drive all the way out of the street.
        showJoystick();
        console.log('[Audience] Fallen Yuri/bike colliders added.');
      }
    }

    function updateYuriRide(dt) {
      if (!yuriRideRig) return;
      const rig = yuriRideRig;
      if (yuriFallState) {
        applyYuriFall(dt);
        return;
      }
      if (yuriRideJourney && !yuriRideJourney.finished) {
        yuriRideJourney.elapsed += dt;
        const travel = Math.min(1, yuriRideJourney.elapsed / yuriRideJourney.duration);
        const point = yuriRideJourney.curve.getPointAt(travel);
        const tangent = yuriRideJourney.curve.getTangentAt(travel);
        rig.root.position.copy(point);
        rig.root.rotation.y = Math.atan2(tangent.x, tangent.z);
        if (travel >= 1) {
          yuriRideJourney.finished = true;
          rig.root.position.copy(yuriRideJourney.curve.getPointAt(1));
          rig.root.rotation.y = Math.atan2(
            yuriRideJourney.curve.getTangentAt(1).x,
            yuriRideJourney.curve.getTangentAt(1).z
          );
        }
      }
      // Red car collision: it runs along x=1.6; the bike finishes in the
      // road centre. Knock both rider and bicycle over once.
      if (yuriRideJourney && !yuriFallState && rig.root.position.z > -8) {
        const carDx = Math.abs(distantBus.position.x - rig.root.position.x);
        const carDz = Math.abs(distantBus.position.z - rig.root.position.z);
        if (carDx < 3.0 && carDz < 5.0) {
          yuriRideJourney.finished = true;
          // Steer the red car around the fallen rider/bike, then return to
          // its normal lane after passing the crossing.
          const obstacleX = rig.root.position.x;
          const steerSide = obstacleX >= distantBus.position.x ? -1 : 1;
          redCarDetour = {
            elapsed: 0,
            duration: 3.6,
            startX: distantBus.position.x,
            targetX: THREE.MathUtils.clamp(distantBus.position.x + steerSide * 3.2, -3.2, 3.2)
          };
          rig.root.updateMatrixWorld(true);
          const riderWorld = new THREE.Vector3();
          const riderQuat = new THREE.Quaternion();
          rig.rider.getWorldPosition(riderWorld);
          rig.rider.getWorldQuaternion(riderQuat);
          scene.updateMatrixWorld(true);
          scene.attach(rig.rider);
          yuriFallState = {
            elapsed: 0,
            duration: 1.1,
            startY: rig.root.position.y,
            startQuat: rig.root.quaternion.clone(),
            startRiderWorld: riderWorld,
            startRiderQuat: riderQuat,
            direction: distantBus.position.x > rig.root.position.x ? 1 : -1
          };
          applyYuriFall(0.001);
          return;
        }
      }

      const phase = yuriRidePhase;
      const humanoid = rig.humanoid;

      // Reset to a natural seated starting pose before solving to the pedals.
      setRideBone(humanoid, 'leftUpperLeg', -1.20, -0.05, -0.06);
      setRideBone(humanoid, 'rightUpperLeg', -1.02, 0.05, 0.06);
      setRideBone(humanoid, 'leftLowerLeg', 1.08, 0, 0);
      setRideBone(humanoid, 'rightLowerLeg', 0.92, 0, 0);
      setRideBone(humanoid, 'leftFoot', -0.08, 0, 0);
      setRideBone(humanoid, 'rightFoot', -0.08, 0, 0);

      // Relaxed torso: small downstroke bob; hips stay planted on the saddle.
      const bodyBob = Math.sin(phase * 2);
      setRideBone(humanoid, 'spine', 0.580 + bodyBob * 0.020, 0, 0);
      setRideBone(humanoid, 'chest', 0.242 - bodyBob * 0.012, 0, 0);
      setRideBone(humanoid, 'head', -0.20, 0, 0);

      rig.vrm.update(0);
      rig.root.updateMatrixWorld(true);

      // Clockwise crank seen from Yuri's right side (+Y up, +Z forward).
      // Right starts front-low; the left pedal is always 180° opposite.
      const crankRadius = 0.26;
      // VRM character space: the character's left side is +X and the right
      // side is -X. Keep each foot on its matching pedal.
      const leftLocal = new THREE.Vector3(
        0.15,
        rig.bottomBracket.y + Math.cos(phase + Math.PI) * crankRadius,
        Math.sin(phase + Math.PI) * crankRadius
      );
      const rightLocal = new THREE.Vector3(
        -0.15,
        rig.bottomBracket.y + Math.cos(phase) * crankRadius,
        Math.sin(phase) * crankRadius
      );

      rig.pedalRight.position.copy(rightLocal);
      rig.pedalLeft.position.copy(leftLocal);
      rig.pedalRight.rotation.set(0, 0, 0);
      rig.pedalLeft.rotation.set(0, 0, 0);

      const ankleLift = new THREE.Vector3(0, 0.105, 0.015);
      const targetRight = rig.root.localToWorld(rightLocal.clone().add(ankleLift));
      const targetLeft = rig.root.localToWorld(leftLocal.clone().add(ankleLift));
      solveLegIK(rig, rig.rightUpper, rig.rightLower, rig.rightFoot, targetRight);
      solveLegIK(rig, rig.leftUpper, rig.leftLower, rig.leftFoot, targetLeft);

      // Ankles follow the pedal with a small, soft adjustment.
      rig.leftFoot.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(
        new THREE.Vector3(1, 0, 0), -0.08 + Math.sin(phase) * 0.06
      ));
      rig.rightFoot.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(
        new THREE.Vector3(1, 0, 0), -0.08 - Math.sin(phase) * 0.06
      ));

      // Apply the solved normalized-bone rotations to the VRM skin. Without
      // this second update the feet would move while the rendered leg mesh
      // stayed in its previous pose.
      rig.vrm.update(dt);
      rig.root.updateMatrixWorld(true);

      const setRod = (rod, a, b) => {
        const direction = new THREE.Vector3().subVectors(b, a);
        const length = direction.length();
        rod.position.copy(a).add(b).multiplyScalar(0.5);
        rod.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
        rod.scale.set(1, length, 1);
      };
      setRod(rig.crankRight, rig.bottomBracket, rightLocal);
      setRod(rig.crankLeft, rig.bottomBracket, leftLocal);

      if (!yuriRideJourney || !yuriRideJourney.finished) yuriRidePhase += dt * 2.7;
    }

    const overheadMaiElement = document.getElementById('overheadMai');
    const overheadYouElement = document.getElementById('overheadYou');
    const overheadYuriWorld = new THREE.Vector3();
    const overheadAudienceWorld = new THREE.Vector3();

    const projectOverheadName = (element, world, lift = 0.3) => {
      if (!element) return;
      world.y += lift;
      world.project(camera);
      if (world.z < -1 || world.z > 1) {
        element.style.display = 'none';
        return;
      }
      const x = (world.x * 0.5 + 0.5) * window.innerWidth;
      // Keep the name clear of the face: a small screen-space gap above the
      // projected head point, on top of the world-space lift.
      const y = Math.max(8, (-world.y * 0.5 + 0.5) * window.innerHeight - 12);
      element.style.display = 'block';
      element.style.transform = `translate3d(${x}px, ${y}px, 0) translate(-50%, -100%)`;
    };

    const updateOverheadNames = () => {
      const yuriHead = yuriRideRig?.humanoid?.getNormalizedBoneNode('head');
      if (yuriHead) {
        yuriHead.getWorldPosition(overheadYuriWorld);
        projectOverheadName(overheadMaiElement, overheadYuriWorld, 0.45);
      } else if (overheadMaiElement) {
        overheadMaiElement.style.display = 'none';
      }

      // The audience rig is 3.9 m tall with its origin at the feet. Use the
      // top of the head directly instead of a mid-body/head-bone position.
      overheadAudienceWorld.set(
        audience.position.x,
        audience.position.y + 3.9,
        audience.position.z
      );
      projectOverheadName(overheadYouElement, overheadAudienceWorld, 0.25);
    };

    function animate() {
      requestAnimationFrame(animate);

      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.getElapsedTime();

      // 1. 更新細雨粒子下落
      if (rainEnabled) {
        const posArr = rainGeo.attributes.position.array;
        for (let i = 0; i < rainCount; i++) {
          const drop = rainVelocities[i] * dt;
          posArr[i * 6] -= drop * 0.08;
          posArr[i * 6 + 1] -= drop;
          posArr[i * 6 + 3] -= drop * 0.08;
          posArr[i * 6 + 4] -= drop;

          if (posArr[i * 6 + 4] < 0) {
            const rx = (Math.random() - 0.5) * 34;
            const ry = 24 + Math.random() * 6;
            const rz = (Math.random() - 0.5) * 85 - 5;
            const len = 0.45 + Math.random() * 0.3;
            posArr[i * 6] = rx;
            posArr[i * 6 + 1] = ry;
            posArr[i * 6 + 2] = rz;
            posArr[i * 6 + 3] = rx - 0.04;
            posArr[i * 6 + 4] = ry - len;
            posArr[i * 6 + 5] = rz;
          }
        }
        rainGeo.attributes.position.needsUpdate = true;
      }

      // 2. 更新煙囪炊煙上升與擴散
      smokeParticles.forEach(sp => {
        sp.userData.progress += sp.userData.speed * dt;
        if (sp.userData.progress >= 1) {
          sp.userData.progress = 0;
        }
        const p = sp.userData.progress;
        sp.position.x = sp.userData.origin.x + Math.sin(elapsed * 0.8 + p * 5) * 0.35 + p * 0.8;
        sp.position.y = sp.userData.origin.y + p * 5.2;
        sp.position.z = sp.userData.origin.z + Math.cos(elapsed * 0.6 + p * 4) * 0.25;
        sp.scale.setScalar(0.75 + p * 2.4);
        sp.material.opacity = Math.sin(p * Math.PI) * 0.16;
      });

      // 3. 懸掛酒館招牌隨微風輕微擺動 & 路燈微弱呼吸閃爍
      buildingGroups.forEach(bg => {
        bg.traverse(child => {
          if (child.userData && child.userData.isHangingSign) {
            child.rotation.z = Math.sin(elapsed * 1.9) * 0.045;
          }
        });
      });

      streetLampLights.forEach((light, idx) => {
        const flicker = Math.sin(elapsed * 7.5 + idx * 2.1) * 0.18 + Math.sin(elapsed * 19 + idx) * 0.06;
        light.intensity += flicker * dt * 8;
      });

      // 4. Red car movement; detour around a fallen rider then return to lane.
      const previousCarX = distantBus.position.x;
      const redCarSpeed = redCarDetour ? 9.6 : 4.8;
      distantBus.position.z += redCarSpeed * dt;
      if (redCarDetour) {
        redCarDetour.elapsed += dt;
        const d = Math.min(1, redCarDetour.elapsed / redCarDetour.duration);
        let laneX;
        if (d < 0.28) {
          const k = 1 - Math.pow(1 - d / 0.28, 3);
          laneX = THREE.MathUtils.lerp(redCarDetour.startX, redCarDetour.targetX, k);
        } else if (d < 0.7) {
          laneX = redCarDetour.targetX;
        } else {
          const k = (d - 0.7) / 0.3;
          laneX = THREE.MathUtils.lerp(redCarDetour.targetX, 1.6, k * k * (3 - 2 * k));
        }
        distantBus.position.x = laneX;
        const carYaw = Math.atan2(distantBus.position.x - previousCarX, Math.max(0.001, redCarSpeed * dt));
        distantBus.rotation.y += (carYaw - distantBus.rotation.y) * 0.2;
        if (d >= 1) {
          distantBus.position.x = 1.6;
          distantBus.rotation.y = 0;
          redCarDetour = null;
        }
      } else {
        distantBus.position.x = 1.6;
        distantBus.rotation.y = 0;
      }
      if (!redCarFinished && distantBus.position.z > 42) {
        // The red car makes only one pass; after leaving the street it is gone.
        redCarFinished = true;
        redCarDetour = null;
        distantBus.visible = false;
        showJoystick();
      }

      // Allow a full 360° orbit, but keep the orbit radius inside the street
      // as the camera turns toward the shopfronts. Instead of clamping the
      // camera after OrbitControls moves it (which caused jitter), constrain
      // the orbit distance itself. Rotating remains free; the camera naturally
      // dollies in near the side walls and can zoom back out facing down the street.
      const orbitDx = camera.position.x - controls.target.x;
      const orbitDz = camera.position.z - controls.target.z;
      const orbitRadius = Math.hypot(orbitDx, orbitDz);
      const streetLimit = 7.15;
      const sinAzimuth = orbitRadius > 0.001 ? Math.abs(orbitDx) / orbitRadius : 0;
      const allowedDistance = sinAzimuth > 0.001
        ? Math.min(48, streetLimit / sinAzimuth)
        : 48;
      controls.minAzimuthAngle = -Infinity;
      controls.maxAzimuthAngle = Infinity;
      controls.maxDistance = Math.max(3, allowedDistance);
      updateYuriRide(dt);
      audience.userData.update?.(elapsed, dt, camera);
      if (yuriFallColliderAdded && yuriBodyColliders.length) {
        let nearest = Infinity;
        for (const box of yuriBodyColliders) {
          const dx = Math.max(box.min.x - audience.position.x, 0, audience.position.x - box.max.x);
          const dz = Math.max(box.min.z - audience.position.z, 0, audience.position.z - box.max.z);
          nearest = Math.min(nearest, Math.hypot(dx, dz));
        }
        if (emergencyArrived) {
          // Emergency services have arrived; the repeated help line is done.
          yuriHelpInRange = false;
          if (yuriHelpOpen) hideYuriHelp();
        } else if (nearest < 2.0) {
          if (!yuriHelpInRange && dialogueIndex < 0) {
            // A fresh touch before the ambulance/police arrive: show it again.
            yuriHelpInRange = true;
            showYuriHelp();
          }
        } else if (nearest > 2.4) {
          yuriHelpInRange = false;
          if (yuriHelpOpen) hideYuriHelp();
        }
      }
      for (const phone of phonePrompts) {
        const near = Math.hypot(audience.position.x - phone.x, audience.position.z - phone.z) < 4.2;
        phone.prompt.setVisible(near && yuriHelpSeen && !phoneAnswered);
        phone.prompt.update();
      }
      leavePrompt?.update();
      for (const vehicle of emergencyVehicles) {
        if (!vehicle.active) continue;
        if (vehicle.t < 0) {
          vehicle.t += dt;
          continue;
        }
        vehicle.t = Math.min(1, vehicle.t + dt / vehicle.duration);
        const k = 1 - Math.pow(1 - vehicle.t, 3);
        vehicle.group.position.z = THREE.MathUtils.lerp(vehicle.startZ, vehicle.stopZ, k);
        vehicle.group.position.x = THREE.MathUtils.lerp(vehicle.startX, vehicle.stopX, k);
        if (vehicle.colliderBox && vehicle.colliderOrigin) {
          vehicle.colliderBox.copy(vehicle.baseBox);
          vehicle.colliderBox.translate(new THREE.Vector3(
            vehicle.group.position.x - vehicle.colliderOrigin.x,
            0,
            vehicle.group.position.z - vehicle.colliderOrigin.z
          ));
        }
      }
      if (emergencyCollidersRegistered) {
        // setObstacles stores cloned boxes, so refresh them as the cars move.
        audience.userData.setObstacles?.(audienceObstacles);
      }
      if (!emergencyArrived && emergencyVehicles.length >= 3) {
        const activeVehicles = emergencyVehicles.filter((vehicle) => vehicle.active);
        if (activeVehicles.length >= 3 && activeVehicles.every((vehicle) => vehicle.t >= 1)) {
          emergencyArrived = true;
          taskHintElement?.classList.add('is-done');
        }
      }
      if (emergencyArrived && yuriBodyColliders.length) {
        let nearest = Infinity;
        for (const box of yuriBodyColliders) {
          const dx = Math.max(box.min.x - audience.position.x, 0, audience.position.x - box.max.x);
          const dz = Math.max(box.min.z - audience.position.z, 0, audience.position.z - box.max.z);
          nearest = Math.min(nearest, Math.hypot(dx, dz));
        }
        setEmergencyTouchDialogue(nearest < 2.0);
      }
      controls.update();
      updateOverheadNames();
      composer.render();
    }

    // 啟動與載入畫面淡出
    window.addEventListener('load', () => {
      document.body.classList.add('ready');
      const loader = document.getElementById('loader-screen');
      setTimeout(() => {
        loader.classList.add('hidden-loader');
      }, 650);
      animate();
    });
  </script>

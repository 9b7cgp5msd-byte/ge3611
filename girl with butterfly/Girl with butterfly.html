    function makeBroadleafTree(scale = 1) {
      const group = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.17, 2.1, 9), woodMat);
      trunk.position.y = 1.05;
      trunk.rotation.z = 0.04;
      trunk.castShadow = true;
      group.add(trunk);
      for (let i = 0; i < 5; i++) {
        const angle = (i / 5) * TAU + 0.35;
        const end = new THREE.Vector3(Math.cos(angle) * 0.75, 2.2 + random() * 0.4, Math.sin(angle) * 0.75);
        addTreeBranch(group, new THREE.Vector3(0, 1.6, 0), end, 0.03, woodMat);
      }
      const leafMatrices = [];
      const normal = new THREE.Vector3();
      const position = new THREE.Vector3();
      for (let i = 0; i < 3800; i++) {
        const theta = random() * TAU;
        const phi = Math.acos(2 * random() - 1);
        normal.set(Math.sin(phi) * Math.cos(theta), Math.cos(phi), Math.sin(phi) * Math.sin(theta));
        position.set(normal.x * 1.15, 2.85 + normal.y * 0.95, normal.z * 1.15);
        leafMatrices.push(leafSurfaceMatrix(position, normal, 0.42 + random() * 0.26, random() * TAU));
      }
      addLeafInstances(group, wavyLeafGeo, broadLeafMat, leafMatrices);
      group.scale.setScalar(scale);
      return group;
    }

    function addBroadleaf(x, z, scale = 1) {
      const tree = makeBroadleafTree(scale);
      tree.scale.multiplyScalar(2);
      tree.position.set(x, 0, z);
      scene.add(tree);
      addTreeGrass(x, z, 1.25);
      addSway(tree, 0.01, 0.25);
      return tree;
    }

    addPine(-10.8, -14.2, 1.0);
    addBroadleaf(-12.5, -4.8, 1.0);

    // ---------------------------------------------------------------------
    // Low stucco walls, gate, and distant hills
    // ---------------------------------------------------------------------
    function wallBox(w, h, d, x, y, z, material = stuccoMat) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    // Square garden enclosure: 34 x 34, with a low front wall and central gate.
    // Back garden wall
    wallBox(34, 2.7, 0.5, 0, 1.35, -16.7);
    wallBox(34.4, 0.18, 0.7, 0, 2.78, -16.7, stoneLightMat);
    // Side walls
    wallBox(0.5, 2.35, 34, -16.7, 1.18, 0);
    wallBox(0.5, 2.35, 34, 16.7, 1.18, 0);
    wallBox(0.7, 0.15, 34.4, -16.7, 2.4, 0, stoneLightMat);
    wallBox(0.7, 0.15, 34.4, 16.7, 2.4, 0, stoneLightMat);

    // Front wall, matching the height of the side walls, with a central gate.
    wallBox(14, 2.35, 0.5, -10, 1.175, 16.7);
    wallBox(14, 2.35, 0.5, 10, 1.175, 16.7);
    wallBox(14.4, 0.15, 0.7, -10, 2.4, 16.7, stoneLightMat);
    wallBox(14.4, 0.15, 0.7, 10, 2.4, 16.7, stoneLightMat);
    // Tall limestone gate piers
    for (const x of [-3.3, 3.3]) {
      wallBox(1.08, 0.32, 1.08, x, 0.16, 16.7, stoneEdgeMat);
      wallBox(0.78, 4.5, 0.78, x, 2.57, 16.7, stoneLightMat);
      wallBox(1.02, 0.2, 1.02, x, 4.95, 16.7, stoneLightMat);
      const finial = new THREE.Mesh(new THREE.SphereGeometry(0.22, 18, 12), stoneLightMat);
      finial.position.set(x, 5.25, 16.7);
      finial.castShadow = true;

    }
    // Front corner piers
    for (const x of [-16.7, 16.7]) {
      wallBox(0.82, 2.4, 0.82, x, 1.2, 16.7, stoneLightMat);
    }

    // Open European wrought-iron entrance gate
    const gateIronMat = new THREE.MeshStandardMaterial({
      color: 0xdfe4ea,
      roughness: 0.2,
      metalness: 0.5,
      side: THREE.DoubleSide,
    });
    const gateLeaf = new THREE.Group();
    const leafWidth = 2.7;
    const leafHeight = 4.9;
    const rail = (y, width = leafWidth) => {
      const bar = new THREE.Mesh(new THREE.BoxGeometry(width, 0.075, 0.055), gateIronMat);
      bar.position.set(-width / 2, y, 0);

    };
    rail(0.25);
    rail(1.6);
    rail(3.15);
    rail(4.75);
    for (const x of [0, -leafWidth]) {
      const post = new THREE.Mesh(new THREE.BoxGeometry(0.085, leafHeight, 0.07), gateIronMat);

    }
    for (let i = 1; i < 8; i++) {

      bar.position.set(x, 2.4, 0);

      const spear = new THREE.Mesh(new THREE.ConeGeometry(0.055, 0.16, 6), gateIronMat);

      spear.castShadow = true;

    }
    for (const [x, flip] of [[-0.72, 1], [-1.98, -1]]) {
      const scroll = new THREE.Mesh(
        new THREE.TorusGeometry(0.24, 0.022, 6, 20, Math.PI * 1.32),

      );

      scroll.rotation.z = flip > 0 ? -0.55 : Math.PI + 0.55;

      scroll.castShadow = true;

    }
    for (const [x, flip] of [[-0.72, 1], [-1.98, -1]]) {
      const scroll = new THREE.Mesh(
        new THREE.TorusGeometry(0.24, 0.022, 6, 20, Math.PI * 1.32),
        gateIronMat
      );
      scroll.position.set(x, 3.65, 0.02);
      scroll.rotation.z = flip > 0 ? -0.55 : Math.PI + 0.55;
      scroll.scale.x = flip;
      scroll.castShadow = true;
      gateLeaf.add(scroll);
    }
    const diagonal = new THREE.Mesh(new THREE.BoxGeometry(0.045, 4.2, 0.045), gateIronMat);
    diagonal.position.set(-leafWidth * 0.52, 2.4, 0.01);
    diagonal.rotation.z = 0.28;
    diagonal.castShadow = true;
    gateLeaf.add(diagonal);

    const rightLeaf = gateLeaf.clone(true);
    rightLeaf.position.set(2.82, 0, 16.58);
    rightLeaf.rotation.y = -1.08;
    scene.add(rightLeaf);
    const leftLeaf = gateLeaf.clone(true);
    leftLeaf.position.set(-2.82, 0, 16.58);
    leftLeaf.scale.x = -1;
    leftLeaf.rotation.y = 1.08;
    scene.add(leftLeaf);

    // A light wrought-iron arch joining the piers.
    const gateArchCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(-2.95, 4.95, 16.58),
      new THREE.Vector3(0, 5.65, 16.58),
      new THREE.Vector3(2.95, 4.95, 16.58),
    ]);
    const gateArch = new THREE.Mesh(new THREE.TubeGeometry(gateArchCurve, 30, 0.035, 6, false), gateIronMat);
    gateArch.castShadow = true;
    scene.add(gateArch);

    // Pilasters
    for (const x of [-14, -8, -2, 4, 10, 15]) {
      wallBox(0.58, 3.0, 0.68, x, 1.5, -16.05, stoneLightMat);
    }
    // Wall bench / stone ledge
    wallBox(8.4, 0.3, 0.8, -10.5, 0.45, -15.5, stoneLightMat);

    // Dense, random curtain vines spilling down from the wall tops.
    const vineLeafShape = new THREE.Shape();
    vineLeafShape.moveTo(0, -0.17);
    vineLeafShape.bezierCurveTo(-0.07, -0.12, -0.21, -0.08, -0.22, 0.02);
    vineLeafShape.bezierCurveTo(-0.23, 0.12, -0.11, 0.14, -0.045, 0.08);
    vineLeafShape.bezierCurveTo(-0.025, 0.19, 0.025, 0.19, 0.045, 0.08);
    vineLeafShape.bezierCurveTo(0.11, 0.14, 0.23, 0.12, 0.22, 0.02);
    vineLeafShape.bezierCurveTo(0.21, -0.08, 0.07, -0.12, 0, -0.17);
    const vineLeafGeo = new THREE.ShapeGeometry(vineLeafShape, 12);
    {
      const leafPosition = vineLeafGeo.attributes.position;
      for (let i = 0; i < leafPosition.count; i++) {
        const x = leafPosition.getX(i);
        const t = Math.min(1, Math.abs(x) / 0.22);
        leafPosition.setZ(i, 0.075 * (1 - t * t));
      }
      vineLeafGeo.computeVertexNormals();
    }
    const vineShades = [0x203d28, 0x2b4c30, 0x385c39, 0x466b43, 0x557a4c];
    const vineBuckets = vineShades.map(() => []);
    const vineStemMatrices = [];
    const vineStemMat = new THREE.MeshStandardMaterial({ color: 0x344b2d, roughness: 0.96 });
    const vineStemGeo = new THREE.CylinderGeometry(1, 1, 1, 5);
    const vineLeafDummy = new THREE.Object3D();
    const vineStemDummy = new THREE.Object3D();
    const vineUp = new THREE.Vector3(0, 1, 0);

    const vineSpecs = [
      { axis: 'x', start: -16.7, end: 16.7, fixed: -16.42, normal: [0, 0, 1], yaw: 0, top: 2.82, runs: 55 },
      { axis: 'z', start: -16.7, end: 16.7, fixed: -16.42, normal: [1, 0, 0], yaw: Math.PI / 2, top: 2.38, runs: 45 },
      { axis: 'z', start: -16.7, end: 16.7, fixed: 16.42, normal: [-1, 0, 0], yaw: -Math.PI / 2, top: 2.38, runs: 45 },
      { axis: 'x', start: -16.7, end: -3.1, fixed: 16.42, normal: [0, 0, -1], yaw: Math.PI, top: 2.38, runs: 22 },
      { axis: 'x', start: 3.1, end: 16.7, fixed: 16.42, normal: [0, 0, -1], yaw: Math.PI, top: 2.38, runs: 22 },
      { axis: 'x', start: -16.7, end: -3.1, fixed: 16.98, normal: [0, 0, 1], yaw: 0, top: 2.38, runs: 25, outer: true },
      { axis: 'x', start: 3.1, end: 16.7, fixed: 16.98, normal: [0, 0, 1], yaw: 0, top: 2.38, runs: 25, outer: true },
    ];

    function vinePoint(spec, along, y, inset = 0.045) {
      if (spec.axis === 'x') {
        return new THREE.Vector3(along, y, spec.fixed + spec.normal[2] * inset);
      }
      return new THREE.Vector3(spec.fixed + spec.normal[0] * inset, y, along);
    }

    function addVineLeafAt(spec, along, y, inset, yaw, horizontal = false) {
      vineLeafDummy.position.copy(vinePoint(
        spec,
        clamp(along, spec.start + 0.06, spec.end - 0.06),
        y,
        inset
      ));
      if (horizontal) {
        vineLeafDummy.rotation.set(
          -Math.PI / 2 + (random() - 0.5) * 0.7,
          random() * TAU,
          random() * TAU,
          'YXZ'
        );
      } else {
        vineLeafDummy.rotation.set(
          (random() - 0.5) * 1.25,
          yaw + (random() - 0.5) * 0.9,
          random() * TAU,
          'YXZ'
        );
      }
      const size = 0.3 + random() * 0.3;
      vineLeafDummy.scale.set(size * (0.8 + random() * 0.45), size, size);
      vineLeafDummy.updateMatrix();
      vineBuckets[Math.floor(random() * vineShades.length)].push(vineLeafDummy.matrix.clone());
    }

    function addVineLeaf(spec, along, y) {
      const offset = (random() - 0.5) * 0.42;
      addVineLeafAt(
        spec,
        along + offset,
        y + (random() - 0.5) * 0.25,
        0.04 + random() * 0.14,
        spec.yaw
      );
    }

    function addVineStemSegment(a, b) {
      const direction = b.clone().sub(a);
      const length = direction.length();
      if (length < 0.001) return;
      vineStemDummy.position.copy(a).add(b).multiplyScalar(0.5);
      vineStemDummy.quaternion.setFromUnitVectors(vineUp, direction.normalize());
      vineStemDummy.scale.set(0.012, length, 0.012);
      vineStemDummy.updateMatrix();
      vineStemMatrices.push(vineStemDummy.matrix.clone());
    }

    function growVine(spec, startAlong, startY, side, depth = 0) {
      let along = clamp(startAlong, spec.start + 0.1, spec.end - 0.1);
      let y = startY;
      let nearTop = 2 + Math.floor(random() * 4);
      const segments = 13 + Math.floor(random() * 10);
      const points = [];
      const nodeData = [];
      for (let i = 0; i < segments; i++) {
        if (i > 0) {
          if (i < nearTop) {
            along += side * (0.08 + random() * 0.16);
            y -= 0.02 + random() * 0.035;
          } else {
            along += side * (0.025 + random() * 0.09) + (random() - 0.5) * 0.22;
            y -= 0.1 + random() * 0.12;
          }
          if (along <= spec.start + 0.12 || along >= spec.end - 0.12) {
            side *= -1;
            along = clamp(along, spec.start + 0.14, spec.end - 0.14);
          }
          if (y < 0.25) break;
        }
        const point = vinePoint(spec, along, y, 0.045);
        points.push(point);
        nodeData.push({ along, y });
        if (i > 0) addVineStemSegment(points[i - 1], point);
        if (i > 0) {
          const depth = clamp((startY - y) / Math.max(0.8, startY - 0.2), 0, 1);
          const leafCount = depth < 0.18 ? 4 : depth < 0.4 ? 3 : depth < 0.68 ? 2 : (random() > 0.45 ? 1 : 0);
          for (let leafIndex = 0; leafIndex < leafCount; leafIndex++) {
            addVineLeaf(spec, along, y);
          }
          if (depth < 0.35 && random() > 0.35) addVineLeaf(spec, along, y);
        }
      }

      // Side branches make the curtain spread left and right as it descends.
      if (depth < 2 && points.length > 5) {
        const branchCount = 2 + Math.floor(random() * 2);
        for (let b = 0; b < branchCount; b++) {
          const node = nodeData[3 + Math.floor(random() * (nodeData.length - 4))];
          if (!node) continue;
          let bu = node.along;
          let by = node.y;
          const bside = random() > 0.5 ? 1 : -1;
          const bpoints = [vinePoint(spec, bu, by, 0.05)];
          const branchSegments = 4 + Math.floor(random() * 5);
          for (let i = 0; i < branchSegments; i++) {
            bu = clamp(bu + bside * (0.07 + random() * 0.14) + (random() - 0.5) * 0.08, spec.start + 0.1, spec.end - 0.1);
            by -= 0.035 + random() * 0.08;
            if (by < 0.25) break;
            const bp = vinePoint(spec, bu, by, 0.05);
            bpoints.push(bp);
            addVineStemSegment(bpoints[bpoints.length - 2], bp);
            const branchDepth = clamp((spec.top - by) / Math.max(0.8, spec.top - 0.2), 0, 1);
            const branchLeafCount = branchDepth < 0.32 ? 2 : branchDepth < 0.65 ? 1 : (random() > 0.5 ? 1 : 0);
            for (let leafIndex = 0; leafIndex < branchLeafCount; leafIndex++) {
              addVineLeaf(spec, bu, by);
            }
          }
        }
      }
    }

    for (const spec of vineSpecs) {
      const span = spec.end - spec.start;
      for (let run = 0; run < spec.runs; run++) {
        const start = spec.start + (run + 0.15 + random() * 0.7) * (span / spec.runs);
        const side = random() > 0.5 ? 1 : -1;
        growVine(spec, start, spec.top + random() * 0.06, side, 0);
      }
      // Extra leaf clusters right at the coping edge.
      for (let i = 0; i < spec.runs * 2; i++) {
        const along = spec.start + random() * span;
        addVineLeaf(spec, along, spec.top - random() * 0.18);
      }

      if (!spec.outer) {
        // Leaves spread across the coping and spill over both faces.
        for (let i = 0; i < spec.runs * 2; i++) {
          const along = spec.start + random() * span;
          const inset = -0.56 + random() * 0.58;
          addVineLeafAt(
            spec,
            along,
            spec.top + 0.015 + random() * 0.09,
            inset,
            spec.yaw,
            random() > 0.22
          );
          if (random() > 0.6) {
            addVineLeafAt(spec, along, spec.top - 0.08, inset, spec.yaw + Math.PI, false);
          }
        }

        // A few tendrils climb over the cap and hang down the outer face.
        for (let cross = 0; cross < 5; cross++) {
          const along = spec.start + 0.4 + random() * (span - 0.8);
          const overPoints = [
            vinePoint(spec, along, spec.top - 0.32, 0.055),

          for (let p = 1; p < overPoints.length; p++) {

          addVineLeafAt(spec, along, spec.top - 0.26, 0.08, spec.yaw, false);

    const vineStems = new THREE.InstancedMesh(vineStemGeo, vineStemMat, vineStemMatrices.length);

    // Dense, mixed woodland on the distant hills: conifers and broadleaf trees

    const coniferShades = [0x243b2a, 0x2f4a33, 0x3b573c, 0x1f3428];

    for (let shadeIndex = 0; shadeIndex < coniferShades.length; shadeIndex++) {

    const broadleafShades = [0x4d6444, 0x60774e, 0x758a5a, 0x3f583a];

    for (let i = 0; i < broadleafCount; i++) {

    const broadleafTrunkGeo = new THREE.CylinderGeometry(0.11, 0.18, 2.3, 7);

    const broadleafCanopyGeo = new THREE.IcosahedronGeometry(1, 1);

    broadleafBuckets.forEach((matrices, shadeIndex) => {

    // Weathered limestone planters
    function addStonePlanter(x, z, w, d, rotation = 0) {
      const group = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(w, 0.58, d), stoneMat);
      body.position.y = 0.29;

    // ---------------------------------------------------------------------
    // A small stone bench on the far side of the fountain
    // ---------------------------------------------------------------------
    const bench = new THREE.Group();
    const benchTop = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.18, 0.72), stoneLightMat);
    benchTop.position.y = 0.62;
    benchTop.castShadow = true;
    benchTop.receiveShadow = true;

    // Replace the simple stone bench with the supplied ornate garden chair.
    const chairRoot = new THREE.Group();
    chairRoot.name = 'GardenChair';
    chairRoot.scale.setScalar(5.2);
    chairRoot.position.set(0, 0, -12.8);
    scene.add(chairRoot);
    const chairLoader = new GLTFLoader();
    console.log('[Chair] Loading GLB: ./chair.glb');
    chairLoader.load(
      './chair.glb',
      (gltf) => {
        const model = gltf.scene;
        model.traverse((obj) => {
          if (!obj.isMesh) return;
          obj.castShadow = false;
          obj.receiveShadow = true;
          const materials = Array.isArray(obj.material) ? obj.material : [obj.material];
          for (const material of materials) {
            if (!material) continue;
            try {
              if (material.map && material.map.image) {
                const source = material.map.image;
                const maxSize = 2048;
                const ratio = Math.min(1, maxSize / Math.max(source.width, source.height));
                const width = Math.max(1, Math.round(source.width * ratio));
                const height = Math.max(1, Math.round(source.height * ratio));
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                ctx.drawImage(source, 0, 0, width, height);
                const image = ctx.getImageData(0, 0, width, height);
                const data = image.data;
                for (let i = 0; i < data.length; i += 4) {
                  const r = data[i] / 255;
                  const g = data[i + 1] / 255;
                  const b = data[i + 2] / 255;
                  const luminance = 0.2126 * r + 0.7152 * g + 0.0722 * b;
                  const shade = 0.84 + Math.min(1, luminance) * 0.12;
                  const mix = 0.96;
                  data[i] = Math.round((r * 255) * (1 - mix) + 206 * shade * mix);
                  data[i + 1] = Math.round((g * 255) * (1 - mix) + 201 * shade * mix);
                  data[i + 2] = Math.round((b * 255) * (1 - mix) + 190 * shade * mix);
                }
                ctx.putImageData(image, 0, 0);
                const creamMap = new THREE.CanvasTexture(canvas);
                creamMap.flipY = material.map.flipY;
                creamMap.colorSpace = material.map.colorSpace;
                creamMap.wrapS = material.map.wrapS;
                creamMap.wrapT = material.map.wrapT;
                creamMap.repeat.copy(material.map.repeat);
                creamMap.offset.copy(material.map.offset);
                creamMap.center.copy(material.map.center);
                creamMap.rotation = material.map.rotation;
                creamMap.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
                material.map = creamMap;
              }
              material.color.set(0xf1eee7);
              material.metalness = 0.01;
              material.roughness = 0.82;
              material.metalnessMap = null;
              material.roughnessMap = null;
              material.needsUpdate = true;
            } catch (error) {
              console.warn('[Chair] Could not recolor GLB texture; using warm cream tint.', error);
              material.color.set(0xe3ded3);
              material.metalness = 0.01;
              material.roughness = 0.82;
            }
          }
        });
        chairRoot.add(model);
        bench.visible = false;
        console.log('[Chair] GLB loaded successfully; stone bench replaced.');
      },
      undefined,
      (error) => {
        console.warn('[Chair] GLB failed to load; keeping the stone bench fallback.', error);
      }
    );

    // ---------------------------------------------------------------------
    // Two garden statues at the far ends of the left and right walkways
    // ---------------------------------------------------------------------
    const statueGroundY = 0.04;
    const statueSites = [
      { x: -15.25, z: 0, rotation: Math.PI / 2 },
      { x: 15.25, z: 0, rotation: -Math.PI / 2 },
    ];

    const statueLoader = new GLTFLoader();
    console.log('[Statues] Loading GLB: ./雕像.glb');
    statueLoader.load(
      './雕像.glb',
      (gltf) => {
        const model = gltf.scene;
        model.traverse((obj) => {
          if (!obj.isMesh) return;
          obj.castShadow = true;
          obj.receiveShadow = true;
          const materials = Array.isArray(obj.material) ? obj.material : [obj.material];
          for (const material of materials) {
            if (!material) continue;
            material.roughness = Math.max(material.roughness ?? 0.8, 0.62);
            material.metalness = Math.min(material.metalness ?? 0.0, 0.08);

          }
        });
        model.updateMatrixWorld(true);
        const bounds = new THREE.Box3().setFromObject(model);
        const size = new THREE.Vector3();
        bounds.getSize(size);
        const targetHeight = 3.36;
        const scale = targetHeight / Math.max(0.0001, size.y);
        model.position.y = -bounds.min.y;

        const template = new THREE.Group();
        template.add(model);
        template.scale.setScalar(scale);

        for (const site of statueSites) {
          const statue = template.clone(true);
          statue.name = site.x < 0 ? 'GardenStatueLeft' : 'GardenStatueRight';
          statue.position.set(site.x, statueGroundY, site.z);
          statue.rotation.y = site.rotation;

      (error) => {

    // ---------------------------------------------------------------------
    // Yuri seated on the ornate garden chair
    // ---------------------------------------------------------------------
    let yuriVRM = null;
    let yuriRoot = null;
    const yuriLoader = new GLTFLoader();
    yuriLoader.register((parser) => new VRMLoaderPlugin(parser));
    console.log('[Yuri] Loading VRM: ./yuri.vrm');
    yuriLoader.load(
      './yuri.vrm',
      (gltf) => {
        const vrm = gltf.userData.vrm;
        if (!vrm) throw new Error('VRM data missing for Yuri.');
        yuriVRM = vrm;
        vrm.scene.traverse((object) => {
          if (!object.isMesh && !object.isSkinnedMesh) return;
          object.frustumCulled = false;
          object.castShadow = true;
          object.receiveShadow = true;
          const materials = Array.isArray(object.material) ? object.material : [object.material];
          for (const material of materials) {
            if (!material) continue;
            if (material.isOutline) {
              material.colorWrite = false;
              material.depthWrite = false;
              material.opacity = 0;
              material.transparent = true;
              material.needsUpdate = true;
              continue;
            }
            if (material.map) {
              material.map.anisotropy = 8;
              material.map.needsUpdate = true;
            }
            if (material.emissive) material.emissive.setRGB(0, 0, 0);
            if ('emissiveIntensity' in material) material.emissiveIntensity = 0;
            material.needsUpdate = true;
          }
        });

        vrm.scene.updateMatrixWorld(true);
        const bounds = new THREE.Box3().setFromObject(vrm.scene);
        const size = new THREE.Vector3();
        bounds.getSize(size);
        const scale = 4.732 / Math.max(0.001, size.y);
        vrm.scene.scale.setScalar(scale);
        vrm.scene.updateMatrixWorld(true);
        const scaledBounds = new THREE.Box3().setFromObject(vrm.scene);
        vrm.scene.position.y = -scaledBounds.min.y;

        const humanoid = vrm.humanoid;
        humanoid.resetNormalizedPose();
        const rest = (name) => humanoid.getNormalizedBoneNode(name)?.quaternion.clone() ?? null;
        const qx = (angle) => new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), angle);
        const qy = (angle) => new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), angle);
        const qz = (angle) => new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), angle);
        const poseBone = (name, rotation) => {
          const node = humanoid.getNormalizedBoneNode(name);
          const base = rest(name);
          if (node && base) node.quaternion.copy(base).multiply(rotation).normalize();
        };

        // Seated pose: thighs forward, knees down, hands resting on the lap.
        poseBone('leftUpperLeg', qx(-1.34).multiply(qz(-0.05)));
        poseBone('rightUpperLeg', qx(-1.34).multiply(qz(0.05)));
        poseBone('leftLowerLeg', qx(1.3));
        poseBone('rightLowerLeg', qx(1.3));
        poseBone('leftFoot', qx(0.08));
        poseBone('rightFoot', qx(0.08));
        poseBone('leftUpperArm', qz(-1.14).multiply(qx(-0.16)));
        poseBone('rightUpperArm', qz(1.14).multiply(qx(-0.16)));
        poseBone('leftLowerArm', qy(-0.5));
        poseBone('rightLowerArm', qy(0.5));
        poseBone('spine', qx(0.03));
        poseBone('chest', qx(0.02));
        poseBone('head', qx(-0.03));

        yuriRoot = new THREE.Group();
        yuriRoot.name = 'YuriOnChair';
        yuriRoot.position.set(0, 0, -12.48);
        yuriRoot.rotation.y = 0;
        yuriRoot.add(vrm.scene);
        scene.add(yuriRoot);
        vrm.update(0);
        // Keep Yuri's hips on the chair seat after matching the audience scale.
        const hipNode = humanoid.getNormalizedBoneNode('hips');
        if (hipNode) {
          const hipWorld = new THREE.Vector3();
          hipNode.getWorldPosition(hipWorld);
          yuriRoot.position.y += 1.96 - hipWorld.y;
        }
        window.__yuri = yuriRoot;
        window.__yuriVRM = vrm;
        console.log('[Yuri] VRM seated on the garden chair.');
      },
      undefined,
      (error) => console.warn('[Yuri] VRM failed to load.', error)
    );

    // ---------------------------------------------------------------------
    // Fixed late-afternoon light
    // ---------------------------------------------------------------------
    const warmSun = new THREE.Color(0xfff1d7);
    const goldSun = new THREE.Color(0xff9a4f);
    const warmHorizon = new THREE.Color(0xffd2a0);
    const goldHorizon = new THREE.Color(0xffbe7a);
    const warmZenith = new THREE.Color(0x94bfd8);
    const goldZenith = new THREE.Color(0x88b4ce);
    const fogWarm = new THREE.Color(0xf3e7d3);
    const fogGold = new THREE.Color(0xf6dab6);
    const hemiSky = new THREE.Color(0xd6e9f2);
    const sunDirection = new THREE.Vector3();
    let baseElevation = 0;
    let baseAzimuth = 0;

    function positionSun(elevation, azimuth) {
      const radius = 31;
      sun.position.set(
        Math.cos(elevation) * Math.cos(azimuth) * radius,
        Math.sin(elevation) * radius,
        Math.cos(elevation) * Math.sin(azimuth) * radius
      );
      sunDirection.copy(sun.position).normalize();
      skyUniforms.uSunDir.value.copy(sunDirection);
    }

    function applySun(value) {
      baseElevation = lerp(42, 30, value) * DEG;
      baseAzimuth = lerp(138, 124, value) * DEG;
      positionSun(baseElevation, baseAzimuth);
      sun.color.lerpColors(warmSun, goldSun, value);
      sun.intensity = lerp(5.4, 4.8, value);
      hemi.intensity = lerp(1.35, 1.1, value);
      hemi.color.lerpColors(hemiSky, goldHorizon, value * 0.45);
      hemi.groundColor.setHex(0x5c4a33);
      coolFill.intensity = lerp(0.35, 0.5, value);
      skyUniforms.uHorizon.value.lerpColors(warmHorizon, goldHorizon, value);
      skyUniforms.uZenith.value.lerpColors(warmZenith, goldZenith, value);
      renderer.toneMappingExposure = lerp(1.22, 1.28, value);
    }
    applySun(0.78);

    function makeGlowTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
      gradient.addColorStop(0, 'rgba(255,255,255,1)');
      gradient.addColorStop(0.18, 'rgba(255,255,255,0.75)');
      gradient.addColorStop(0.55, 'rgba(255,255,255,0.18)');
      gradient.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 128, 128);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }
    const glowTexture = makeGlowTexture();

    // Warm golden haze at the far edge of the garden.
    const hazeSprites = [];
    for (let i = 0; i < 9; i++) {
      const material = new THREE.SpriteMaterial({
        map: glowTexture,
        color: 0xf6d7a9,
        transparent: true,
        opacity: 0.075 + random() * 0.055,
        depthWrite: false,
        depthTest: true,
        fog: false,
        blending: THREE.NormalBlending,
      });
      const haze = new THREE.Sprite(material);
      haze.position.set(-28 + i * 7 + random() * 2, 2.1 + random() * 2.8, -33 - random() * 8);
      haze.scale.set(15 + random() * 7, 3.4 + random() * 2.8, 1);
      haze.renderOrder = 3;
      scene.add(haze);
      hazeSprites.push(haze);
    }

    // Sparse, sunlit dust drifting slowly along the light direction.
    const dustCount = 170;
    const dustPositions = new Float32Array(dustCount * 3);
    const dustSeeds = [];
    const dustVolume = { minX: -15, maxX: 4, minY: 0.35, maxY: 7.5, minZ: -1, maxZ: 16 };
    const dustDirection = new THREE.Vector3();

    function resetDustParticle(i) {
      dustPositions[i * 3] = lerp(dustVolume.minX, dustVolume.maxX, random());
      dustPositions[i * 3 + 1] = lerp(dustVolume.minY, dustVolume.maxY, random());
      dustPositions[i * 3 + 2] = lerp(dustVolume.minZ, dustVolume.maxZ, random());
      dustSeeds[i] = {
        phase: random() * TAU,
        speed: 0.35 + random() * 0.7,
      };
    }
    for (let i = 0; i < dustCount; i++) resetDustParticle(i);

    const dustGeometry = new THREE.BufferGeometry();
    dustGeometry.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
    const dustMaterial = new THREE.PointsMaterial({
      map: glowTexture,
      color: 0xffe5b7,
      size: 0.105,
      transparent: true,
      opacity: 0.46,
      depthWrite: false,
      depthTest: true,
      blending: THREE.AdditiveBlending,
      sizeAttenuation: true,
    });
    const lightDust = new THREE.Points(dustGeometry, dustMaterial);
    lightDust.frustumCulled = false;
    lightDust.renderOrder = 4;
    scene.add(lightDust);

    function updateLightDust(delta, time) {
      dustDirection.copy(sunDirection).multiplyScalar(-1);
      const dt = Math.min(delta, 0.05);
      const positions = dustGeometry.attributes.position.array;
      for (let i = 0; i < dustCount; i++) {
        const seed = dustSeeds[i];
        const idx = i * 3;
        positions[idx] += dustDirection.x * 0.055 * seed.speed * dt
          + Math.sin(time * 0.22 + seed.phase) * 0.008 * dt;
        positions[idx + 1] += dustDirection.y * 0.035 * seed.speed * dt
          + Math.cos(time * 0.18 + seed.phase) * 0.006 * dt;
        positions[idx + 2] += dustDirection.z * 0.055 * seed.speed * dt
          + Math.cos(time * 0.2 + seed.phase) * 0.007 * dt;

        if (positions[idx] < dustVolume.minX - 1 || positions[idx] > dustVolume.maxX + 1
          || positions[idx + 1] < dustVolume.minY - 0.4
          || positions[idx + 1] > dustVolume.maxY + 0.8
          || positions[idx + 2] < dustVolume.minZ - 1
          || positions[idx + 2] > dustVolume.maxZ + 1) {
          resetDustParticle(i);
        }
      }
      dustGeometry.attributes.position.needsUpdate = true;
    }

    // ---------------------------------------------------------------------
    // Audience: the same VRM character, walking clip and bottom-right joystick
    // used in A Pond of Tears, adapted to the garden's human scale.
    // ---------------------------------------------------------------------
    const audience = createAudience({
      position: new THREE.Vector3(0, 0.04, 11.8),
      rotation: Math.PI,
      onReady: () => console.log('[Audience] VRM and walking clip ready.'),
      onError: (error) => console.warn('[Audience] Failed to load audience.', error),
    });
    scene.add(audience);
    audience.userData.setFenceCollision?.(false);
    const gardenObstacles = [];
    const treeColliders = [

    // Watering can on the left-hand walkway beside the fountain.
    let wateringCanPrompt = null;

    // ---------------------------------------------------------------------

    const FLOWER_STYLES = {
      sunflower: { height: 2.2, color: 0xf0b93e, center: 0x4b2d17, petals: 14, radius: 0.38 },

    const flowerPetalGeo = new THREE.SphereGeometry(1, 6, 4);

    const flowerStemMat = new THREE.MeshStandardMaterial({ color: 0x4f743e, roughness: 0.9 });
    const flowerCenterMat = new THREE.MeshStandardMaterial({ color: 0xe5c23d, roughness: 0.72 });
    const flowerMatCache = new Map();

    const bloomAnimations = [];

    const MAX_BLOOMS = 1200;
    const FLOWER_TYPES = [
      'rose', 'hydrangea', 'peony', 'monthlyRose', 'sunflower', 'dragonhead',
      'foxglove', 'lavender', 'cleome', 'plumbago', 'jasmine', 'marguerite', 'daisy',

    const flowerLawns = [

    let coverageAdded = 0;

      for (const cluster of flowerClusters) {
        if (Math.abs(cluster.x - lawn.x) <= 3.0 && Math.abs(cluster.z - lawn.z) <= 2.2) {
          present.add(cluster.type);
        }

      const missing = FLOWER_TYPES.filter((type) => !present.has(type));
      for (let i = 0; i < missing.length; i++) {
        const col = i % 4;
        const row = Math.floor(i / 4);
        flowerClusters.push({
          x: lawn.x - 1.8 + col * 1.2 + (random() - 0.5) * 0.24,
          z: lawn.z - 1.15 + row * 1.05 + (random() - 0.5) * 0.2,
          type: missing[i],
          bloomed: false,
          heightOffset: (random() - 0.5) * 0.38,

        });

    }
    window.__flowerClusters = flowerClusters;
    window.__flowerCoverage = {
      total: flowerClusters.length,

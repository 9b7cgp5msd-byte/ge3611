    ));
    const lanceolateStemMat = new THREE.MeshStandardMaterial({ color: 0x5b7d45, roughness: 0.92 });
    const lanceolateStemGeo = new THREE.CylinderGeometry(1, 1, 1, 5);

    function addFalseDragonheadClumps() {
      const group = new THREE.Group();
      group.position.y = 0.05;
      scene.add(group);
      const clumpPositions = [];
      const exclusions = [
        [-9.2, 12.3, 2.6],
        [11.8, 12.8, 2.6],
        [-13.8, -12.5, 1.5],
        [13.3, -13.2, 1.5],
        [-14.7, 8.9, 1.5],
        [14.2, 8.4, 1.5],
        [-10.8, -14.2, 1.7],
        [-12.5, -4.8, 1.8],
        [-13.1, 0.3, 1.9],
        [0, -12.8, 1.7],
      ];
      let attempts = 0;
      while (clumpPositions.length < 55 && attempts < 30000) {
        attempts++;
        const x = -15.2 + random() * 30.4;
        const z = -15.2 + random() * 30.4;
        if (Math.abs(x) < 2.25 || Math.abs(z) < 2.25) continue;
        if (Math.hypot(x, z) < 6.65) continue;
        let blocked = false;
        for (const [ex, ez, radius] of exclusions) {
          if (Math.hypot(x - ex, z - ez) < radius) { blocked = true; break; }
        }
        if (blocked) continue;
        for (const p of clumpPositions) {
          if (Math.hypot(x - p.x, z - p.z) < 0.65) { blocked = true; break; }
        }
        if (blocked) continue;
        for (const p of scatteredFoliagePositions) {
          if (Math.hypot(x - p.x, z - p.z) < 0.35) { blocked = true; break; }
        }
        if (!blocked) clumpPositions.push({ x, z });
      }

      const leafBuckets = lanceolateLeafMats.map(() => []);
      const stemMatrices = [];
      const leafDummy = new THREE.Object3D();
      const stemDummy = new THREE.Object3D();
      const up = new THREE.Vector3(0, 1, 0);

      function addStem(a, b, radius) {
        const direction = b.clone().sub(a);
        const length = direction.length();
        if (length < 0.001) return;
        stemDummy.position.copy(a).add(b).multiplyScalar(0.5);
        stemDummy.quaternion.setFromUnitVectors(up, direction.normalize());
        stemDummy.scale.set(radius, length, radius);
        stemDummy.updateMatrix();
        stemMatrices.push(stemDummy.matrix.clone());
      }

      for (const point of clumpPositions) {
        const stemCount = 6 + Math.floor(random() * 4);
        for (let s = 0; s < stemCount; s++) {
          const stemAngle = (s / stemCount) * TAU + random() * 0.5;
          const stemRadius = 0.09 + random() * 0.1;
          const baseX = point.x + Math.cos(stemAngle) * stemRadius;
          const baseZ = point.z + Math.sin(stemAngle) * stemRadius;
          const height = 0.82 + random() * 0.5;
          const leanX = (random() - 0.5) * 0.05;
          const leanZ = (random() - 0.5) * 0.05;
          const top = new THREE.Vector3(baseX + leanX * height, 0.08 + height, baseZ + leanZ * height);
          addStem(new THREE.Vector3(baseX, 0.06, baseZ), top, 0.009 + random() * 0.004);

          const nodeCount = 6 + Math.floor(random() * 3);
          const baseLeafAngle = random() * TAU;
          for (let node = 1; node <= nodeCount; node++) {
            const t = node / (nodeCount + 1);
            const y = 0.16 + (height - 0.25) * t;
            const leafAngle = baseLeafAngle + (node % 2) * Math.PI / 2;
            const stemPoint = new THREE.Vector3(
              baseX + leanX * y,
              y,
              baseZ + leanZ * y
            );
            for (const sign of [-1, 1]) {
              const a = leafAngle + (sign > 0 ? 0 : Math.PI);
              const tipDir = new THREE.Vector3(
                Math.cos(a) * (0.7 + random() * 0.2),
                0.12 + random() * 0.18,
                Math.sin(a) * (0.7 + random() * 0.2)
              ).normalize();
              leafDummy.position.copy(stemPoint).add(new THREE.Vector3(Math.cos(a) * 0.012, 0, Math.sin(a) * 0.012));
              leafDummy.quaternion.setFromUnitVectors(up, tipDir);
              leafDummy.rotateY(random() * TAU);
              const leafScale = (0.78 + random() * 0.25) * (1.05 - t * 0.3);
              leafDummy.scale.set(leafScale, leafScale, leafScale);
              leafDummy.updateMatrix();
              leafBuckets[Math.floor(random() * leafBuckets.length)].push(leafDummy.matrix.clone());
            }
          }
        }
      }

      leafBuckets.forEach((matrices, index) => {
        if (!matrices.length) return;
        const leaves = new THREE.InstancedMesh(lanceolateLeafGeo, lanceolateLeafMats[index], matrices.length);
        matrices.forEach((matrix, i) => leaves.setMatrixAt(i, matrix));
        leaves.instanceMatrix.needsUpdate = true;
        leaves.castShadow = true;
        leaves.receiveShadow = true;
        group.add(leaves);
      });
      const stems = new THREE.InstancedMesh(lanceolateStemGeo, lanceolateStemMat, stemMatrices.length);
      stemMatrices.forEach((matrix, i) => stems.setMatrixAt(i, matrix));
      stems.instanceMatrix.needsUpdate = true;
      stems.castShadow = true;
      group.add(stems);
      scatteredFoliagePositions.push(...clumpPositions);
      registerFlowerClusters(clumpPositions, 'dragonhead');
    }

    addFalseDragonheadClumps();

    // Airy spider-flower foliage: upright stems, branching tiers and loose
    // palmately divided leaflets. No butterfly-like flowers.
    const cleomeLeafPositions = [];
    const cleomeLeafletCount = 6;
    for (let k = 0; k < cleomeLeafletCount; k++) {
      const angle = -1.12 + (k / (cleomeLeafletCount - 1)) * 2.24;
      const length = 0.21 + (k % 3) * 0.022;
      const halfWidth = 0.018 + (k % 2) * 0.006;
      const bx = Math.sin(angle);
      const by = Math.cos(angle);
      const sideX = Math.cos(angle) * halfWidth;
      const sideY = -Math.sin(angle) * halfWidth;
      cleomeLeafPositions.push(
        0, 0.01, 0,
        bx * length + sideX, by * length + sideY, 0,
        bx * length - sideX, by * length - sideY, 0
      );
    }
    const cleomeLeafGeo = new THREE.BufferGeometry();
    cleomeLeafGeo.setAttribute('position', new THREE.Float32BufferAttribute(cleomeLeafPositions, 3));
    cleomeLeafGeo.computeVertexNormals();
    const cleomeShades = [0x6f9c59, 0x7eab67, 0x608d4c];
    const cleomeMats = cleomeShades.map((color) => new THREE.MeshStandardMaterial({
      color,
      roughness: 0.92,
      side: THREE.DoubleSide,
    }));
    const cleomeStemMat = new THREE.MeshStandardMaterial({ color: 0x6d9157, roughness: 0.93 });
    const cleomeStemGeo = new THREE.CylinderGeometry(1, 1, 1, 4);

    function addCleomeClumps() {
      const group = new THREE.Group();
      group.position.y = 0.05;
      scene.add(group);
      const clumpPositions = [];
      const exclusions = [
        [-9.2, 12.3, 2.6],
        [11.8, 12.8, 2.6],
        [-13.8, -12.5, 1.5],
        [13.3, -13.2, 1.5],
        [-14.7, 8.9, 1.5],
        [14.2, 8.4, 1.5],
        [-10.8, -14.2, 1.7],
        [-12.5, -4.8, 1.8],
        [-13.1, 0.3, 1.9],
        [0, -12.8, 1.7],
      ];
      let attempts = 0;
      while (clumpPositions.length < 35 && attempts < 18000) {
        attempts++;
        const x = -15.2 + random() * 30.4;
        const z = -15.2 + random() * 30.4;
        if (Math.abs(x) < 2.25 || Math.abs(z) < 2.25) continue;
        if (Math.hypot(x, z) < 6.65) continue;
        let blocked = false;
        for (const [ex, ez, radius] of exclusions) {
          if (Math.hypot(x - ex, z - ez) < radius) { blocked = true; break; }
        }
        if (blocked) continue;
        for (const p of clumpPositions) {
          if (Math.hypot(x - p.x, z - p.z) < 0.7) { blocked = true; break; }
        }
        if (blocked) continue;
        for (const p of scatteredFoliagePositions) {
          if (Math.hypot(x - p.x, z - p.z) < 0.35) { blocked = true; break; }
        }
        if (!blocked) clumpPositions.push({ x, z });
      }

      const leafBuckets = cleomeMats.map(() => []);
      const stemMatrices = [];
      const leafDummy = new THREE.Object3D();
      const stemDummy = new THREE.Object3D();
      const up = new THREE.Vector3(0, 1, 0);

      function addStem(a, b, radius) {
        const direction = b.clone().sub(a);
        const length = direction.length();
        if (length < 0.001) return;
        stemDummy.position.copy(a).add(b).multiplyScalar(0.5);
        stemDummy.quaternion.setFromUnitVectors(up, direction.normalize());
        stemDummy.scale.set(radius, length, radius);
        stemDummy.updateMatrix();
        stemMatrices.push(stemDummy.matrix.clone());
      }

      function addPalmLeaf(position, tipDirection, scale) {
        leafDummy.position.copy(position);
        leafDummy.quaternion.setFromUnitVectors(up, tipDirection.clone().normalize());
        leafDummy.rotateY(random() * TAU);
        const lengthScale = scale * (0.75 + random() * 0.45);
        const widthScale = scale * (0.85 + random() * 0.35);
        leafDummy.scale.set(widthScale, lengthScale, scale);
        leafDummy.updateMatrix();
        leafBuckets[Math.floor(random() * cleomeMats.length)].push(leafDummy.matrix.clone());
      }

      for (const point of clumpPositions) {
        const mainStems = 1 + Math.floor(random() * 3);
        for (let m = 0; m < mainStems; m++) {
          const mainAngle = random() * TAU;
          const stemHeight = 0.75 + random() * 0.45;
          const baseX = point.x + Math.cos(mainAngle) * 0.05;
          const baseZ = point.z + Math.sin(mainAngle) * 0.05;
          const leanX = (random() - 0.5) * 0.07;
          const leanZ = (random() - 0.5) * 0.07;
          const top = new THREE.Vector3(baseX + leanX * stemHeight, 0.08 + stemHeight, baseZ + leanZ * stemHeight);
          addStem(new THREE.Vector3(baseX, 0.06, baseZ), top, 0.011 + random() * 0.004);

          const branches = 7 + Math.floor(random() * 4);
          for (let b = 0; b < branches; b++) {
            const t = 0.24 + random() * 0.68;
            const base = new THREE.Vector3(
              baseX + leanX * stemHeight * t,
              0.08 + stemHeight * t,
              baseZ + leanZ * stemHeight * t
            );
            const angle = random() * TAU;
            const reach = 0.25 + random() * 0.3;
            const mid = new THREE.Vector3(
              base.x + Math.cos(angle) * reach * 0.5,
              base.y + 0.12 + random() * 0.15,
              base.z + Math.sin(angle) * reach * 0.5
            );
            const tip = new THREE.Vector3(
              base.x + Math.cos(angle) * reach,
              base.y + 0.22 + random() * 0.24,
              base.z + Math.sin(angle) * reach
            );
            addStem(base, mid, 0.0055);
            addStem(mid, tip, 0.0035);
            const leafCount = 2 + Math.floor(random() * 2);
            for (let l = 0; l < leafCount; l++) {
              const leafAngle = angle + (random() - 0.5) * 1.4;
              const tipDir = new THREE.Vector3(
                Math.cos(leafAngle) * (0.5 + random() * 0.35),
                0.12 + random() * 0.28,
                Math.sin(leafAngle) * (0.5 + random() * 0.35)
              ).normalize();
              addPalmLeaf(tip, tipDir, 0.8 + random() * 0.5);
            }
          }
        }
      }

      leafBuckets.forEach((matrices, index) => {
        if (!matrices.length) return;
        const leaves = new THREE.InstancedMesh(cleomeLeafGeo, cleomeMats[index], matrices.length);
        matrices.forEach((matrix, i) => leaves.setMatrixAt(i, matrix));
        leaves.instanceMatrix.needsUpdate = true;
        leaves.castShadow = true;
        leaves.receiveShadow = true;
        group.add(leaves);
      });
      const stems = new THREE.InstancedMesh(cleomeStemGeo, cleomeStemMat, stemMatrices.length);
      stemMatrices.forEach((matrix, i) => stems.setMatrixAt(i, matrix));
      stems.instanceMatrix.needsUpdate = true;
      stems.castShadow = true;
      group.add(stems);
      scatteredFoliagePositions.push(...clumpPositions);
      registerFlowerClusters(clumpPositions, 'cleome');
    }

    addCleomeClumps();

    // Low basal daisy rosettes: spoon-shaped pale green leaves hugging the
    // ground in a flat rosette. No small flowers.
    const daisyLeafShape = new THREE.Shape();
    daisyLeafShape.moveTo(0, 0);
    daisyLeafShape.bezierCurveTo(-0.02, 0.04, -0.035, 0.1, -0.055, 0.15);
    daisyLeafShape.bezierCurveTo(-0.075, 0.19, -0.055, 0.24, 0, 0.26);
    daisyLeafShape.bezierCurveTo(0.055, 0.24, 0.075, 0.19, 0.055, 0.15);
    daisyLeafShape.bezierCurveTo(0.035, 0.1, 0.02, 0.04, 0, 0);
    const daisyLeafGeo = new THREE.ShapeGeometry(daisyLeafShape, 8);
    const daisyLeafMats = [0x91bc74, 0xa0c887, 0x80a963].map((color) => (
      new THREE.MeshStandardMaterial({ color, roughness: 0.92, side: THREE.DoubleSide })
    ));

    function addDaisyRosettes() {
      const group = new THREE.Group();
      group.position.y = 0.04;
      scene.add(group);
      const clumpPositions = [];
      const exclusions = [
        [-9.2, 12.3, 2.5],
        [11.8, 12.8, 2.5],
        [-13.8, -12.5, 1.4],
        [13.3, -13.2, 1.4],
        [-14.7, 8.9, 1.4],
        [14.2, 8.4, 1.4],
        [-10.8, -14.2, 1.6],
        [-12.5, -4.8, 1.7],
        [-13.1, 0.3, 1.8],
        [0, -12.8, 1.6],
      ];
      let attempts = 0;
      while (clumpPositions.length < 55 && attempts < 22000) {
        attempts++;
        const x = -15.5 + random() * 31;
        const z = -15.5 + random() * 31;
        if (Math.abs(x) < 2.05 || Math.abs(z) < 2.05) continue;
        if (Math.hypot(x, z) < 6.45) continue;
        let blocked = false;
        for (const [ex, ez, radius] of exclusions) {
          if (Math.hypot(x - ex, z - ez) < radius) { blocked = true; break; }
        }
        if (blocked) continue;
        for (const p of clumpPositions) {
          if (Math.hypot(x - p.x, z - p.z) < 0.45) { blocked = true; break; }
        }
        if (!blocked) clumpPositions.push({ x, z });
      }

      const buckets = daisyLeafMats.map(() => []);
      const dummy = new THREE.Object3D();
      const up = new THREE.Vector3(0, 1, 0);
      const basisMatrix = new THREE.Matrix4();
      for (const point of clumpPositions) {
        const leafCount = 22 + Math.floor(random() * 10);
        for (let i = 0; i < leafCount; i++) {
          const angle = (i / leafCount) * TAU + random() * 0.25;
          const radius = 0.025 + random() * 0.13;
          const tipDir = new THREE.Vector3(
            Math.cos(angle),
            0.03 + random() * 0.14,
            Math.sin(angle)
          ).normalize();
          const yAxis = tipDir.clone();
          const zAxis = up.clone().sub(yAxis.clone().multiplyScalar(up.dot(yAxis))).normalize();
          if (zAxis.lengthSq() < 0.001) zAxis.set(1, 0, 0);
          const xAxis = new THREE.Vector3().crossVectors(yAxis, zAxis).normalize();
          basisMatrix.makeBasis(xAxis, yAxis, zAxis);
          dummy.position.set(
            point.x + Math.cos(angle) * radius,
            0.01 + random() * 0.025,
            point.z + Math.sin(angle) * radius
          );
          dummy.quaternion.setFromRotationMatrix(basisMatrix);
          dummy.rotateY(random() * TAU);
          const size = 0.48 + random() * 0.28;
          dummy.scale.set(size, size * (0.9 + random() * 0.3), size);
          dummy.updateMatrix();
          buckets[Math.floor(random() * buckets.length)].push(dummy.matrix.clone());
        }
      }

      buckets.forEach((matrices, index) => {
        if (!matrices.length) return;
        const leaves = new THREE.InstancedMesh(daisyLeafGeo, daisyLeafMats[index], matrices.length);
        matrices.forEach((matrix, i) => leaves.setMatrixAt(i, matrix));
        leaves.instanceMatrix.needsUpdate = true;
        leaves.castShadow = true;
        leaves.receiveShadow = true;
        group.add(leaves);
      });
      scatteredFoliagePositions.push(...clumpPositions);
      registerFlowerClusters(clumpPositions, 'daisy');
    }

    addDaisyRosettes();

    // Peony vegetative clumps: biternate compound leaves with three-lobed,
    // softly textured leaflets. No buds or flowers.
    const peonyLeafletShape = new THREE.Shape();
    peonyLeafletShape.moveTo(0, 0);
    peonyLeafletShape.bezierCurveTo(-0.08, 0.02, -0.2, 0.14, -0.19, 0.24);
    peonyLeafletShape.bezierCurveTo(-0.18, 0.34, -0.08, 0.35, -0.04, 0.28);
    peonyLeafletShape.bezierCurveTo(-0.07, 0.38, -0.03, 0.48, 0, 0.55);
    peonyLeafletShape.bezierCurveTo(0.03, 0.48, 0.07, 0.38, 0.04, 0.28);
    peonyLeafletShape.bezierCurveTo(0.08, 0.35, 0.18, 0.34, 0.19, 0.24);
    peonyLeafletShape.bezierCurveTo(0.2, 0.14, 0.08, 0.02, 0, 0);
    const peonyLeafletGeo = new THREE.ShapeGeometry(peonyLeafletShape, 10);
    const peonyLeafMats = [0x4f7c43, 0x5e8b50, 0x436f3a].map((color) => (
      new THREE.MeshStandardMaterial({ color, roughness: 0.88, side: THREE.DoubleSide })
    ));
    const peonyStemMat = new THREE.MeshStandardMaterial({ color: 0x5b7745, roughness: 0.92 });
    const peonyStemGeo = new THREE.CylinderGeometry(1, 1, 1, 5);

    function addPeonyClumps() {
      const group = new THREE.Group();
      group.position.y = 0.05;
      scene.add(group);
      const clumpPositions = [];
      const exclusions = [
        [-9.2, 12.3, 2.6],
        [11.8, 12.8, 2.6],
        [-13.8, -12.5, 1.5],
        [13.3, -13.2, 1.5],
        [-14.7, 8.9, 1.5],
        [14.2, 8.4, 1.5],
        [-10.8, -14.2, 1.7],
        [-12.5, -4.8, 1.8],
        [-13.1, 0.3, 1.9],
        [0, -12.8, 1.7],
      ];
      let attempts = 0;
      while (clumpPositions.length < 20 && attempts < 16000) {
        attempts++;
        const x = -15.2 + random() * 30.4;
        const z = -15.2 + random() * 30.4;
        if (Math.abs(x) < 2.25 || Math.abs(z) < 2.25) continue;
        if (Math.hypot(x, z) < 6.65) continue;
        let blocked = false;
        for (const [ex, ez, radius] of exclusions) {
          if (Math.hypot(x - ex, z - ez) < radius) { blocked = true; break; }
        }
        if (blocked) continue;
        for (const p of clumpPositions) {
          if (Math.hypot(x - p.x, z - p.z) < 0.9) { blocked = true; break; }
        }
        if (blocked) continue;
        for (const p of scatteredFoliagePositions) {
          if (Math.hypot(x - p.x, z - p.z) < 0.4) { blocked = true; break; }
        }
        if (!blocked) clumpPositions.push({ x, z });
      }

      const leafBuckets = peonyLeafMats.map(() => []);
      const stemMatrices = [];
      const leafDummy = new THREE.Object3D();
      const stemDummy = new THREE.Object3D();
      const up = new THREE.Vector3(0, 1, 0);

      function addStem(a, b, radius) {
        const direction = b.clone().sub(a);
        const length = direction.length();
        if (length < 0.001) return;
        stemDummy.position.copy(a).add(b).multiplyScalar(0.5);
        stemDummy.quaternion.setFromUnitVectors(up, direction.normalize());
        stemDummy.scale.set(radius, length, radius);
        stemDummy.updateMatrix();
        stemMatrices.push(stemDummy.matrix.clone());
      }

      function addLeaflet(position, tipDirection, scale) {
        scale *= 0.7;
        leafDummy.position.copy(position);
        leafDummy.quaternion.setFromUnitVectors(up, tipDirection.clone().normalize());
        leafDummy.rotateY(random() * TAU);
        const lengthScale = scale * (0.8 + random() * 0.35);
        const widthScale = scale * (0.85 + random() * 0.3);
        leafDummy.scale.set(widthScale, lengthScale, scale);
        leafDummy.updateMatrix();
        leafBuckets[Math.floor(random() * peonyLeafMats.length)].push(leafDummy.matrix.clone());
      }

      function addCompoundLeaf(base, outwardAngle, scale) {
        const dir = new THREE.Vector3(Math.cos(outwardAngle), 0.18, Math.sin(outwardAngle)).normalize();
        const petioleEnd = base.clone().addScaledVector(dir, 0.16 * scale);
        addStem(base, petioleEnd, 0.0055);
        const offsets = [-0.58, 0, 0.58];
        for (const offset of offsets) {
          const a = outwardAngle + offset;
          const primaryDir = new THREE.Vector3(Math.cos(a), 0.1, Math.sin(a)).normalize();
          const primaryEnd = petioleEnd.clone().addScaledVector(primaryDir, 0.18 * scale);
          addStem(petioleEnd, primaryEnd, 0.0045);
          const side = new THREE.Vector3(-Math.sin(a), 0, Math.cos(a)).normalize();
          addLeaflet(primaryEnd, primaryDir, scale * 0.9);
          for (const sign of [-1, 1]) {
            const lateralPos = primaryEnd.clone().addScaledVector(side, sign * 0.045 * scale).addScaledVector(primaryDir, -0.025 * scale);
            const lateralDir = side.clone().multiplyScalar(sign * 0.65).add(primaryDir.clone().multiplyScalar(0.35)).normalize();
            addLeaflet(lateralPos, lateralDir, scale * 0.68);
          }
        }
      }

      for (const point of clumpPositions) {
        const stemCount = 6 + Math.floor(random() * 3);
        for (let s = 0; s < stemCount; s++) {
          const angle = (s / stemCount) * TAU + random() * 0.5;
          const radius = 0.1 + random() * 0.14;
          const baseX = point.x + Math.cos(angle) * radius;
          const baseZ = point.z + Math.sin(angle) * radius;
          const height = 0.72 + random() * 0.32;
          const leanX = (random() - 0.5) * 0.06;
          const leanZ = (random() - 0.5) * 0.06;
          const top = new THREE.Vector3(baseX + leanX, 0.08 + height, baseZ + leanZ);
          addStem(new THREE.Vector3(baseX, 0.05, baseZ), top, 0.015 + random() * 0.005);
          const leafCount = 2 + Math.floor(random() * 2);
          for (let l = 0; l < leafCount; l++) {
            const t = 0.5 + l * 0.22 + random() * 0.08;
            const base = new THREE.Vector3(
              baseX + leanX * t,
              0.08 + height * t,
              baseZ + leanZ * t
            );
            addCompoundLeaf(base, angle + l * 2.1 + random() * 0.5, 0.85 + random() * 0.3);
          }
        }
      }

      leafBuckets.forEach((matrices, index) => {
        if (!matrices.length) return;
        const leaves = new THREE.InstancedMesh(peonyLeafletGeo, peonyLeafMats[index], matrices.length);
        matrices.forEach((matrix, i) => leaves.setMatrixAt(i, matrix));
        leaves.instanceMatrix.needsUpdate = true;
        leaves.castShadow = true;
        leaves.receiveShadow = true;
        group.add(leaves);
      });
      const stems = new THREE.InstancedMesh(peonyStemGeo, peonyStemMat, stemMatrices.length);
      stemMatrices.forEach((matrix, i) => stems.setMatrixAt(i, matrix));
      stems.instanceMatrix.needsUpdate = true;
      stems.castShadow = true;
      group.add(stems);
      scatteredFoliagePositions.push(...clumpPositions);
      registerFlowerClusters(clumpPositions, 'peony');
    }

    addPeonyClumps();

    // China-rose (monthly rose) foliage: pinnate leaves with pointed, clearly
    // serrated ovate leaflets on slightly curved canes with small thorns.
    // Vegetative only — no buds or flowers.
    const monthlyRoseLeafletShape = new THREE.Shape();
    const monthlyRoseHalf = [];
    for (let i = 0; i <= 16; i++) {
      const t = i / 16;
      const y = 0.02 + t * 0.36;
      let w = 0.125 * Math.pow(Math.sin(Math.PI * Math.min(1, t * 0.92 + 0.06)), 0.62);
      w *= i % 2 === 0 ? 1.12 : 0.88;
      monthlyRoseHalf.push({ x: -w, y });
    }
    monthlyRoseLeafletShape.moveTo(0, 0.01);
    for (const p of monthlyRoseHalf) monthlyRoseLeafletShape.lineTo(p.x, p.y);
    monthlyRoseLeafletShape.lineTo(0, 0.43);
    for (let i = monthlyRoseHalf.length - 1; i >= 0; i--) {
      monthlyRoseLeafletShape.lineTo(-monthlyRoseHalf[i].x, monthlyRoseHalf[i].y);
    }
    monthlyRoseLeafletShape.closePath();
    const monthlyRoseLeafletGeo = new THREE.ShapeGeometry(monthlyRoseLeafletShape, 1);
    const monthlyRoseMats = [0x3e6935, 0x4a783f, 0x56864a].map((color) => (
      new THREE.MeshStandardMaterial({ color, roughness: 0.91, side: THREE.DoubleSide })
    ));
    const monthlyRoseStemMat = new THREE.MeshStandardMaterial({ color: 0x4f6639, roughness: 0.94 });
    const monthlyRoseStemGeo = new THREE.CylinderGeometry(1, 1, 1, 5);
    const monthlyRoseThornGeo = new THREE.ConeGeometry(0.013, 0.075, 4);

    function addMonthlyRoseClumps() {
      const group = new THREE.Group();
      group.position.y = 0.05;
      scene.add(group);
      const clumpPositions = [];
      const exclusions = [
        [-9.2, 12.3, 2.6],
        [11.8, 12.8, 2.6],
        [-13.8, -12.5, 1.5],
        [13.3, -13.2, 1.5],
        [-14.7, 8.9, 1.5],
        [14.2, 8.4, 1.5],
        [-10.8, -14.2, 1.7],
        [-12.5, -4.8, 1.8],
        [-13.1, 0.3, 1.9],
        [0, -12.8, 1.7],
      ];
      let attempts = 0;
      while (clumpPositions.length < 35 && attempts < 20000) {
        attempts++;
        const x = -15.2 + random() * 30.4;
        const z = -15.2 + random() * 30.4;
        if (Math.abs(x) < 2.2 || Math.abs(z) < 2.2) continue;
        if (Math.hypot(x, z) < 6.6) continue;
        let blocked = false;
        for (const [ex, ez, radius] of exclusions) {
          if (Math.hypot(x - ex, z - ez) < radius) { blocked = true; break; }
        }
        if (blocked) continue;
        for (const p of clumpPositions) {
          if (Math.hypot(x - p.x, z - p.z) < 0.55) { blocked = true; break; }
        }
        if (blocked) continue;
        for (const p of scatteredFoliagePositions) {
          if (Math.hypot(x - p.x, z - p.z) < 0.3) { blocked = true; break; }
        }
        if (!blocked) clumpPositions.push({ x, z });
      }

      const leafBuckets = monthlyRoseMats.map(() => []);
      const stemMatrices = [];
      const thornMatrices = [];
      const leafDummy = new THREE.Object3D();
      const stemDummy = new THREE.Object3D();
      const thornDummy = new THREE.Object3D();
      const up = new THREE.Vector3(0, 1, 0);

      function addStem(a, b, radius) {
        const direction = b.clone().sub(a);
        const length = direction.length();
        if (length < 0.001) return;
        stemDummy.position.copy(a).add(b).multiplyScalar(0.5);
        stemDummy.quaternion.setFromUnitVectors(up, direction.normalize());
        stemDummy.scale.set(radius, length, radius);
        stemDummy.updateMatrix();
        stemMatrices.push(stemDummy.matrix.clone());
      }

      function addThorn(position, direction) {
        thornDummy.position.copy(position);
        thornDummy.quaternion.setFromUnitVectors(up, direction.clone().normalize());
        thornDummy.scale.setScalar(0.8 + random() * 0.5);
        thornDummy.updateMatrix();
        thornMatrices.push(thornDummy.matrix.clone());
      }

      function addRoselet(position, tipDirection, scale) {
        leafDummy.position.copy(position);
        leafDummy.quaternion.setFromUnitVectors(up, tipDirection.clone().normalize());
        leafDummy.rotateY(random() * TAU);
        const lengthScale = scale * (0.8 + random() * 0.3);
        const widthScale = scale * (0.85 + random() * 0.3);
        leafDummy.scale.set(widthScale, lengthScale, scale);
        leafDummy.updateMatrix();
        leafBuckets[Math.floor(random() * monthlyRoseMats.length)].push(leafDummy.matrix.clone());
      }

      function addPinnateLeaf(base, angle, scale) {
        const direction = new THREE.Vector3(Math.cos(angle), 0.12 + random() * 0.12, Math.sin(angle)).normalize();
        const end = base.clone().addScaledVector(direction, 0.38 * scale);
        addStem(base, end, 0.004);
        const side = new THREE.Vector3(-Math.sin(angle), 0, Math.cos(angle)).normalize();
        for (let pair = 1; pair <= 3; pair++) {
          const p = base.clone().lerp(end, pair / 4);
          for (const sign of [-1, 1]) {
            const tip = side.clone().multiplyScalar(sign).add(direction.clone().multiplyScalar(0.35)).normalize();
            addRoselet(p.clone().addScaledVector(side, sign * 0.025), tip, scale * (0.8 + random() * 0.2));
          }
        }
        addRoselet(end, direction, scale * 0.9);
      }

      for (const point of clumpPositions) {
        const caneCount = 5 + Math.floor(random() * 4);
        const horizontalBias = random() < 0.35;
        for (let c = 0; c < caneCount; c++) {
          const angle = (c / caneCount) * TAU + random() * 0.6;
          const reach = horizontalBias ? 0.48 + random() * 0.25 : 0.28 + random() * 0.25;
          const rise = horizontalBias ? 0.35 + random() * 0.3 : 0.55 + random() * 0.4;
          const start = new THREE.Vector3(point.x + Math.cos(angle) * 0.05, 0.06, point.z + Math.sin(angle) * 0.05);
          const mid = new THREE.Vector3(
            point.x + Math.cos(angle) * reach * 0.55,
            0.12 + rise * 0.6,
            point.z + Math.sin(angle) * reach * 0.55
          );
          const tip = new THREE.Vector3(
            point.x + Math.cos(angle + (random() - 0.5) * 0.45) * reach,
            0.12 + rise,
            point.z + Math.sin(angle + (random() - 0.5) * 0.45) * reach
          );
          const curve = new THREE.QuadraticBezierCurve3(start, mid, tip);
          let previous = start.clone();
          for (let seg = 1; seg <= 5; seg++) {
            const next = curve.getPoint(seg / 5);
            addStem(previous, next, seg === 5 ? 0.006 : 0.011);
            if (seg === 2 && random() > 0.35) {
              const side = new THREE.Vector3(-Math.sin(angle), 0, Math.cos(angle)).normalize();
              addThorn(next, side.clone().multiplyScalar(random() > 0.5 ? 1 : -1));
            }
            previous = next;
          }

          const leafCount = 2 + Math.floor(random() * 2);
          for (let l = 0; l < leafCount; l++) {
            const t = 0.48 + l * 0.24 + random() * 0.08;
            const base = curve.getPoint(Math.min(0.96, t));
            addPinnateLeaf(base, angle + l * 2.2 + random() * 0.5, 0.9 + random() * 0.35);
          }
        }
      }

      leafBuckets.forEach((matrices, index) => {
        if (!matrices.length) return;
        const leaves = new THREE.InstancedMesh(monthlyRoseLeafletGeo, monthlyRoseMats[index], matrices.length);
        matrices.forEach((matrix, i) => leaves.setMatrixAt(i, matrix));
        leaves.instanceMatrix.needsUpdate = true;
        leaves.castShadow = true;
        leaves.receiveShadow = true;
        group.add(leaves);
      });
      const stems = new THREE.InstancedMesh(monthlyRoseStemGeo, monthlyRoseStemMat, stemMatrices.length);
      stemMatrices.forEach((matrix, i) => stems.setMatrixAt(i, matrix));
      stems.instanceMatrix.needsUpdate = true;
      stems.castShadow = true;
      group.add(stems);
      const thorns = new THREE.InstancedMesh(monthlyRoseThornGeo, monthlyRoseStemMat, thornMatrices.length);
      thornMatrices.forEach((matrix, i) => thorns.setMatrixAt(i, matrix));
      thorns.instanceMatrix.needsUpdate = true;
      thorns.castShadow = true;
      group.add(thorns);
      scatteredFoliagePositions.push(...clumpPositions);
      registerFlowerClusters(clumpPositions, 'monthlyRose');
    }

    addMonthlyRoseClumps();

    // Plumbago foliage: slender, soft trailing stems with long ovate pale-green
    // leaves arching outward and drooping gently. No blue flowers.
    const plumbagoLeafShape = new THREE.Shape();
    plumbagoLeafShape.moveTo(0, 0);
    plumbagoLeafShape.bezierCurveTo(-0.04, 0.05, -0.075, 0.13, -0.05, 0.21);
    plumbagoLeafShape.bezierCurveTo(-0.03, 0.27, 0.0, 0.33, 0, 0.34);
    plumbagoLeafShape.bezierCurveTo(0.0, 0.33, 0.03, 0.27, 0.05, 0.21);
    plumbagoLeafShape.bezierCurveTo(0.075, 0.13, 0.04, 0.05, 0, 0);
    const plumbagoLeafGeo = new THREE.ShapeGeometry(plumbagoLeafShape, 10);
    const plumbagoLeafMats = [0x86ad6b, 0x96bc7b, 0x77a15e].map((color) => (
      new THREE.MeshStandardMaterial({ color, roughness: 0.9, side: THREE.DoubleSide })
    ));
    const plumbagoStemMat = new THREE.MeshStandardMaterial({ color: 0x77965e, roughness: 0.92 });
    const plumbagoStemGeo = new THREE.CylinderGeometry(1, 1, 1, 4);

    function addPlumbagoClumps() {
      const group = new THREE.Group();
      group.position.y = 0.05;
      scene.add(group);
      const clumpPositions = [];
      const exclusions = [
        [-9.2, 12.3, 2.5],
        [11.8, 12.8, 2.5],
        [-13.8, -12.5, 1.4],
        [13.3, -13.2, 1.4],
        [-14.7, 8.9, 1.4],
        [14.2, 8.4, 1.4],
        [-10.8, -14.2, 1.6],
        [-12.5, -4.8, 1.7],
        [-13.1, 0.3, 1.8],
        [0, -12.8, 1.6],
      ];
      let attempts = 0;
      while (clumpPositions.length < 35 && attempts < 20000) {
        attempts++;
        const x = -15.2 + random() * 30.4;
        const z = -15.2 + random() * 30.4;
        if (Math.abs(x) < 2.15 || Math.abs(z) < 2.15) continue;
        if (Math.hypot(x, z) < 6.55) continue;
        let blocked = false;
        for (const [ex, ez, radius] of exclusions) {
          if (Math.hypot(x - ex, z - ez) < radius) { blocked = true; break; }
        }
        if (blocked) continue;
        for (const p of clumpPositions) {
          if (Math.hypot(x - p.x, z - p.z) < 0.55) { blocked = true; break; }
        }
        if (blocked) continue;
        for (const p of scatteredFoliagePositions) {
          if (Math.hypot(x - p.x, z - p.z) < 0.3) { blocked = true; break; }
        }
        if (!blocked) clumpPositions.push({ x, z });
      }

      const leafBuckets = plumbagoLeafMats.map(() => []);
      const stemMatrices = [];
      const leafDummy = new THREE.Object3D();
      const stemDummy = new THREE.Object3D();
      const up = new THREE.Vector3(0, 1, 0);

      function addStem(a, b, radius) {
        const direction = b.clone().sub(a);
        const length = direction.length();
        if (length < 0.001) return;
        stemDummy.position.copy(a).add(b).multiplyScalar(0.5);
        stemDummy.quaternion.setFromUnitVectors(up, direction.normalize());
        stemDummy.scale.set(radius, length, radius);
        stemDummy.updateMatrix();
        stemMatrices.push(stemDummy.matrix.clone());
      }

      function addLeaf(position, tipDirection, scale) {
        leafDummy.position.copy(position);
        leafDummy.quaternion.setFromUnitVectors(up, tipDirection.clone().normalize());
        leafDummy.rotateY(random() * TAU);
        leafDummy.scale.set(scale * (0.8 + random() * 0.25), scale, scale);
        leafDummy.updateMatrix();
        leafBuckets[Math.floor(random() * plumbagoLeafMats.length)].push(leafDummy.matrix.clone());
      }

      for (const point of clumpPositions) {
        const branchCount = 8 + Math.floor(random() * 5);
        for (let b = 0; b < branchCount; b++) {
          const angle = (b / branchCount) * TAU + random() * 0.6;
          const reach = 0.45 + random() * 0.3;
          const rise = 0.3 + random() * 0.25;
          const start = new THREE.Vector3(point.x + Math.cos(angle) * 0.04, 0.06, point.z + Math.sin(angle) * 0.04);
          const mid = new THREE.Vector3(
            point.x + Math.cos(angle) * reach * 0.55,
            0.12 + rise,
            point.z + Math.sin(angle) * reach * 0.55
          );
          const tip = new THREE.Vector3(
            point.x + Math.cos(angle + (random() - 0.5) * 0.5) * reach,
            0.1 + rise * (0.25 + random() * 0.35),
            point.z + Math.sin(angle + (random() - 0.5) * 0.5) * reach
          );
          const curve = new THREE.QuadraticBezierCurve3(start, mid, tip);
          let previous = start.clone();
          for (let seg = 1; seg <= 6; seg++) {
            const next = curve.getPoint(seg / 6);
            addStem(previous, next, seg === 6 ? 0.003 : 0.006);
            previous = next;
          }
          for (let l = 0; l < 5; l++) {
            const t = 0.32 + l * 0.15 + random() * 0.04;
            const base = curve.getPoint(Math.min(0.98, t));
            const side = new THREE.Vector3(-Math.sin(angle), 0, Math.cos(angle)).normalize();
            const sign = l % 2 === 0 ? 1 : -1;
            const tipDir = side.clone().multiplyScalar(sign * (0.55 + random() * 0.35))
              .add(new THREE.Vector3(0, -0.12 - random() * 0.22, 0))
              .normalize();
            addLeaf(base.clone().addScaledVector(side, sign * 0.015), tipDir, 0.65 + random() * 0.3);
          }
        }
      }

      leafBuckets.forEach((matrices, index) => {
        if (!matrices.length) return;
        const leaves = new THREE.InstancedMesh(plumbagoLeafGeo, plumbagoLeafMats[index], matrices.length);
        matrices.forEach((matrix, i) => leaves.setMatrixAt(i, matrix));
        leaves.instanceMatrix.needsUpdate = true;
        leaves.castShadow = true;
        leaves.receiveShadow = true;
        group.add(leaves);
      });
      const stems = new THREE.InstancedMesh(plumbagoStemGeo, plumbagoStemMat, stemMatrices.length);
      stemMatrices.forEach((matrix, i) => stems.setMatrixAt(i, matrix));
      stems.instanceMatrix.needsUpdate = true;
      stems.castShadow = true;
      group.add(stems);
      scatteredFoliagePositions.push(...clumpPositions);
      registerFlowerClusters(clumpPositions, 'plumbago');
    }

    addPlumbagoClumps();

    // ---------------------------------------------------------------------
    // Low grass and groundcover fillers for the remaining lawn spaces
    // ---------------------------------------------------------------------
    function makeFillerPositions(count, minDistance = 0.28) {
      const points = [];
      const blockedZones = [
        [-9.2, 12.3, 2.4],
        [11.8, 12.8, 2.4],
        [-13.8, -12.5, 1.3],
        [13.3, -13.2, 1.3],
        [-14.7, 8.9, 1.3],
        [14.2, 8.4, 1.3],
        [-10.8, -14.2, 1.5],
        [-12.5, -4.8, 1.6],
        [-13.1, 0.3, 1.7],
        [0, -12.8, 1.5],
      ];
      let attempts = 0;
      while (points.length < count && attempts < count * 120) {
        attempts++;
        const x = -15.5 + random() * 31;
        const z = -15.5 + random() * 31;
        if (Math.abs(x) < 2.02 || Math.abs(z) < 2.02) continue;
        if (Math.hypot(x, z) < 6.4) continue;
        let blocked = false;
        for (const [ex, ez, radius] of blockedZones) {
          if (Math.hypot(x - ex, z - ez) < radius) {
            blocked = true;
            break;
          }
        }
        if (blocked) continue;
        for (const p of points) {
          if (Math.hypot(x - p.x, z - p.z) < minDistance) {
            blocked = true;
            break;
          }
        }
        if (!blocked) points.push({ x, z });
      }
      return points;
    }

    const fillerUp = new THREE.Vector3(0, 1, 0);
    const fillerDummy = new THREE.Object3D();
    const fillerBasis = new THREE.Matrix4();

    function addLeafInstancesToGroup(group, geometry, materials, buckets) {
      buckets.forEach((matrices, index) => {
        if (!matrices.length) return;
        const mesh = new THREE.InstancedMesh(geometry, materials[index], matrices.length);
        matrices.forEach((matrix, i) => mesh.setMatrixAt(i, matrix));
        mesh.instanceMatrix.needsUpdate = true;
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        group.add(mesh);
      });
    }

    // 1) Fine hair grass — long, fine, gently arching pale blades.
    const fineHairShape = new THREE.Shape();
    fineHairShape.moveTo(-0.012, 0);
    fineHairShape.quadraticCurveTo(-0.01, 0.26, 0.13, 0.62);
    fineHairShape.quadraticCurveTo(0.012, 0.28, 0.012, 0);
    fineHairShape.closePath();
    const fineHairGeo = new THREE.ShapeGeometry(fineHairShape, 8);
    const fineHairMats = [0x9ab977, 0xacc98b, 0x87a765].map((color) => (
      new THREE.MeshStandardMaterial({ color, roughness: 0.94, side: THREE.DoubleSide })
    ));
    {
      const group = new THREE.Group();
      group.position.y = 0.04;
      scene.add(group);
      const points = makeFillerPositions(875, 0.20);
      const buckets = fineHairMats.map(() => []);
      for (const point of points) {
        const blades = 10 + Math.floor(random() * 8);
        for (let i = 0; i < blades; i++) {
          const angle = random() * TAU;
          const tipDir = new THREE.Vector3(
            Math.cos(angle) * (0.12 + random() * 0.22),
            0.8 + random() * 0.35,
            Math.sin(angle) * (0.12 + random() * 0.22)
          ).normalize();
          fillerDummy.position.set(
            point.x + (random() - 0.5) * 0.14,
            0.02 + random() * 0.02,
            point.z + (random() - 0.5) * 0.14
          );
          fillerDummy.quaternion.setFromUnitVectors(fillerUp, tipDir);
          fillerDummy.rotateY(random() * TAU);
          const size = 0.55 + random() * 0.6;
          fillerDummy.scale.set(size * (0.75 + random() * 0.35), size, size);
          fillerDummy.updateMatrix();
          buckets[Math.floor(random() * buckets.length)].push(fillerDummy.matrix.clone());
        }
      }
      addLeafInstancesToGroup(group, fineHairGeo, fineHairMats, buckets);
    }

    // 2) Broad-leaved wild grass — short, wide, flat-spreading dark blades.
    const broadGrassShape = new THREE.Shape();
    broadGrassShape.moveTo(0, 0);
    broadGrassShape.bezierCurveTo(-0.085, 0.02, -0.11, 0.1, -0.045, 0.18);
    broadGrassShape.bezierCurveTo(0, 0.22, 0.0, 0.22, 0.045, 0.18);
    broadGrassShape.bezierCurveTo(0.11, 0.1, 0.085, 0.02, 0, 0);
    const broadGrassGeo = new THREE.ShapeGeometry(broadGrassShape, 10);
    const broadGrassMats = [0x426838, 0x4d7441, 0x3a5d31].map((color) => (
      new THREE.MeshStandardMaterial({ color, roughness: 0.92, side: THREE.DoubleSide })
    ));
    {
      const group = new THREE.Group();
      group.position.y = 0.035;
      scene.add(group);
      const points = makeFillerPositions(713, 0.26);
      const buckets = broadGrassMats.map(() => []);
      for (const point of points) {
        const leaves = 10 + Math.floor(random() * 6);
        for (let i = 0; i < leaves; i++) {
          const angle = (i / leaves) * TAU + random() * 0.4;
          const radius = random() * 0.12;
          const tipDir = new THREE.Vector3(Math.cos(angle), 0.02 + random() * 0.08, Math.sin(angle)).normalize();
          const yAxis = tipDir.clone();
          const zAxis = fillerUp.clone().sub(yAxis.clone().multiplyScalar(fillerUp.dot(yAxis))).normalize();
          const xAxis = new THREE.Vector3().crossVectors(yAxis, zAxis).normalize();
          fillerBasis.makeBasis(xAxis, yAxis, zAxis);
          fillerDummy.position.set(
            point.x + Math.cos(angle) * radius,
            0.01 + random() * 0.02,
            point.z + Math.sin(angle) * radius
          );
          fillerDummy.quaternion.setFromRotationMatrix(fillerBasis);
          fillerDummy.rotateY(random() * TAU);
          const size = 0.8 + random() * 0.45;
          fillerDummy.scale.set(size, size * (0.85 + random() * 0.3), size);
          fillerDummy.updateMatrix();
          buckets[Math.floor(random() * buckets.length)].push(fillerDummy.matrix.clone());
        }
      }
      addLeafInstancesToGroup(group, broadGrassGeo, broadGrassMats, buckets);
    }

    // 3) Spike grass — thin upright stems topped with soft seed spikes.
    const spikeStemMat = new THREE.MeshStandardMaterial({ color: 0x73894f, roughness: 0.94 });
    const spikeStemGeo = new THREE.CylinderGeometry(1, 1, 1, 4);
    const spikeHeadGeo = new THREE.ConeGeometry(0.03, 0.22, 5);
    spikeHeadGeo.translate(0, 0.11, 0);
    const spikeHeadMat = new THREE.MeshStandardMaterial({ color: 0xaab58b, roughness: 0.9 });
    {
      const group = new THREE.Group();
      group.position.y = 0.04;
      scene.add(group);
      const points = makeFillerPositions(562, 0.30);
      const stemMatrices = [];
      const headMatrices = [];
      const leafBuckets = fineHairMats.map(() => []);
      const stemDummy = new THREE.Object3D();
      for (const point of points) {
        const stems = 5 + Math.floor(random() * 5);
        for (let i = 0; i < stems; i++) {
          const angle = random() * TAU;
          const height = 0.52 + random() * 0.45;
          const base = new THREE.Vector3(
            point.x + Math.cos(angle) * (random() * 0.12),
            0.06,
            point.z + Math.sin(angle) * (random() * 0.12)
          );
          const top = new THREE.Vector3(
            base.x + (random() - 0.5) * 0.1,
            0.06 + height,
            base.z + (random() - 0.5) * 0.1
          );
          const direction = top.clone().sub(base);
          stemDummy.position.copy(base).add(top).multiplyScalar(0.5);
          stemDummy.quaternion.setFromUnitVectors(fillerUp, direction.clone().normalize());
          stemDummy.scale.set(0.006, direction.length(), 0.006);
          stemDummy.updateMatrix();
          stemMatrices.push(stemDummy.matrix.clone());
          fillerDummy.position.copy(top);
          fillerDummy.quaternion.setFromUnitVectors(fillerUp, direction.clone().normalize());
          fillerDummy.rotateY(random() * TAU);
          fillerDummy.scale.set(0.9 + random() * 0.4, 0.9 + random() * 0.5, 0.9 + random() * 0.4);
          fillerDummy.updateMatrix();
          headMatrices.push(fillerDummy.matrix.clone());
          const leafCount = 2 + Math.floor(random() * 3);
          for (let l = 0; l < leafCount; l++) {
            fillerDummy.position.set(base.x + (random() - 0.5) * 0.15, 0.04, base.z + (random() - 0.5) * 0.15);
            fillerDummy.quaternion.setFromUnitVectors(fillerUp, new THREE.Vector3(
              Math.cos(angle + random() * 2), 0.55 + random() * 0.3, Math.sin(angle + random() * 2)
            ).normalize());
            fillerDummy.rotateY(random() * TAU);
            const size = 0.35 + random() * 0.25;
            fillerDummy.scale.set(size, size, size);
            fillerDummy.updateMatrix();
            leafBuckets[Math.floor(random() * leafBuckets.length)].push(fillerDummy.matrix.clone());
          }
        }
      }
      addLeafInstancesToGroup(group, fineHairGeo, fineHairMats, leafBuckets);
      const stems = new THREE.InstancedMesh(spikeStemGeo, spikeStemMat, stemMatrices.length);
      stemMatrices.forEach((matrix, i) => stems.setMatrixAt(i, matrix));
      stems.instanceMatrix.needsUpdate = true;
      stems.castShadow = true;
      group.add(stems);
      const heads = new THREE.InstancedMesh(spikeHeadGeo, spikeHeadMat, headMatrices.length);
      headMatrices.forEach((matrix, i) => heads.setMatrixAt(i, matrix));
      heads.instanceMatrix.needsUpdate = true;
      heads.castShadow = true;
      group.add(heads);
    }

    // 4) Curly-leaf grass — compact round clumps with softly curled edges.
    const curlyGrassShape = new THREE.Shape();
    curlyGrassShape.moveTo(-0.025, 0);
    curlyGrassShape.bezierCurveTo(-0.045, 0.12, -0.085, 0.2, -0.035, 0.32);
    curlyGrassShape.bezierCurveTo(0.015, 0.44, 0.07, 0.48, 0.035, 0.54);
    curlyGrassShape.bezierCurveTo(0.07, 0.36, 0.015, 0.18, 0.025, 0);
    curlyGrassShape.closePath();
    const curlyGrassGeo = new THREE.ShapeGeometry(curlyGrassShape, 8);
    const curlyGrassMats = [0x3e6935, 0x4b7840, 0x345b2c].map((color) => (
      new THREE.MeshStandardMaterial({ color, roughness: 0.9, side: THREE.DoubleSide })
    ));
    {
      const group = new THREE.Group();
      group.position.y = 0.04;
      scene.add(group);
      const points = makeFillerPositions(675, 0.26);
      const buckets = curlyGrassMats.map(() => []);
      for (const point of points) {
        const blades = 16 + Math.floor(random() * 8);
        for (let i = 0; i < blades; i++) {
          const angle = random() * TAU;
          const tipDir = new THREE.Vector3(
            Math.cos(angle) * (0.18 + random() * 0.24),
            0.68 + random() * 0.3,
            Math.sin(angle) * (0.18 + random() * 0.24)
          ).normalize();
          fillerDummy.position.set(
            point.x + Math.cos(angle) * (random() * 0.1),
            0.03,
            point.z + Math.sin(angle) * (random() * 0.1)
          );
          fillerDummy.quaternion.setFromUnitVectors(fillerUp, tipDir);
          fillerDummy.rotateY(random() * TAU);
          const size = 0.6 + random() * 0.4;
          fillerDummy.scale.set(size, size, size);
          fillerDummy.updateMatrix();
          buckets[Math.floor(random() * buckets.length)].push(fillerDummy.matrix.clone());
        }
      }
      addLeafInstancesToGroup(group, curlyGrassGeo, curlyGrassMats, buckets);
    }

    // 5) Creeping ground grass — an extremely low layer of tiny flat leaves.
    const creepingLeafShape = new THREE.Shape();
    creepingLeafShape.moveTo(0, 0);
    creepingLeafShape.bezierCurveTo(-0.045, 0.01, -0.055, 0.055, 0, 0.1);
    creepingLeafShape.bezierCurveTo(0.055, 0.055, 0.045, 0.01, 0, 0);
    const creepingLeafGeo = new THREE.ShapeGeometry(creepingLeafShape, 8);
    const creepingLeafMats = [0x6f9555, 0x7da463, 0x5f8549].map((color) => (

    // Fountain droplets
    const dropCount = 280;

    const dropGeometry = new THREE.BufferGeometry();

    function resetDrop(i) {
      const high = random() < 0.58;

      const radius = high ? random() * 0.14 : 0.3 + random() * 0.5;
      dropPositions[i * 3] = Math.cos(angle) * radius;

      dropVelocity[i * 3 + 2] = Math.sin(angle) * spread;

    const dropMaterial = new THREE.PointsMaterial({

    // Replace the carved fountain exterior with the supplied GLB while keeping

    const glbFountain = new THREE.Group();

    let fountainCascade = null;

    function createFountainCascade() {
      const stages = [
        { top: 7.18, bottom: 5.54, radius: 1.02, count: 80 },
        { top: 5.54, bottom: 3.78, radius: 1.8, count: 90 },
        { top: 3.78, bottom: 1.2, radius: 2.48, count: 100 },
      ];
      const particles = [];
      for (const stage of stages) {
        for (let i = 0; i < stage.count; i++) {
          particles.push({
            stage,
            angle: random() * TAU,
            radialOffset: (random() - 0.5) * 0.06,
            speed: 0.65 + random() * 0.9,
            drift: 0.015 + random() * 0.035,
            y: stage.top - random() * (stage.top - stage.bottom),
          });
        }
      }
      const positions = new Float32Array(particles.length * 6);
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const material = new THREE.LineBasicMaterial({
        color: 0xd9eee7,
        transparent: true,
        opacity: 0.52,
        depthWrite: false,
        blending: THREE.NormalBlending,
      });
      const lines = new THREE.LineSegments(geometry, material);
      lines.frustumCulled = false;
      lines.renderOrder = 3;
      scene.add(lines);

      // Short translucent water curtains connect each rim to the basin below.
      const curtainMaterial = new THREE.MeshBasicMaterial({
        color: 0xd4ece4,
        transparent: true,
        opacity: 0.06,
        side: THREE.DoubleSide,
        depthWrite: false,
      });
      for (const stage of stages) {
        const height = stage.top - stage.bottom;
        for (let p = 0; p < 4; p++) {
          const arc = new THREE.Mesh(
            new THREE.CylinderGeometry(
              stage.radius * 0.98,
              stage.radius * 1.06,
              height,
              8,
              1,
              true,
              (p / 4) * TAU,
              0.38
            ),
            curtainMaterial
          );
          arc.position.y = (stage.top + stage.bottom) / 2;
          arc.renderOrder = 2;
          scene.add(arc);
        }
      }

      function resetParticle(p) {
        p.angle = random() * TAU;
        p.y = p.stage.top + random() * 0.03;
        p.speed = 0.65 + random() * 0.9;
      }

      function update(delta) {
        const dt = Math.min(delta, 0.05);
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          p.y -= p.speed * dt;
          if (p.y <= p.stage.bottom) resetParticle(p);
          const radius = Math.max(0, p.stage.radius + p.radialOffset + (p.stage.top - p.y) * p.drift);
          const x = Math.cos(p.angle) * radius;
          const z = Math.sin(p.angle) * radius;
          const idx = i * 6;
          positions[idx] = x;
          positions[idx + 1] = p.y;
          positions[idx + 2] = z;
          positions[idx + 3] = x;
          positions[idx + 4] = p.y - 0.11 - p.speed * 0.035;
          positions[idx + 5] = z;
        }
        geometry.attributes.position.needsUpdate = true;
      }
      fountainCascade = { lines, update };
    }

    const gltfLoader = new GLTFLoader();
    let poolWaterBase = 0.56;
    let lowerWaterBase = 1.84;
    let upperWaterBase = 2.76;
    const glbFountainUrl = './fountain.glb';
    let glbReportedPercent = -1;
    console.log('[Fountain] Loading GLB:', glbFountainUrl);
    gltfLoader.load(
      glbFountainUrl,
      (gltf) => {
        console.log('[Fountain] GLB loaded successfully:', glbFountainUrl);
        const model = gltf.scene;
        model.traverse((obj) => {
          if (obj.isMesh) {
            obj.castShadow = false;
            obj.receiveShadow = true;
          }
        });
        // Whiten only the low-saturation stone pixels; leave the blue-green water pixels intact.
        model.traverse((obj) => {
          if (!obj.isMesh) return;
          const materials = Array.isArray(obj.material) ? obj.material : [obj.material];
          for (const material of materials) {
            if (!material || !material.map || !material.map.image) continue;
            try {
              const source = material.map.image;
              const maxSize = 2048;
              const ratio = Math.min(1, maxSize / Math.max(source.width, source.height));
              const width = Math.max(1, Math.round(source.width * ratio));
              const height = Math.max(1, Math.round(source.height * ratio));
              const canvas = document.createElement('canvas');
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d', { willReadFrequently: true });
              ctx.drawImage(source, 0, 0, width, height);
              const image = ctx.getImageData(0, 0, width, height);
              const data = image.data;
              for (let i = 0; i < data.length; i += 4) {
                const r = data[i] / 255;
                const g = data[i + 1] / 255;
                const b = data[i + 2] / 255;
                const max = Math.max(r, g, b);
                const min = Math.min(r, g, b);
                const saturation = max > 0 ? (max - min) / max : 0;
                const delta = max - min;
                let hue = 0;
                if (delta > 0.0001) {
                  if (max === r) hue = ((g - b) / delta) % 6;
                  else if (max === g) hue = (b - r) / delta + 2;
                  else hue = (r - g) / delta + 4;
                  hue /= 6;
                  if (hue < 0) hue += 1;
                }
                // Keep the blue-green water, whiten the grey and blue-grey stone.
                const isWater = saturation > 0.16 && hue > 0.30 && hue < 0.58;
                if (isWater) continue;
                const luminance = 0.2126 * r + 0.7152 * g + 0.0722 * b;
                const shade = 0.84 + Math.min(1, luminance) * 0.12;
                const targetR = 206 * shade;
                const targetG = 201 * shade;
                const targetB = 190 * shade;
                const mix = 0.96;
                data[i] = Math.round(r * 255 * (1 - mix) + targetR * mix);
                data[i + 1] = Math.round(g * 255 * (1 - mix) + targetG * mix);
                data[i + 2] = Math.round(b * 255 * (1 - mix) + targetB * mix);
              }
              ctx.putImageData(image, 0, 0);
              const whiteMap = new THREE.CanvasTexture(canvas);
              whiteMap.flipY = material.map.flipY;
              whiteMap.colorSpace = material.map.colorSpace;
              whiteMap.wrapS = material.map.wrapS;
              whiteMap.wrapT = material.map.wrapT;
              whiteMap.repeat.copy(material.map.repeat);
              whiteMap.offset.copy(material.map.offset);
              whiteMap.center.copy(material.map.center);
              whiteMap.rotation = material.map.rotation;
              whiteMap.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
              material.map = whiteMap;
              material.color.set(0xf1eee7);
              material.metalness = 0.01;
              material.roughness = 0.82;
              material.metalnessMap = null;
              material.roughnessMap = null;
              material.needsUpdate = true;
            } catch (error) {
              console.warn('[Fountain] Could not recolor GLB stone texture; using white tint.', error);
              material.color.set(0xe3ded3);
              material.metalness = 0.01;
              material.roughness = 0.82;
            }
          }
        });
        glbFountain.add(model);

        const stoneMaterials = new Set([stoneMat, stoneLightMat, stoneEdgeMat]);
        fountain.traverse((obj) => {
          if (!obj.isMesh) return;
          if (stoneMaterials.has(obj.material)) obj.visible = false;
        });
        basinFloor.visible = false;
        lowerBasinFloor.visible = false;
        upperBasinFloor.visible = false;

        // Align the animated water and ripple rings with the GLB basins.
        poolWaterBase = 0.63;
        lowerWaterBase = 2.02;
        upperWaterBase = 2.88;
        poolWater.position.y = poolWaterBase;
        poolWater.scale.set(0.64, 0.64, 1);
        lowerWater.position.y = lowerWaterBase;
        lowerWater.scale.set(0.82, 0.82, 1);
        upperWater.position.y = upperWaterBase;
        upperWater.scale.set(1.1, 1.1, 1);
        for (const ring of poolRings) ring.position.y = 0.64;
        fountainDrops.visible = false;
        createFountainCascade();
        console.log('[Fountain] GLB exterior applied; animated water aligned.');
      },
      (progress) => {
        if (progress.total > 0) {
          const percent = Math.floor((progress.loaded / progress.total) * 10) * 10;
          if (percent > glbReportedPercent) {
            glbReportedPercent = percent;
            console.log(`[Fountain] GLB loading: ${percent}% (${Math.round(progress.loaded / 1048576)} / ${Math.round(progress.total / 1048576)} MB)`);
          }
        } else {
          console.log(`[Fountain] GLB downloading: ${Math.round(progress.loaded / 1048576)} MB`);
        }
      },
      (error) => {
        console.warn('[Fountain] GLB failed to load; keeping original fountain fallback.', error);
      }
    );

    // ---------------------------------------------------------------------
    // Foliage library (flowerless: only leaves, boxwood, olive, sage, cypress)
    // ---------------------------------------------------------------------
    const potProfile = [
      new THREE.Vector2(0.31, 0.0),
      new THREE.Vector2(0.25, 0.05),
      new THREE.Vector2(0.36, 0.54),
      new THREE.Vector2(0.49, 0.7),
      new THREE.Vector2(0.53, 0.77),
      new THREE.Vector2(0.49, 0.81),
    ];
    const potGeometry = new THREE.LatheGeometry(potProfile, 30);
    const potRimGeometry = new THREE.TorusGeometry(0.49, 0.035, 8, 32);
    const soilGeometry = new THREE.CircleGeometry(0.44, 24);

    function addPotLeafCloud(plant, type, scale) {
      const specs = {
        sphere: { geo: ovalLeafGeo, mat: boxwoodLightMat, count: 2470, radius: 0.62, yMin: 0.62, yMax: 1.9, size: 0.46 },
        cone: { geo: ovalLeafGeo, mat: boxwoodLightMat, count: 1805, radius: 0.56, yMin: 0.7, yMax: 2.4, size: 0.4 },
        spiral: { geo: ovalLeafGeo, mat: boxwoodLightMat, count: 2394, radius: 0.56, yMin: 0.85, yMax: 2.55, size: 0.3 },
        hosta: { geo: wavyLeafGeo, mat: hostaMat, count: 190, radius: 0.54, yMin: 0.8, yMax: 1.6, size: 0.44 },
        sage: { geo: wavyLeafGeo, mat: sageMat, count: 456, radius: 0.45, yMin: 0.88, yMax: 1.45, size: 0.32 },
        ivy: { geo: heartLeafGeo, mat: ivyMat, count: 380, radius: 0.46, yMin: 0.4, yMax: 1.05, size: 0.17 },
        monstera: { geo: monsteraLeafGeo, mat: monsteraLeafMat, count: 133, radius: 0.56, yMin: 0.9, yMax: 2.25, size: 0.4 },
        fern: { geo: ovalLeafGeo, mat: fernLeafMat, count: 3192, radius: 0.56, yMin: 0.78, yMax: 1.85, size: 0.2 },
        fiddle: { geo: fiddleLeafGeo, mat: fiddleLeafMat, count: 190, radius: 0.46, yMin: 0.9, yMax: 2.4, size: 0.3 },
        snake: { geo: swordLeafGeo, mat: swordLeafMat, count: 171, radius: 0.3, yMin: 0.8, yMax: 2.5, size: 0.32 },
        heartarrow: { geo: null, mat: null, count: 152, radius: 0.38, yMin: 0.9, yMax: 1.8, size: 0.3 },
      };
      const spec = specs[type];
      const dummy = new THREE.Object3D();
      const makeCloud = (geometry, material, count, sizeMultiplier = 1) => {
        const matrices = [];
        for (let i = 0; i < count; i++) {
          const angle = random() * TAU;
          const radius = spec.radius * Math.sqrt(random());
          const y = lerp(spec.yMin, spec.yMax, random());
          dummy.position.set(Math.cos(angle) * radius, y, Math.sin(angle) * radius);
          dummy.rotation.set(
            (random() - 0.5) * 1.5,
            random() * TAU,
            (random() - 0.5) * 1.5,
            'YXZ'
          );
          const length = spec.size * sizeMultiplier * (0.6 + random() * 0.9);
          const width = spec.size * sizeMultiplier * (0.55 + random() * 0.8);
          dummy.scale.set(width, length, spec.size * sizeMultiplier);
          dummy.updateMatrix();
          matrices.push(dummy.matrix.clone());
        }
        addLeafInstances(plant, geometry, material, matrices, false);
      };
      if (type === 'heartarrow') {
        makeCloud(heartLeafGeo, heartLeafMat, 76);
        makeCloud(arrowLeafGeo, arrowLeafMat, 76);
      } else if (spec) {
        makeCloud(spec.geo, spec.mat, spec.count);
      }
    }

    function makePot(scale = 1, light = false) {
      const group = new THREE.Group();
      const pot = new THREE.Mesh(potGeometry, light ? terracottaLightMat : terracottaMat);
      pot.castShadow = true;
      pot.receiveShadow = true;
      group.add(pot);
      const rim = new THREE.Mesh(potRimGeometry, light ? terracottaLightMat : terracottaMat);
      rim.rotation.x = Math.PI / 2;
      rim.position.y = 0.81;
      rim.castShadow = true;
      group.add(rim);
      const soil = new THREE.Mesh(soilGeometry, soilMat);

    function makeBoxwoodPlant(radius = 0.55, height = 1.1) {

        position.copy(normal).multiplyScalar(radius * 0.98).add(new THREE.Vector3(0, height, 0));

    function makeConeTopiary(radius = 0.4, height = 1.6) {

    function makeSpiralTopiary(height = 2.0) {
      const group = new THREE.Group();
      const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.12, height, 8), oliveDarkMat);
      stem.position.y = height / 2 + 0.82;

      const normal = new THREE.Vector3();

      for (let i = 0; i < count; i++) {
        const t = i / (count - 1);
        const angle = t * Math.PI * 3.3;

        const px = Math.cos(angle) * radiusAt;
        const py = 0.95 + t * (height - 0.15);

        const puffRadius = lerp(0.32, 0.15, t);

        puff.position.set(px, py, pz);

    function makeOliveTree(scale = 1) {
      const group = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.18, 1.85, 9), woodMat);
      trunk.position.y = 0.925;
      trunk.rotation.z = 0.05;
      trunk.castShadow = true;
      group.add(trunk);

      const clusters = [];
      function addCurvedOliveBranch(start, points, radius, addCluster = true) {
        const curve = new THREE.CatmullRomCurve3([start, ...points]);
        const branch = new THREE.Mesh(
          new THREE.TubeGeometry(curve, 10, radius, 6, false),
          woodMat
        );
        branch.castShadow = true;
        group.add(branch);
        if (addCluster) {
          const end = points[points.length - 1];
          const tangent = curve.getTangent(1).normalize();
          clusters.push({
            center: end.clone().add(new THREE.Vector3(0, 0.12, 0)),
            angle: Math.atan2(tangent.z, tangent.x),
          });
        }
        return curve;
      }

      // Slender, crooked scaffold branches leave the trunk at different heights.
      const primaryCount = 8;
      for (let i = 0; i < primaryCount; i++) {
        const angle = (i / primaryCount) * TAU + 0.3 + (random() - 0.5) * 0.55;
        const startY = 0.95 + random() * 0.8;
        const start = new THREE.Vector3(
          Math.cos(angle) * 0.04,
          startY,
          Math.sin(angle) * 0.04
        );
        const reach = 0.6 + random() * 0.95;
        const rise = 0.55 + random() * 1.05;
        const bend = (random() - 0.5) * 0.7;
        const p1 = new THREE.Vector3(
          Math.cos(angle) * reach * 0.28 + Math.cos(angle + 1.4) * bend * 0.3,
          startY + rise * 0.28,
          Math.sin(angle) * reach * 0.28 + Math.sin(angle + 1.4) * bend * 0.3
        );
        const p2 = new THREE.Vector3(
          Math.cos(angle + bend * 0.35) * reach * 0.65,
          startY + rise * 0.65 + (random() - 0.5) * 0.18,
          Math.sin(angle + bend * 0.35) * reach * 0.65
        );
        const p3 = new THREE.Vector3(
          Math.cos(angle + bend) * reach,
          startY + rise,
          Math.sin(angle + bend) * reach
        );
        const primaryCurve = addCurvedOliveBranch(start, [p1, p2, p3], 0.045 + random() * 0.012);

        // A pair of uneven, curved twigs from the outer half of each limb.
        const twigCount = 1 + Math.floor(random() * 2);
        for (let twig = 0; twig < twigCount; twig++) {
          const t = 0.5 + random() * 0.3;
          const base = primaryCurve.getPoint(t);
          const sideAngle = angle + (twig === 0 ? 1 : -1) * (0.55 + random() * 0.45);
          const length = 0.28 + random() * 0.48;
          const tip = base.clone().add(new THREE.Vector3(
            Math.cos(sideAngle) * length,
            0.18 + random() * 0.5,
            Math.sin(sideAngle) * length
          ));
          const mid = base.clone().lerp(tip, 0.5).add(new THREE.Vector3(
            (random() - 0.5) * 0.18,
            (random() - 0.5) * 0.12,
            (random() - 0.5) * 0.18
          ));
          addCurvedOliveBranch(base, [mid, tip], 0.018 + random() * 0.012);
        }
      }

      // Loosely separated pinnate leaf clusters at irregular branch tips.
      const leafMatrices = [];
      const rachisPositions = [];
      for (const cluster of clusters) {
        const frondCount = 4 + Math.floor(random() * 4);
        for (let f = 0; f < frondCount; f++) {
          const angle = cluster.angle + (f / frondCount) * TAU + (random() - 0.5) * 0.7;
          const start = cluster.center.clone().add(new THREE.Vector3(
            Math.cos(angle) * 0.05,
            (random() - 0.5) * 0.14,
            Math.sin(angle) * 0.05
          ));
          const direction = new THREE.Vector3(
            Math.cos(angle) * (0.45 + random() * 0.3),
            0.18 + random() * 0.42,
            Math.sin(angle) * (0.45 + random() * 0.3)
          ).normalize();
          const frondLength = 0.4 + random() * 0.42;
          const side = new THREE.Vector3(-Math.sin(angle), 0, Math.cos(angle)).normalize();
          let previous = start.clone();
          for (let j = 1; j <= 7; j++) {
            const t = j / 7;
            const point = start.clone().addScaledVector(direction, frondLength * t);
            rachisPositions.push(previous.x, previous.y, previous.z, point.x, point.y, point.z);
            previous = point;
            const leafletScale = (0.55 + random() * 0.25) * (1.1 - t * 0.3);
            for (const sign of [-1, 1]) {
              const tip = side.clone().multiplyScalar(sign).add(new THREE.Vector3(0, 0.12, 0)).normalize();
              const leafPos = point.clone().addScaledVector(side, sign * 0.035);
              leafMatrices.push(leafTipMatrix(leafPos, tip, leafletScale, random() * TAU));
            }
          }
        }
      }

      addLeafInstances(group, ovalLeafGeo, oliveLeafletMat, leafMatrices);
      const rachisGeo = new THREE.BufferGeometry();
      rachisGeo.setAttribute('position', new THREE.Float32BufferAttribute(rachisPositions, 3));
      group.add(new THREE.LineSegments(rachisGeo, new THREE.LineBasicMaterial({ color: 0x4e6246 })));
      group.scale.setScalar(scale);
      return group;
    }

    function plantPot(x, z, type, scale = 1, rotation = 0) {
      const pot = makePot(scale, type === 'hosta');
      pot.position.set(x, 0, z);
      pot.rotation.y = rotation;
      scene.add(pot);
      let plant;
      if (type === 'sphere') plant = makeBoxwoodPlant(0.56 * scale, 0.98 * scale);
      if (type === 'cone') plant = makeConeTopiary(0.4 * scale, 1.45 * scale);
      if (type === 'spiral') plant = makeSpiralTopiary(1.85 * scale);
      if (type === 'olive') plant = makeOliveTree(0.82 * scale);
      if (type === 'hosta') plant = makeHosta(0.9 * scale);
      if (type === 'sage') plant = makeDustyMiller(1.15 * scale);
      if (type === 'ivy') plant = makeIvyTrail();
      if (type === 'monstera') plant = makeMonstera(scale);
      if (type === 'fern') plant = makeFern(scale);

      if (type === 'heartarrow') plant = makeHeartArrowPlant(scale);

      if (plant) {

        pot.add(plant);
        addSway(plant, type === 'cone' || type === 'spiral' ? 0.006 : 0.012, 0.32 + random() * 0.25);
      }
      return pot;
    }

    // Walkway planters, repeated shared geometry and materials.

    // Cypress and olive trees around the walled garden.
    // Narrow teardrop: sharp tip, smooth widening, widest just above the base,
    // then a slight inward turn at the foot.
    const cypressKeys = [
      [0, 0.34], [0.06, 0.42], [0.12, 0.52], [0.2, 0.63],
      [0.3, 0.625], [0.42, 0.58], [0.55, 0.5], [0.68, 0.4],
      [0.78, 0.3], [0.87, 0.19], [0.94, 0.1], [0.98, 0.035], [1, 0],
    ];
    function cypressRadiusAt(t) {
      t = clamp(t, 0, 1);
      for (let i = 1; i < cypressKeys.length; i++) {
        if (t <= cypressKeys[i][0]) {
          const [t0, r0] = cypressKeys[i - 1];
          const [t1, r1] = cypressKeys[i];
          const u = (t - t0) / Math.max(0.0001, t1 - t0);
          const smooth = u * u * (3 - 2 * u);
          return lerp(r0, r1, smooth);
        }
      }
      return 0;
    }
    const cypressProfile = cypressKeys.map(([t, r]) => new THREE.Vector2(r, t * 5.3));
    const cypressGeo = new THREE.LatheGeometry(cypressProfile, 24);

    function addCypress(x, z, scale = 1, height = 1) {
      const group = new THREE.Group();
      const foliage = new THREE.Mesh(cypressGeo, cypressMat);
      foliage.castShadow = true;
      foliage.receiveShadow = true;
      foliage.scale.set(scale, height, scale);
      group.add(foliage);
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.08 * scale, 0.12 * scale, 0.8, 8), woodMat);
      trunk.position.y = 0.3;
      trunk.castShadow = true;
      group.add(trunk);
      // Four-sided needle foliage over the cypress silhouette.
      const needleMatrices = [];
      const cypressNeedleCount = 30000;
      for (let i = 0; i < cypressNeedleCount; i++) {
        const t = (i + random() * 0.9) / cypressNeedleCount;
        const angle = i * 2.399963 + random() * 0.12;
        const radiusAt = cypressRadiusAt(t) * scale;
        const px = Math.cos(angle) * radiusAt;
        const pz = Math.sin(angle) * radiusAt;
        const py = 0.2 + t * 4.9 * height;
        const direction = new THREE.Vector3(Math.cos(angle), -0.2 - random() * 0.2, Math.sin(angle)).normalize();
        needleMatrices.push(leafTipMatrix(new THREE.Vector3(px, py, pz), direction, 0.75 + random() * 0.5, random() * TAU));
      }
      // Inner fill needles close the remaining visual gaps between surface needles.
      for (let i = 0; i < 8000; i++) {
        const t = random();
        const angle = random() * TAU;
        const radiusAt = cypressRadiusAt(t) * scale * (0.3 + random() * 0.55);
        const px = Math.cos(angle) * radiusAt;
        const pz = Math.sin(angle) * radiusAt;
        const py = 0.2 + t * 4.9 * height;
        const direction = new THREE.Vector3(
          Math.cos(angle) * (0.3 + random() * 0.8),
          -0.1 - random() * 0.45,
          Math.sin(angle) * (0.3 + random() * 0.8)
        ).normalize();
        needleMatrices.push(leafTipMatrix(new THREE.Vector3(px, py, pz), direction, 0.8 + random() * 0.7, random() * TAU));
      }

      // Needle cluster hugging the sharp cypress apex.
      for (let i = 0; i < 900; i++) {
        const angle = random() * TAU;
        const radius = random() * 0.06 * scale;
        const py = (5.02 + random() * 0.2) * height;
        const pos = new THREE.Vector3(Math.cos(angle) * radius, py, Math.sin(angle) * radius);
        const direction = new THREE.Vector3(Math.cos(angle) * 0.2, 0.92, Math.sin(angle) * 0.2).normalize();
        needleMatrices.push(leafTipMatrix(pos, direction, 0.65 + random() * 0.35, random() * TAU));
      }
      addLeafInstances(group, spruceNeedleGeo, cypressMat, needleMatrices);
      group.position.set(x, 0, z);
      group.rotation.y = random() * TAU;
      group.scale.setScalar(2);
      scene.add(group);
      addTreeGrass(x, z, 0.95);
      addSway(group, 0.006, 0.24);
      return group;
    }

    addCypress(-13.8, -12.5, 0.86, 1.12);
    addCypress(13.3, -13.2, 0.9, 1.08);
    addCypress(-14.7, 8.9, 0.76, 1.0);

    function addOlive(x, z, scale) {

    function addTreeBranch(parent, start, end, radius, material) {
      const direction = end.clone().sub(start);
      const length = direction.length();
      const branch = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius * 1.25, length, 7), material);
      branch.position.copy(start).add(end).multiplyScalar(0.5);
      branch.quaternion.setFromUnitVectors(leafUp, direction.normalize());
      branch.castShadow = true;
      parent.add(branch);
      return branch;
    }

    function makePineTree(scale = 1) {
      const group = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.17, 3.0, 9), woodMat);
      trunk.position.y = 1.5;
      trunk.castShadow = true;
      group.add(trunk);
      const needleMatrices = [];
      const tiers = 7;
      for (let tier = 0; tier < tiers; tier++) {
        const t = tier / (tiers - 1);
        const y = 0.85 + t * 2.3;
        // Teardrop profile: broad, rounded lower crown tapering to a pointed leader.
        const reach = 0.12 + 1.25 * Math.pow(1 - t, 0.8) + 0.22 * Math.sin(t * Math.PI);
        const spokes = 6;
        for (let spoke = 0; spoke < spokes; spoke++) {
          const angle = (spoke / spokes) * TAU + tier * 0.46;
          const end = new THREE.Vector3(Math.cos(angle) * reach, y + 0.08, Math.sin(angle) * reach);
          addTreeBranch(group, new THREE.Vector3(0, y, 0), end, 0.03, woodMat);
          for (let i = 0; i < 160; i++) {
            const along = 0.15 + random() * 0.85;
            const pos = new THREE.Vector3(
              Math.cos(angle) * reach * along * (0.8 + random() * 0.3),
              y + (random() - 0.5) * 0.26,
              Math.sin(angle) * reach * along * (0.8 + random() * 0.3)
            );
            const tipDirection = new THREE.Vector3(
              Math.cos(angle) * (0.35 + random() * 0.85),
              -0.22 - random() * 0.35,
              Math.sin(angle) * (0.35 + random() * 0.85)
            ).normalize();
            needleMatrices.push(leafTipMatrix(pos, tipDirection, 0.85 + random() * 0.55, random() * TAU));
          }
        }
      }

      // Pointed leafy crown: needles continue all the way to the top tip.
      for (let i = 0; i < 700; i++) {
        const t = Math.sqrt(random());
        const angle = random() * TAU;
        const radius = Math.pow(1 - t, 1.7) * (0.28 + random() * 0.09);
        const y = 2.9 + t * 0.82;
        const pos = new THREE.Vector3(Math.cos(angle) * radius, y, Math.sin(angle) * radius);
        const direction = new THREE.Vector3(
          Math.cos(angle) * (0.16 + random() * 0.3),
          0.68 - random() * 0.22,
          Math.sin(angle) * (0.16 + random() * 0.3)
        ).normalize();
        needleMatrices.push(leafTipMatrix(pos, direction, 0.72 + random() * 0.4, random() * TAU));
      }

      // Tight needle whorls converging on the leader keep the very top sharp.
      const crownRings = [
        { radius: 0.085, y: 3.73, count: 28, length: 0.9 },
        { radius: 0.06, y: 3.8, count: 20, length: 0.82 },
        { radius: 0.038, y: 3.87, count: 14, length: 0.75 },
        { radius: 0.018, y: 3.93, count: 8, length: 0.68 },
      ];
      for (const ring of crownRings) {
        for (let i = 0; i < ring.count; i++) {
          const angle = (i / ring.count) * TAU + random() * 0.12;
          const pos = new THREE.Vector3(Math.cos(angle) * ring.radius, ring.y, Math.sin(angle) * ring.radius);
          const direction = new THREE.Vector3(
            -Math.cos(angle) * (0.18 + random() * 0.1),
            0.94,
            -Math.sin(angle) * (0.18 + random() * 0.1)
          ).normalize();
          needleMatrices.push(leafTipMatrix(pos, direction, ring.length, random() * TAU));
        }
      }
      // Single final needle at the apex.
      needleMatrices.push(leafTipMatrix(
        new THREE.Vector3(0, 3.97, 0),
        new THREE.Vector3(0, 1, 0),
        1.1,
        0
      ));

      addLeafInstances(group, pineNeedleGeo, pineNeedleMat, needleMatrices);
      group.scale.setScalar(scale);
      return group;
    }

    function addPine(x, z, scale = 1) {
      const tree = makePineTree(scale);
      tree.scale.multiplyScalar(2);
      tree.position.set(x, 0, z);
      scene.add(tree);

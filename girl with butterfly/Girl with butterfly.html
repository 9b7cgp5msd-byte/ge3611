<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#e7d7bd" />
  <title>Girl with Butterfly — Yuri Rostovich</title>
  <style>
    :root {
      --ink: #3c352a;
      --muted: #766c5c;
      --paper: rgba(253, 247, 237, 0.68);
      --paper-strong: rgba(255, 249, 240, 0.84);
      --line: rgba(255, 255, 255, 0.62);
      --line-soft: rgba(90, 72, 47, 0.13);
      --gold: #b38a55;
      --sage: #69765c;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #e7d7bd;
      color: var(--ink);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #view {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      outline: none;
    }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 42%, transparent 47%, rgba(55, 34, 17, 0.13) 100%),
        linear-gradient(to bottom, rgba(255, 231, 187, 0.16), transparent 24%, transparent 78%, rgba(54, 32, 15, 0.09));
      z-index: 2;
    }

    .brand {
      position: fixed;
      top: clamp(22px, 4vw, 48px);
      left: clamp(22px, 4vw, 56px);
      z-index: 5;
      pointer-events: none;
      color: #f8ecd9;
      text-shadow: 0 2px 20px rgba(49, 32, 14, 0.32);
    }

    .brand .eyebrow {
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: none;
      opacity: 0.82;
      margin-bottom: 9px;
      font-weight: 600;
    }

    .brand h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(24px, 3.4vw, 41px);
      font-weight: 400;
      letter-spacing: 0.012em;
      line-height: 1;
    }

    .brand p {
      margin: 11px 0 0;
      font-size: 11px;
      letter-spacing: 0.11em;
      color: rgba(255, 247, 233, 0.74);
      font-weight: 400;
    }

    .hint {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: clamp(18px, 2.4vw, 28px);
      z-index: 5;
      color: rgba(255, 248, 235, 0.76);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-align: center;
      white-space: nowrap;
      text-shadow: 0 1px 8px rgba(43, 27, 11, 0.38);
      pointer-events: none;
    }

    .yuri-dialogue {
      position: fixed;
      left: 50%;
      bottom: clamp(88px, 12vh, 136px);
      z-index: 8;
      width: min(560px, calc(100vw - 40px));
      padding: 16px 22px 18px;
      transform: translate(-50%, 12px);
      background: rgba(39, 30, 23, 0.84);
      border: 1px solid rgba(244, 218, 174, 0.5);
      border-radius: 2px;
      box-shadow: 0 16px 45px rgba(25, 16, 9, 0.35);
      backdrop-filter: blur(10px);
      color: #f5e8d2;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 350ms ease, transform 450ms cubic-bezier(0.2, 0.8, 0.2, 1), visibility 350ms;
    }

    .yuri-dialogue.is-visible {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, 0);
    }

    .yuri-dialogue__speaker {
      color: rgba(244, 218, 174, 0.82);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    .yuri-dialogue__line {
      margin: 7px 0 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(17px, 1.8vw, 22px);
      line-height: 1.42;
      letter-spacing: 0.01em;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      background: #eadcc5;
      color: #5e5140;
      transition: opacity 800ms ease, visibility 800ms;
    }

    #loading .loader {
      text-align: center;
      font-family: Georgia, "Times New Roman", serif;
      letter-spacing: 0.07em;
    }

    #loading .loader::before {
      content: "";
      display: block;
      width: 26px;
      height: 26px;
      margin: 0 auto 18px;
      border-radius: 50%;
      border: 1px solid rgba(98, 78, 51, 0.26);
      border-top-color: rgba(98, 78, 51, 0.72);
      animation: turn 1.2s linear infinite;
    }

    #loading .loader small {
      display: block;
      margin-top: 9px;
      font: 10px/1.4 ui-sans-serif, -apple-system, sans-serif;
      letter-spacing: 0.19em;
      text-transform: uppercase;
      color: rgba(94, 81, 64, 0.62);
    }

    body.ready #loading {
      opacity: 0;
      visibility: hidden;
    }

    @keyframes turn { to { transform: rotate(360deg); } }

    .umbrella-pickup {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 34;
      width: 44px;
      height: 44px;
      color: rgba(214, 231, 220, 0.9);
      border: 1px solid rgba(197, 220, 206, 0.34);
      border-radius: 50%;
      background: rgba(12, 25, 19, 0.44);
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.18), inset 0 0 14px rgba(188, 216, 199, 0.06);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      pointer-events: none;
      opacity: 0;
      transform: translate3d(-100px, -100px, 0) translate(-50%, -50%);
      transition: opacity 180ms ease, transform 220ms cubic-bezier(0.2, 0.7, 0.2, 1);
    }
    .umbrella-pickup.is-visible {
      opacity: 1;
      pointer-events: auto;
      cursor: pointer;
      touch-action: manipulation;
    }
    .umbrella-pickup__icon {
      position: absolute;
      inset: 10px;
      width: 24px;
      height: 24px;
      overflow: visible;
      opacity: 0.7;
      transform: rotate(-90deg);
    }
    .umbrella-pickup--water {
      color: rgba(176, 224, 238, 0.98);
      border-color: rgba(156, 210, 227, 0.45);
      background: rgba(12, 35, 41, 0.5);
    }
    .umbrella-pickup--water .umbrella-pickup__icon {
      transform: none;
    }
    .umbrella-pickup__ring {
      position: absolute;
      inset: -4px;
      border: 1px solid rgba(198, 225, 208, 0.32);
      border-radius: 50%;
      opacity: 0;
    }
    .umbrella-pickup.is-visible .umbrella-pickup__ring {
      animation: umbrella-pickup-pulse 2.4s ease-out infinite;
    }
    @keyframes umbrella-pickup-pulse {
      0% { opacity: 0.32; transform: scale(0.9); }
      75%, 100% { opacity: 0; transform: scale(1.28); }
    }
    @media (prefers-reduced-motion: reduce) {
      .umbrella-pickup, .umbrella-pickup__ring {
        animation: none;
        transition: none;
      }
    }

    .virtual-joystick {
      position: fixed;
      right: max(22px, env(safe-area-inset-right));
      left: auto;
      bottom: max(22px, env(safe-area-inset-bottom));
      width: 124px;
      height: 124px;
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      touch-action: none;
      user-select: none;
      transition: opacity 420ms ease;
    }
    body.ready .virtual-joystick {
      opacity: 1;
      pointer-events: auto;
    }
    .virtual-joystick__base {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(211, 190, 146, 0.34);
      background:
        radial-gradient(circle at 42% 38%, rgba(196, 181, 139, 0.13), rgba(52, 42, 27, 0.24) 62%),
        rgba(63, 50, 32, 0.2);
      box-shadow:
        inset 0 0 22px rgba(0, 0, 0, 0.28),
        0 10px 28px rgba(0, 0, 0, 0.14);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      transition: border-color 180ms ease, background-color 180ms ease;
    }
    .virtual-joystick.is-active .virtual-joystick__base {
      border-color: rgba(235, 213, 166, 0.5);
      background-color: rgba(82, 65, 41, 0.26);
    }
    .virtual-joystick__knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 46px;
      height: 46px;
      margin: -23px 0 0 -23px;
      border-radius: 50%;
      border: 1px solid rgba(240, 221, 178, 0.46);
      background: rgba(214, 197, 154, 0.28);
      box-shadow:
        inset 0 0 12px rgba(232, 242, 235, 0.12),
        0 4px 14px rgba(0, 0, 0, 0.2);
      will-change: transform;
      transition: transform 220ms cubic-bezier(0.2, 0.7, 0.2, 1), background-color 180ms ease;
    }
    .virtual-joystick.is-active .virtual-joystick__knob {
      background: rgba(231, 211, 166, 0.42);
      transition: transform 60ms linear, background-color 180ms ease;
    }
    @media (max-width: 720px), (max-height: 520px) {
      .umbrella-pickup {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 34;
      width: 44px;
      height: 44px;
      color: rgba(214, 231, 220, 0.9);
      border: 1px solid rgba(197, 220, 206, 0.34);
      border-radius: 50%;
      background: rgba(12, 25, 19, 0.44);
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.18), inset 0 0 14px rgba(188, 216, 199, 0.06);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      pointer-events: none;
      opacity: 0;
      transform: translate3d(-100px, -100px, 0) translate(-50%, -50%);
      transition: opacity 180ms ease, transform 220ms cubic-bezier(0.2, 0.7, 0.2, 1);
    }
    .umbrella-pickup.is-visible {
      opacity: 1;
      pointer-events: auto;
      cursor: pointer;
      touch-action: manipulation;
    }
    .umbrella-pickup__icon {
      position: absolute;
      inset: 10px;
      width: 24px;
      height: 24px;
      overflow: visible;
      opacity: 0.7;
      transform: rotate(-90deg);
    }
    .umbrella-pickup--water {
      color: rgba(176, 224, 238, 0.98);
      border-color: rgba(156, 210, 227, 0.45);
      background: rgba(12, 35, 41, 0.5);
    }
    .umbrella-pickup--water .umbrella-pickup__icon {
      transform: none;
    }
    .umbrella-pickup__ring {
      position: absolute;
      inset: -4px;
      border: 1px solid rgba(198, 225, 208, 0.32);
      border-radius: 50%;
      opacity: 0;
    }
    .umbrella-pickup.is-visible .umbrella-pickup__ring {
      animation: umbrella-pickup-pulse 2.4s ease-out infinite;
    }
    @keyframes umbrella-pickup-pulse {
      0% { opacity: 0.32; transform: scale(0.9); }
      75%, 100% { opacity: 0; transform: scale(1.28); }
    }
    @media (prefers-reduced-motion: reduce) {
      .umbrella-pickup, .umbrella-pickup__ring {
        animation: none;
        transition: none;
      }
    }

    .virtual-joystick {
        width: 104px;
        height: 104px;
        right: max(16px, env(safe-area-inset-right));
        left: auto;
        bottom: max(16px, env(safe-area-inset-bottom));
      }
      .virtual-joystick__knob {
        width: 40px;
        height: 40px;
        margin: -20px 0 0 -20px;
      }
    }

    @media (max-width: 820px) {
      .brand p { display: none; }
      .hint {
        top: 20px;
        right: 18px;
        left: auto;
        bottom: auto;
        font-size: 9px;
      }
      .yuri-dialogue {
        bottom: 132px;
        padding: 14px 18px 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; }
      #loading .loader::before { animation: none; }
    }
    .scene-cursor {
      --cursor-line: rgba(211, 190, 146, 0.36);
      --cursor-ink: rgba(251, 241, 222, 0.94);
      --cursor-accent: #c9a96e;
      --cursor-surface: rgba(63, 50, 32, 0.22);
      --cursor-glow: rgba(179, 138, 85, 0.2);
    }
    /* Scene cursor: bottom-left portrait badge + label */
    .scene-cursor {
      position: fixed;
      left: max(22px, env(safe-area-inset-left));
      bottom: max(22px, env(safe-area-inset-bottom));
      z-index: 35;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transform: translateY(6px) scale(0.96);
      transition: opacity 420ms ease, transform 420ms ease;
      pointer-events: none;
    }
    body.ready .scene-cursor {
      opacity: 1;
      transform: none;
    }
    .scene-cursor__badge {
      width: 90px;
      height: 90px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 1px solid var(--cursor-line);
      background:
        radial-gradient(circle at 42% 38%, var(--cursor-glow), transparent 62%),
        var(--cursor-surface);
      box-shadow:
        inset 0 0 22px rgba(0, 0, 0, 0.28),
        0 10px 28px rgba(0, 0, 0, 0.14);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
    }
    .scene-cursor__icon {
      width: 74%;
      height: 74%;
      display: block;
      object-fit: contain;
    }
    .scene-cursor__label {
      color: var(--cursor-ink);
      font: 600 11px/1.15 ui-sans-serif, system-ui, sans-serif;
      letter-spacing: 0.12em;
      white-space: nowrap;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.55);
      opacity: 0.88;
    }
    @media (max-width: 720px), (max-height: 520px) {
      .scene-cursor {
        left: max(16px, env(safe-area-inset-left));
        bottom: max(16px, env(safe-area-inset-bottom));
        gap: 8px;
      }
      .scene-cursor__badge {
        width: 74px;
        height: 74px;
      }
      .scene-cursor__label {
        font-size: 10px;
        letter-spacing: 0.1em;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .scene-cursor { transition: none; }
    }

  </style>
</head>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "@pixiv/three-vrm": "./vendor/three-vrm.module.js"

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { createAudience } from './audience.js';
    import { createJoystick } from './joystick.js';
    import { VRMLoaderPlugin } from '@pixiv/three-vrm';
    import { createPickupPrompt } from './pickupPrompt.js';

    // ---------------------------------------------------------------------
    // Small helpers
    // ---------------------------------------------------------------------
    const TAU = Math.PI * 2;
    const DEG = Math.PI / 180;
    const lerp = (a, b, t) => a + (b - a) * t;
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

    function mulberry32(seed) {
      return function () {
        seed |= 0;
        seed = (seed + 0x6d2b79f5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    const random = mulberry32(50931);

    const canvas = document.querySelector('#view');
    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: false,
      powerPreference: 'high-performance',
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.04;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const maxAnisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());

    const scene = new THREE.Scene();
    const horizonColor = new THREE.Color(0xf6cfa0);
    scene.background = horizonColor.clone();
    scene.fog = null;

    const camera = new THREE.PerspectiveCamera(43, window.innerWidth / window.innerHeight, 0.1, 180);
    camera.position.set(7, 14, 30);

    const controls = new OrbitControls(camera, canvas);
    controls.target.set(0, 1.2, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.rotateSpeed = 0.56;
    controls.zoomSpeed = 0.72;
    controls.panSpeed = 0.4;
    controls.enablePan = false;
    controls.minDistance = 5.5;
    controls.maxDistance = 36;
    controls.minPolarAngle = 0.28;
    controls.maxPolarAngle = Math.PI / 2 - 0.035;
    controls.update();

    // ---------------------------------------------------------------------
    // Procedural canvas textures
    // ---------------------------------------------------------------------
    function makeTexture(size, painter, repeatX = 1, repeatY = 1) {
      const c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      const ctx = c.getContext('2d');
      painter(ctx, size);
      const texture = new THREE.CanvasTexture(c);
      texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(repeatX, repeatY);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = maxAnisotropy;
      return texture;
    }

    function gravelTexture() {
      const r = mulberry32(113);
      return makeTexture(768, (ctx, s) => {
        ctx.fillStyle = '#d8c6a7';
        ctx.fillRect(0, 0, s, s);
        const wash = ctx.createLinearGradient(0, 0, s, s);
        wash.addColorStop(0, 'rgba(238,224,198,.22)');
        wash.addColorStop(0.55, 'rgba(182,158,122,.10)');
        wash.addColorStop(1, 'rgba(245,232,207,.14)');
        ctx.fillStyle = wash;
        ctx.fillRect(0, 0, s, s);
        const tints = ['#cbb796', '#e3d3b5', '#bda887', '#d1bf9e', '#f0e1c5', '#b5a080'];
        for (let i = 0; i < 4600; i++) {
          const x = r() * s;
          const y = r() * s;
          const rad = 0.5 + r() * 2.1;
          ctx.fillStyle = tints[Math.floor(r() * tints.length)];
          ctx.globalAlpha = 0.23 + r() * 0.35;
          ctx.beginPath();
          ctx.ellipse(x, y, rad, rad * (0.45 + r() * 0.6), r() * TAU, 0, TAU);
          ctx.fill();
        }
        for (let i = 0; i < 650; i++) {
          ctx.globalAlpha = 0.08 + r() * 0.08;
          ctx.fillStyle = r() > 0.5 ? '#7d6a51' : '#f6ead4';
          ctx.beginPath();
          ctx.arc(r() * s, r() * s, 0.4 + r() * 1.2, 0, TAU);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }, 12, 12);
    }

    function pavingTexture(repeatX = 2, repeatY = 2) {
      const r = mulberry32(227);
      return makeTexture(768, (ctx, s) => {
        ctx.fillStyle = '#b3a086';
        ctx.fillRect(0, 0, s, s);
        const cols = 4;
        const rows = 4;
        const gap = 7;
        const tw = s / cols;
        const th = s / rows;
        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < cols; col++) {
            const shade = 206 + Math.floor(r() * 30);
            ctx.fillStyle = `rgb(${shade},${shade - 15},${shade - 38})`;
            ctx.fillRect(col * tw + gap, row * th + gap, tw - gap * 2, th - gap * 2);
            ctx.globalAlpha = 0.18;
            for (let i = 0; i < 36; i++) {
              ctx.fillStyle = r() > 0.5 ? '#fff1d7' : '#796a54';
              ctx.beginPath();
              ctx.arc(col * tw + gap + r() * (tw - gap * 2), row * th + gap + r() * (th - gap * 2), 0.5 + r() * 1.9, 0, TAU);
              ctx.fill();
            }
            ctx.globalAlpha = 0.12;
            ctx.strokeStyle = '#6d5c46';
            ctx.lineWidth = 1;
            for (let i = 0; i < 5; i++) {
              const y = row * th + gap + r() * (th - gap * 2);
              ctx.beginPath();
              ctx.moveTo(col * tw + gap, y);
              ctx.bezierCurveTo(col * tw + tw * 0.35, y + r() * 7, col * tw + tw * 0.65, y - r() * 5, col * tw + tw - gap, y + r() * 4);
              ctx.stroke();
            }
            ctx.globalAlpha = 1;
          }
        }
        // dust in the joints
        ctx.globalAlpha = 0.24;
        for (let i = 0; i < 700; i++) {
          ctx.fillStyle = '#e6d6bb';
          ctx.beginPath();
          ctx.arc(r() * s, r() * s, 0.4 + r() * 1.3, 0, TAU);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }, repeatX, repeatY);
    }

    function lawnTexture() {
      const r = mulberry32(353);
      return makeTexture(512, (ctx, s) => {
        ctx.fillStyle = '#7f9170';
        ctx.fillRect(0, 0, s, s);
        const shades = ['#899d77', '#74865f', '#9aab88', '#657a55', '#a8b795'];
        for (let i = 0; i < 8600; i++) {
          const x = r() * s;
          const y = r() * s;
          ctx.strokeStyle = shades[Math.floor(r() * shades.length)];
          ctx.globalAlpha = 0.22 + r() * 0.3;
          ctx.lineWidth = 0.5 + r() * 1.2;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + (r() - 0.5) * 3.5, y - 2 - r() * 6);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }, 7, 7);
    }

    function stuccoTexture() {
      const r = mulberry32(487);
      return makeTexture(512, (ctx, s) => {
        ctx.fillStyle = '#dfccb0';
        ctx.fillRect(0, 0, s, s);
        const g = ctx.createLinearGradient(0, 0, s, s);
        g.addColorStop(0, 'rgba(255,245,225,.34)');
        g.addColorStop(0.55, 'rgba(189,161,124,.10)');
        g.addColorStop(1, 'rgba(252,237,211,.18)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, s, s);
        for (let i = 0; i < 9000; i++) {
          const light = r() > 0.48;
          ctx.fillStyle = light ? '#f5e9d5' : '#ad9679';
          ctx.globalAlpha = 0.035 + r() * 0.075;
          ctx.beginPath();
          ctx.arc(r() * s, r() * s, 0.4 + r() * 2.3, 0, TAU);
          ctx.fill();
        }
        ctx.globalAlpha = 0.07;
        ctx.strokeStyle = '#8f785b';
        ctx.lineWidth = 1;
        for (let i = 0; i < 14; i++) {
          let x = r() * s;
          let y = r() * s;
          ctx.beginPath();
          ctx.moveTo(x, y);
          for (let j = 0; j < 4; j++) {
            x += (r() - 0.5) * 26;
            y += 8 + r() * 26;
            ctx.lineTo(x, y);
          }
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }, 3, 2);
    }

    function limestoneTexture() {
      const r = mulberry32(619);
      return makeTexture(512, (ctx, s) => {
        ctx.fillStyle = '#cdbb9e';
        ctx.fillRect(0, 0, s, s);
        for (let i = 0; i < 220; i++) {
          ctx.fillStyle = r() > 0.5 ? '#e1d2b9' : '#b8a487';
          ctx.globalAlpha = 0.05 + r() * 0.12;
          ctx.beginPath();
          ctx.ellipse(r() * s, r() * s, 3 + r() * 34, 1 + r() * 13, r() * TAU, 0, TAU);
          ctx.fill();
        }
        for (let i = 0; i < 4200; i++) {
          ctx.fillStyle = r() > 0.56 ? '#efe4d2' : '#9e8b70';
          ctx.globalAlpha = 0.035 + r() * 0.075;
          ctx.beginPath();
          ctx.arc(r() * s, r() * s, 0.4 + r() * 1.5, 0, TAU);
          ctx.fill();
        }
        ctx.globalAlpha = 0.07;
        ctx.strokeStyle = '#7e6c54';
        ctx.lineWidth = 1;
        for (let i = 0; i < 9; i++) {
          let x = r() * s;
          let y = r() * s;
          ctx.beginPath();
          ctx.moveTo(x, y);
          for (let j = 0; j < 5; j++) {
            x += (r() - 0.5) * 22;
            y += 7 + r() * 20;
            ctx.lineTo(x, y);
          }
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }, 2, 2);
    }

    // ---------------------------------------------------------------------
    // Materials
    // ---------------------------------------------------------------------
    const gravelMap = gravelTexture();
    const pathMapZ = pavingTexture(1.15, 8.5);
    const pathMapX = pavingTexture(8.5, 1.15);

    const boxwoodBallGeo = new THREE.IcosahedronGeometry(1, 2);
    const swayItems = [];
    const shared = {
      sphere: new THREE.SphereGeometry(1, 16, 12),
      cone: new THREE.ConeGeometry(1, 1, 16),
      cylinder: new THREE.CylinderGeometry(1, 1, 1, 14),
      blob: new THREE.IcosahedronGeometry(1, 1),
      leaf: null,
    };

    function addSway(object, amplitude = 0.006, speed = 0.42) {
      const baseX = object.rotation.x;
      const baseZ = object.rotation.z;
      swayItems.push({
        object,
        baseX,
        baseZ,
        amplitude,
        speed,
        phase: random() * TAU,
      });
    }

    function boxwoodBall(x, y, z, radius) {
      const mesh = new THREE.Mesh(boxwoodBallGeo, boxwoodLightMat);
      mesh.position.set(x, y, z);
      mesh.scale.setScalar(radius);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }


    // Tall, coarse sunflower-like foliage (leaves and stems only, no flowers)
    // in the first lawn bed. The clumps have strongly varied heights.
    const sunflowerLeafShape = new THREE.Shape();
    const leafSegments = 30;
    const leftEdge = [];
    for (let i = 0; i <= leafSegments; i++) {
      const t = i / leafSegments;
      const y = 0.04 + t * 1.24;
      let width = 0.46 * Math.pow(Math.sin(Math.PI * Math.min(1, t * 0.92 + 0.035)), 0.62);
      width *= 1 + 0.24 * Math.exp(-Math.pow((t - 0.16) / 0.16, 2));
      width *= i % 2 === 0 ? 1.045 : 0.93;
      leftEdge.push({ x: -width, y });
    }
    sunflowerLeafShape.moveTo(0, 0.17);
    sunflowerLeafShape.lineTo(-0.18, 0.035);
    for (const point of leftEdge) sunflowerLeafShape.lineTo(point.x, point.y);
    sunflowerLeafShape.lineTo(0, 1.31);
    for (let i = leftEdge.length - 1; i >= 0; i--) {
      const point = leftEdge[i];
      sunflowerLeafShape.lineTo(-point.x, point.y);
    }
    sunflowerLeafShape.lineTo(0.18, 0.035);
    sunflowerLeafShape.closePath();
    const sunflowerLeafGeo = new THREE.ShapeGeometry(sunflowerLeafShape, 1);
    const sunflowerLeafMat = new THREE.MeshStandardMaterial({
      color: 0x5b8547,
      roughness: 0.9,
      side: THREE.DoubleSide,
    });
    const sunflowerStemMat = new THREE.MeshStandardMaterial({ color: 0x58763b, roughness: 0.94 });

    const scatteredFoliagePositions = [];
    const flowerClusters = [];
    function registerFlowerClusters(points, type) {
      const added = [];
      for (const point of points) {
        const entry = {
          x: point.x, z: point.z, type, bloomed: false,
          heightOffset: (random() - 0.5) * 0.38,
        };
        flowerClusters.push(entry);
        added.push(entry);
      }
      return added;
    }
    const hydrangeaClumpPositions = [];
    for (const [lawnX, lawnZ] of [[-7.8, -6.2], [7.8, -6.2], [-7.8, 6.2], [7.8, 6.2]]) {
      hydrangeaClumpPositions.push(
        { x: lawnX - 1.05, z: lawnZ - 0.25 },
        { x: lawnX + 1.05, z: lawnZ + 0.25 }
      );
    }

    function addSunflowerFoliageBed() {
      const bedGroup = new THREE.Group();
      bedGroup.position.set(0, 0.05, 0);
      scene.add(bedGroup);
      const leafMatrices = [];
      const leafDummy = new THREE.Object3D();
      const clumpCount = 35;
      const clumpPositions = [];
      const exclusionZones = [
        [-9.2, 12.3, 3.0],
        [11.8, 12.8, 3.0],
        [-13.8, -12.5, 1.7],
        [13.3, -13.2, 1.7],
        [-14.7, 8.9, 1.7],
        [14.2, 8.4, 1.7],
        [-10.8, -14.2, 1.9],
        [-12.5, -4.8, 2.0],
        [-13.1, 0.3, 2.1],
        [0, -12.8, 1.8],
      ];
      let attempts = 0;
      while (clumpPositions.length < clumpCount && attempts < 8000) {
        attempts++;
        const x = -15.4 + random() * 30.8;
        const z = -15.4 + random() * 30.8;
        if (Math.abs(x) < 2.15 || Math.abs(z) < 2.15) continue;
        if (Math.hypot(x, z) < 6.55) continue;
        let blocked = false;
        for (const [ex, ez, radius] of exclusionZones) {
          if (Math.hypot(x - ex, z - ez) < radius) {
            blocked = true;
            break;
          }
        }
        if (blocked) continue;
        for (const h of hydrangeaClumpPositions) {
          if (Math.hypot(x - h.x, z - h.z) < 2.2) {
            blocked = true;
            break;
          }
        }
        if (blocked) continue;
        for (const point of clumpPositions) {
          if (Math.hypot(x - point.x, z - point.z) < 1.15) {
            blocked = true;
            break;
          }
        }
        if (!blocked) clumpPositions.push({ x, z });
      }
      scatteredFoliagePositions.push(...clumpPositions);
      const sunflowerClusterRefs = registerFlowerClusters(clumpPositions, 'sunflower');
      for (let c = 0; c < clumpPositions.length; c++) {
        const clumpX = clumpPositions[c].x;
        const clumpZ = clumpPositions[c].z;
        const clumpHeight = 1.7 + random() * 2.4;
        const stems = 1 + Math.floor(random() * 2);
        for (let stemIndex = 0; stemIndex < stems; stemIndex++) {
          const stemX = clumpX + (random() - 0.5) * 0.35;
          const stemZ = clumpZ + (random() - 0.5) * 0.35;
          const stemHeight = Math.min(4.45, clumpHeight * (0.84 + random() * 0.24));
          if (!sunflowerClusterRefs[c].stems) sunflowerClusterRefs[c].stems = [];
          sunflowerClusterRefs[c].stems.push({ x: stemX, z: stemZ, height: stemHeight });
          if (stemHeight > (sunflowerClusterRefs[c].height ?? 0)) {
            sunflowerClusterRefs[c].height = stemHeight;
            sunflowerClusterRefs[c].stemX = stemX;
            sunflowerClusterRefs[c].stemZ = stemZ;
          }
          const stem = new THREE.Mesh(
            new THREE.CylinderGeometry(0.06 + random() * 0.025, 0.09 + random() * 0.03, stemHeight, 8),
            sunflowerStemMat
          );
          stem.position.set(stemX, stemHeight / 2, stemZ);
          stem.rotation.z = (random() - 0.5) * 0.13;
          stem.rotation.x = (random() - 0.5) * 0.13;
          stem.castShadow = true;
          bedGroup.add(stem);

          const leafCount = 10 + Math.floor(random() * 5);
          for (let l = 0; l < leafCount; l++) {
            const angle = random() * TAU;
            const leafFraction = (l + 0.3 + random() * 0.35) / leafCount;
            const heightOnStem = 0.42 + (stemHeight - 0.55) * Math.min(1, leafFraction);
            const tip = new THREE.Vector3(
              Math.cos(angle) * (0.65 + random() * 0.35),
              0.1 + random() * 0.55,
              Math.sin(angle) * (0.65 + random() * 0.35)
            ).normalize();
            const base = new THREE.Vector3(
              stemX + Math.cos(angle) * 0.03,
              heightOnStem,
              stemZ + Math.sin(angle) * 0.03
            );
            leafDummy.position.copy(base);
            leafDummy.quaternion.setFromUnitVectors(leafUp, tip);
            leafDummy.rotateY(random() * TAU);
            const size = 0.55 + random() * 0.32;
            leafDummy.scale.set(size * (0.85 + random() * 0.35), size, size);
            leafDummy.updateMatrix();
            leafMatrices.push(leafDummy.matrix.clone());
          }
          // A few smaller leaves around the growing tip, leaving the stem tip bare.
          for (let topLeaf = 0; topLeaf < 3; topLeaf++) {
            const angle = random() * TAU;
            const tip = new THREE.Vector3(
              Math.cos(angle) * (0.38 + random() * 0.3),
              0.42 + random() * 0.3,
              Math.sin(angle) * (0.38 + random() * 0.3)
            ).normalize();
            leafDummy.position.set(stemX, stemHeight * (0.84 + random() * 0.08), stemZ);
            leafDummy.quaternion.setFromUnitVectors(leafUp, tip);
            leafDummy.rotateY(random() * TAU);
            const size = 0.34 + random() * 0.2;
            leafDummy.scale.set(size, size, size);
            leafDummy.updateMatrix();
            leafMatrices.push(leafDummy.matrix.clone());
          }
        }
      }
      addLeafInstances(bedGroup, sunflowerLeafGeo, sunflowerLeafMat, leafMatrices);
    }

    addSunflowerFoliageBed();

    // Dense rose vegetative clumps: small serrated pinnate leaves on gently
    // arching canes, with no buds or flowers.
    const roseLeafletShape = new THREE.Shape();
    const roseLeafSegments = 12;
    const roseHalf = [];
    for (let i = 0; i <= roseLeafSegments; i++) {
      const t = i / roseLeafSegments;
      const y = 0.02 + t * 0.3;
      let w = 0.075 * Math.pow(Math.sin(Math.PI * Math.min(1, t * 0.9 + 0.05)), 0.7);
      w *= i % 2 === 0 ? 1.1 : 0.9;
      roseHalf.push({ x: -w, y });
    }
    roseLeafletShape.moveTo(0, 0.01);
    for (const p of roseHalf) roseLeafletShape.lineTo(p.x, p.y);
    roseLeafletShape.lineTo(0, 0.34);
    for (let i = roseHalf.length - 1; i >= 0; i--) {
      roseLeafletShape.lineTo(-roseHalf[i].x, roseHalf[i].y);
    }
    roseLeafletShape.closePath();
    const roseLeafletGeo = new THREE.ShapeGeometry(roseLeafletShape, 1);
    const roseLeafShades = [0x3e6938, 0x4b7941, 0x59864c];
    const roseLeafMats = roseLeafShades.map((color) => new THREE.MeshStandardMaterial({
      color,
      roughness: 0.94,
      side: THREE.DoubleSide,
    }));
    const roseStemMat = new THREE.MeshStandardMaterial({ color: 0x3d582d, roughness: 0.94 });
    const roseStemGeo = new THREE.CylinderGeometry(1, 1, 1, 5);

    function addRoseFoliageClumps() {
      const group = new THREE.Group();
      group.position.y = 0.05;
      scene.add(group);
      const clumpPositions = [];
      const exclusions = [
        [-9.2, 12.3, 3.0],
        [11.8, 12.8, 3.0],
        [-13.8, -12.5, 1.7],
        [13.3, -13.2, 1.7],
        [-14.7, 8.9, 1.7],
        [14.2, 8.4, 1.7],
        [-10.8, -14.2, 1.9],
        [-12.5, -4.8, 2.0],
        [-13.1, 0.3, 2.1],
        [0, -12.8, 1.8],
      ];
      let attempts = 0;
      while (clumpPositions.length < 35 && attempts < 10000) {
        attempts++;
        const x = -15.4 + random() * 30.8;
        const z = -15.4 + random() * 30.8;
        if (Math.abs(x) < 2.2 || Math.abs(z) < 2.2) continue;
        if (Math.hypot(x, z) < 6.6) continue;
        let blocked = false;
        for (const [ex, ez, radius] of exclusions) {
          if (Math.hypot(x - ex, z - ez) < radius) { blocked = true; break; }
        }
        if (blocked) continue;
        for (const p of clumpPositions) {
          if (Math.hypot(x - p.x, z - p.z) < 1.05) { blocked = true; break; }
        }
        if (blocked) continue;
        for (const p of scatteredFoliagePositions) {
          if (Math.hypot(x - p.x, z - p.z) < 1.2) { blocked = true; break; }
        }
        if (!blocked) clumpPositions.push({ x, z });
      }

      const leafBuckets = roseLeafMats.map(() => []);
      const stemMatrices = [];
      const leafDummy = new THREE.Object3D();
      const stemDummy = new THREE.Object3D();
      const up = new THREE.Vector3(0, 1, 0);

      function addRoseStem(a, b, radius) {
        const direction = b.clone().sub(a);
        const length = direction.length();
        if (length < 0.001) return;
        stemDummy.position.copy(a).add(b).multiplyScalar(0.5);
        stemDummy.quaternion.setFromUnitVectors(up, direction.normalize());
        stemDummy.scale.set(radius, length, radius);
        stemDummy.updateMatrix();
        stemMatrices.push(stemDummy.matrix.clone());
      }

      function addRoseLeaflet(position, tipDirection, scale) {
        leafDummy.position.copy(position);
        leafDummy.quaternion.setFromUnitVectors(up, tipDirection.clone().normalize());
        leafDummy.rotateY(random() * TAU);
        const lengthScale = scale * (0.65 + random() * 0.55);
        const widthScale = scale * (0.7 + random() * 0.45);
        leafDummy.scale.set(widthScale, lengthScale, scale);
        leafDummy.updateMatrix();
        leafBuckets[Math.floor(random() * roseLeafMats.length)].push(leafDummy.matrix.clone());
      }

      for (const point of clumpPositions) {
        const caneCount = 7 + Math.floor(random() * 4);
        const clumpHeight = 0.8 + random() * 0.8;
        for (let c = 0; c < caneCount; c++) {
          const angle = (c / caneCount) * TAU + random() * 0.5;
          const reach = 0.3 + random() * 0.38;
          const rise = clumpHeight * (0.7 + random() * 0.5);
          const start = new THREE.Vector3(point.x + Math.cos(angle) * 0.04, 0.08, point.z + Math.sin(angle) * 0.04);
          const mid = new THREE.Vector3(
            point.x + Math.cos(angle) * reach * 0.55,
            0.12 + rise * 0.58,
            point.z + Math.sin(angle) * reach * 0.55
          );
          const tip = new THREE.Vector3(
            point.x + Math.cos(angle + (random() - 0.5) * 0.4) * reach,
            0.12 + rise,
            point.z + Math.sin(angle + (random() - 0.5) * 0.4) * reach
          );
          const curve = new THREE.QuadraticBezierCurve3(start, mid, tip);
          let previous = start.clone();
          for (let s = 1; s <= 5; s++) {
            const next = curve.getPoint(s / 5);
            addRoseStem(previous, next, s === 5 ? 0.006 : 0.011);
            previous = next;
          }

          const leafAt = [0.5, 0.72, 0.92];
          for (const t of leafAt) {
            const base = curve.getPoint(t);
            const leafAngle = angle + (random() - 0.5) * 1.3;
            const rachisLength = 0.23 + random() * 0.15;
            const direction = new THREE.Vector3(
              Math.cos(leafAngle) * (0.6 + random() * 0.35),
              0.18 + random() * 0.28,
              Math.sin(leafAngle) * (0.6 + random() * 0.35)
            ).normalize();
            const end = base.clone().addScaledVector(direction, rachisLength);
            addRoseStem(base, end, 0.004);
            const side = new THREE.Vector3(-Math.sin(leafAngle), 0, Math.cos(leafAngle)).normalize();
            for (let pair = 1; pair <= 3; pair++) {
              const p = base.clone().lerp(end, pair / 4);
              for (const sign of [-1, 1]) {
                const tipDir = side.clone().multiplyScalar(sign).add(new THREE.Vector3(0, 0.08, 0)).normalize();
                addRoseLeaflet(p.clone().addScaledVector(side, sign * 0.018), tipDir, 0.55 + random() * 0.25);
              }
            }
            addRoseLeaflet(end, direction.clone().add(new THREE.Vector3(0, 0.06, 0)).normalize(), 0.52 + random() * 0.22);
          }
        }
      }

      scatteredFoliagePositions.push(...clumpPositions);
      registerFlowerClusters(clumpPositions, 'rose');

      leafBuckets.forEach((matrices, index) => {
        if (!matrices.length) return;
        const leaves = new THREE.InstancedMesh(roseLeafletGeo, roseLeafMats[index], matrices.length);
        matrices.forEach((matrix, i) => leaves.setMatrixAt(i, matrix));
        leaves.instanceMatrix.needsUpdate = true;
        leaves.castShadow = true;
        leaves.receiveShadow = true;
        group.add(leaves);
      });
      const stems = new THREE.InstancedMesh(roseStemGeo, roseStemMat, stemMatrices.length);
      stemMatrices.forEach((matrix, i) => stems.setMatrixAt(i, matrix));
      stems.instanceMatrix.needsUpdate = true;
      stems.castShadow = true;
      group.add(stems);
    }

    addRoseFoliageClumps();

    // Airy jasmine foliage: opposite pairs of small rounded, fresh-green leaves
    // on fine arching stems. Vegetative only — no white flowers or buds.
    const jasmineLeafShape = new THREE.Shape();
    jasmineLeafShape.moveTo(0, 0);
    jasmineLeafShape.bezierCurveTo(-0.08, 0.04, -0.13, 0.16, 0, 0.31);
    jasmineLeafShape.bezierCurveTo(0.13, 0.16, 0.08, 0.04, 0, 0);
    const jasmineLeafGeo = new THREE.ShapeGeometry(jasmineLeafShape, 10);
    const jasmineLeafShades = [0x7caa63, 0x8dbb72, 0x6f9d59];
    const jasmineLeafMats = jasmineLeafShades.map((color) => new THREE.MeshStandardMaterial({
      color,
      roughness: 0.9,
      side: THREE.DoubleSide,
    }));
    const jasmineStemMat = new THREE.MeshStandardMaterial({ color: 0x6f9454, roughness: 0.92 });
    const jasmineStemGeo = new THREE.CylinderGeometry(1, 1, 1, 4);

    function addJasmineFoliageClumps() {
      const group = new THREE.Group();
      group.position.y = 0.05;
      scene.add(group);
      const clumpPositions = [];
      const exclusions = [
        [-9.2, 12.3, 2.8],
        [11.8, 12.8, 2.8],
        [-13.8, -12.5, 1.5],
        [13.3, -13.2, 1.5],
        [-14.7, 8.9, 1.5],
        [14.2, 8.4, 1.5],
        [-10.8, -14.2, 1.7],
        [-12.5, -4.8, 1.8],
        [-13.1, 0.3, 1.9],
        [0, -12.8, 1.7],
      ];
      let attempts = 0;
      while (clumpPositions.length < 35 && attempts < 12000) {
        attempts++;
        const x = -15.4 + random() * 30.8;
        const z = -15.4 + random() * 30.8;
        if (Math.abs(x) < 2.2 || Math.abs(z) < 2.2) continue;
        if (Math.hypot(x, z) < 6.6) continue;
        let blocked = false;
        for (const [ex, ez, radius] of exclusions) {
          if (Math.hypot(x - ex, z - ez) < radius) { blocked = true; break; }
        }
        if (blocked) continue;
        for (const p of clumpPositions) {
          if (Math.hypot(x - p.x, z - p.z) < 0.95) { blocked = true; break; }
        }
        if (blocked) continue;
        for (const p of scatteredFoliagePositions) {
          if (Math.hypot(x - p.x, z - p.z) < 1.05) { blocked = true; break; }
        }
        if (!blocked) clumpPositions.push({ x, z });
      }

      const leafBuckets = jasmineLeafMats.map(() => []);
      const stemMatrices = [];
      const leafDummy = new THREE.Object3D();
      const stemDummy = new THREE.Object3D();
      const up = new THREE.Vector3(0, 1, 0);

      function addJasmineStem(a, b, radius) {
        const direction = b.clone().sub(a);
        const length = direction.length();
        if (length < 0.001) return;
        stemDummy.position.copy(a).add(b).multiplyScalar(0.5);
        stemDummy.quaternion.setFromUnitVectors(up, direction.normalize());
        stemDummy.scale.set(radius, length, radius);
        stemDummy.updateMatrix();
        stemMatrices.push(stemDummy.matrix.clone());
      }

      function addJasmineLeaf(position, tipDirection, scale) {
        leafDummy.position.copy(position);
        leafDummy.quaternion.setFromUnitVectors(up, tipDirection.clone().normalize());
        leafDummy.rotateY(random() * TAU);
        const lengthScale = scale * (0.75 + random() * 0.3);
        const widthScale = scale * (0.8 + random() * 0.28);
        leafDummy.scale.set(widthScale, lengthScale, scale);
        leafDummy.updateMatrix();
        leafBuckets[Math.floor(random() * jasmineLeafMats.length)].push(leafDummy.matrix.clone());
      }

      for (const point of clumpPositions) {
        const caneCount = 6 + Math.floor(random() * 4);
        const clumpHeight = 0.45 + random() * 0.45;
        for (let c = 0; c < caneCount; c++) {
          const angle = (c / caneCount) * TAU + random() * 0.5;
          const reach = 0.3 + random() * 0.38;
          const height = clumpHeight * (0.75 + random() * 0.45);
          const start = new THREE.Vector3(point.x + Math.cos(angle) * 0.03, 0.06, point.z + Math.sin(angle) * 0.03);
          const mid = new THREE.Vector3(
            point.x + Math.cos(angle) * reach * 0.55,
            0.32 + height * 0.55,
            point.z + Math.sin(angle) * reach * 0.55
          );
          const tip = new THREE.Vector3(
            point.x + Math.cos(angle + (random() - 0.5) * 0.35) * reach,
            0.24 + height * 0.72,
            point.z + Math.sin(angle + (random() - 0.5) * 0.35) * reach
          );
          const curve = new THREE.QuadraticBezierCurve3(start, mid, tip);
          let previous = start.clone();
          for (let s = 1; s <= 5; s++) {
            const next = curve.getPoint(s / 5);
            addJasmineStem(previous, next, s === 5 ? 0.0035 : 0.007);
            previous = next;
          }

          for (const t of [0.35, 0.56, 0.76, 0.94]) {
            const base = curve.getPoint(t);
            const side = new THREE.Vector3(-Math.sin(angle), 0, Math.cos(angle)).normalize();
            for (const sign of [-1, 1]) {
              const outward = 0.45 + random() * 0.4;
              const tipDir = side.clone().multiplyScalar(sign * outward)
                .add(new THREE.Vector3(0, 0.05 + random() * 0.22, 0))
                .normalize();
              addJasmineLeaf(
                base.clone().addScaledVector(side, sign * 0.018),
                tipDir,
                0.72 + random() * 0.28
              );
            }
            if (random() > 0.45) {
              addJasmineLeaf(base.clone().add(new THREE.Vector3(0, 0.03, 0)), new THREE.Vector3(
                Math.cos(angle + (random() - 0.5) * 0.7),
                0.2 + random() * 0.3,
                Math.sin(angle + (random() - 0.5) * 0.7)
              ).normalize(), 0.6 + random() * 0.22);
            }
          }
        }
      }

      scatteredFoliagePositions.push(...clumpPositions);
      registerFlowerClusters(clumpPositions, 'jasmine');

      leafBuckets.forEach((matrices, index) => {
        if (!matrices.length) return;
        const leaves = new THREE.InstancedMesh(jasmineLeafGeo, jasmineLeafMats[index], matrices.length);
        matrices.forEach((matrix, i) => leaves.setMatrixAt(i, matrix));
        leaves.instanceMatrix.needsUpdate = true;
        leaves.castShadow = true;
        leaves.receiveShadow = true;
        group.add(leaves);
      });
      const stems = new THREE.InstancedMesh(jasmineStemGeo, jasmineStemMat, stemMatrices.length);
      stemMatrices.forEach((matrix, i) => stems.setMatrixAt(i, matrix));
      stems.instanceMatrix.needsUpdate = true;
      stems.castShadow = true;
      group.add(stems);
    }

    addJasmineFoliageClumps();

    // Low, dense lavender foliage planted in soft ribbons/bands.
    // Only grey-green linear leaves — no purple flower spikes.
    const lavenderLeafGeo = new THREE.ConeGeometry(0.012, 0.3, 3);
    lavenderLeafGeo.translate(0, 0.15, 0);
    const lavenderShades = [0x899b80, 0x96a88c, 0x798c70];
    const lavenderMats = lavenderShades.map((color) => new THREE.MeshStandardMaterial({
      color,
      roughness: 0.94,
      side: THREE.DoubleSide,
    }));

    function addLavenderBands() {
      const group = new THREE.Group();
      group.position.y = 0.05;
      scene.add(group);
      const clumpPositions = [];
      const exclusions = [
        [-9.2, 12.3, 2.8],
        [11.8, 12.8, 2.8],
        [-13.8, -12.5, 1.5],
        [13.3, -13.2, 1.5],
        [-14.7, 8.9, 1.5],
        [14.2, 8.4, 1.5],
        [-10.8, -14.2, 1.7],
        [-12.5, -4.8, 1.8],
        [-13.1, 0.3, 1.9],
        [0, -12.8, 1.7],
      ];
      const validPosition = (x, z) => {
        if (Math.abs(x) < 2.2 || Math.abs(z) < 2.2) return false;
        if (Math.hypot(x, z) < 6.6) return false;
        for (const [ex, ez, radius] of exclusions) {
          if (Math.hypot(x - ex, z - ez) < radius) return false;
        }
        return true;
      };

      let bandsMade = 0;
      let attempts = 0;
      while (bandsMade < 7 && attempts < 3000) {
        attempts++;
        const cx = -14.4 + random() * 28.8;
        const cz = -14.4 + random() * 28.8;
        const angle = random() * TAU;
        const length = 2.0 + random() * 1.4;
        const band = [];
        let valid = true;
        for (let i = 0; i < 9; i++) {
          const t = (i / 8) - 0.5;
          const x = cx + Math.cos(angle) * length * t + (random() - 0.5) * 0.22;
          const z = cz + Math.sin(angle) * length * t + (random() - 0.5) * 0.22;
          if (!validPosition(x, z)) { valid = false; break; }
          let tooClose = false;
          for (const p of clumpPositions) {
            if (Math.hypot(x - p.x, z - p.z) < 0.42) { tooClose = true; break; }
          }
          if (tooClose) { valid = false; break; }
          band.push({ x, z });
        }
        if (valid) {
          clumpPositions.push(...band);
          bandsMade++;
        }
      }
      while (clumpPositions.length < 63 && attempts < 9000) {
        attempts++;
        const x = -15.4 + random() * 30.8;
        const z = -15.4 + random() * 30.8;
        if (!validPosition(x, z)) continue;
        let tooClose = false;
        for (const p of clumpPositions) {
          if (Math.hypot(x - p.x, z - p.z) < 0.38) { tooClose = true; break; }
        }
        if (!tooClose) clumpPositions.push({ x, z });

      const buckets = lavenderMats.map(() => []);
      const dummy = new THREE.Object3D();
      for (const point of clumpPositions) {
        const clumpHeight = 0.34 + random() * 0.24;
        const clumpRadius = 0.13 + random() * 0.08;
        const leafCount = 68 + Math.floor(random() * 34);
        for (let i = 0; i < leafCount; i++) {
          const theta = random() * TAU;
          const radius = random() * clumpRadius;
          const baseY = 0.04 + random() * 0.09;
          const outward = 0.08 + random() * 0.2;
          const tipDir = new THREE.Vector3(
            Math.cos(theta) * outward,
            0.8 + random() * 0.25,
            Math.sin(theta) * outward

          dummy.scale.set(size, size * (0.8 + clumpHeight), size);

      scatteredFoliagePositions.push(...clumpPositions);

      buckets.forEach((matrices, index) => {

      });
    }

    addLavenderBands();

    // Airy marguerite foliage: many fine, feathery pale-green leaves on a
    // soft, rounded, spreading branch framework. No flower heads.
    const margueriteLeafPositions = [];

    );
    const margueriteLeafGeo = new THREE.BufferGeometry();

    const margueriteShades = [0x8eb679, 0x9cc687, 0x7fa56b];
    const margueriteMats = margueriteShades.map((color) => new THREE.MeshStandardMaterial({
      color,
      roughness: 0.9,

    const margueriteStemMat = new THREE.MeshStandardMaterial({ color: 0x7fa26a, roughness: 0.94 });
    const margueriteStemGeo = new THREE.CylinderGeometry(1, 1, 1, 4);

    function addMargueriteClumps() {
      const group = new THREE.Group();
      group.position.y = 0.05;
      scene.add(group);
      const clumpPositions = [];
      const exclusions = [
        [-9.2, 12.3, 2.8],
        [11.8, 12.8, 2.8],
        [-13.8, -12.5, 1.5],
        [13.3, -13.2, 1.5],
        [-14.7, 8.9, 1.5],
        [14.2, 8.4, 1.5],
        [-10.8, -14.2, 1.7],
        [-12.5, -4.8, 1.8],
        [-13.1, 0.3, 1.9],
        [0, -12.8, 1.7],
      ];
      let attempts = 0;
      while (clumpPositions.length < 24 && attempts < 12000) {
        attempts++;
        const x = -15.2 + random() * 30.4;
        const z = -15.2 + random() * 30.4;

        if (Math.hypot(x, z) < 6.6) continue;

        for (const [ex, ez, radius] of exclusions) {

        }
        if (blocked) continue;
        for (const p of clumpPositions) {

      const leafBuckets = margueriteMats.map(() => []);
      const stemMatrices = [];
      const dummy = new THREE.Object3D();

      function addFeatherLeaf(position, tipDirection, scale) {

              const tipDir = new THREE.Vector3(

                0.12 + random() * 0.45,

              addFeatherLeaf(base, tipDir, 0.7 + random() * 0.5);
            }
          }
        }
      }

      scatteredFoliagePositions.push(...clumpPositions);
      registerFlowerClusters(clumpPositions, 'marguerite');

      leafBuckets.forEach((matrices, index) => {
        if (!matrices.length) return;
        const leaves = new THREE.InstancedMesh(margueriteLeafGeo, margueriteMats[index], matrices.length);
        matrices.forEach((matrix, i) => leaves.setMatrixAt(i, matrix));
        leaves.instanceMatrix.needsUpdate = true;
        leaves.castShadow = true;
        leaves.receiveShadow = true;
        group.add(leaves);
      });
      const stems = new THREE.InstancedMesh(margueriteStemGeo, margueriteStemMat, stemMatrices.length);
      stemMatrices.forEach((matrix, i) => stems.setMatrixAt(i, matrix));
      stems.instanceMatrix.needsUpdate = true;
      stems.castShadow = true;
      group.add(stems);
    }

    addMargueriteClumps();

    // Hydrangea vegetative clumps: thick branching stems and large, broad,
    // shallow-toothed ovate leaves with visible veins. No flower balls.
    const hydrangeaCanvas = document.createElement('canvas');
    hydrangeaCanvas.width = 256;
    hydrangeaCanvas.height = 256;
    const hydrangeaCtx = hydrangeaCanvas.getContext('2d');
    const hydrangeaGradient = hydrangeaCtx.createLinearGradient(0, 0, 256, 256);
    hydrangeaGradient.addColorStop(0, '#789b5f');
    hydrangeaGradient.addColorStop(0.55, '#6b8e54');
    hydrangeaGradient.addColorStop(1, '#5d8149');
    hydrangeaCtx.fillStyle = hydrangeaGradient;
    hydrangeaCtx.fillRect(0, 0, 256, 256);
    hydrangeaCtx.strokeStyle = 'rgba(191, 215, 157, 0.85)';
    hydrangeaCtx.lineWidth = 2.6;
    hydrangeaCtx.beginPath();
    hydrangeaCtx.moveTo(128, 244);
    hydrangeaCtx.lineTo(128, 18);
    hydrangeaCtx.stroke();
    hydrangeaCtx.lineWidth = 1.4;
    for (let v = 0; v < 7; v++) {
      const y = 54 + v * 27;
      hydrangeaCtx.beginPath();
      hydrangeaCtx.moveTo(128, y + 10);
      hydrangeaCtx.quadraticCurveTo(82, y - 2, 36, y - 16 - v * 2);
      hydrangeaCtx.stroke();
      hydrangeaCtx.beginPath();
      hydrangeaCtx.moveTo(128, y + 10);
      hydrangeaCtx.quadraticCurveTo(174, y - 2, 220, y - 16 - v * 2);
      hydrangeaCtx.stroke();
    }
    const hydrangeaMap = new THREE.CanvasTexture(hydrangeaCanvas);
    hydrangeaMap.colorSpace = THREE.SRGBColorSpace;
    hydrangeaMap.wrapS = THREE.ClampToEdgeWrapping;
    hydrangeaMap.wrapT = THREE.ClampToEdgeWrapping;

    const hydrangeaLeafShape = new THREE.Shape();
    const hydrangeaHalf = [];
    for (let i = 0; i <= 24; i++) {
      const t = i / 24;
      const y = 0.02 + t * 1.2;
      let w = 0.5 * Math.pow(Math.sin(Math.PI * Math.min(1, t * 0.94 + 0.03)), 0.58);
      w *= i % 2 === 0 ? 1.035 : 0.965;
      hydrangeaHalf.push({ x: -w, y });
    }
    hydrangeaLeafShape.moveTo(0, 0.01);
    for (const p of hydrangeaHalf) hydrangeaLeafShape.lineTo(p.x, p.y);
    hydrangeaLeafShape.lineTo(0, 1.24);
    for (let i = hydrangeaHalf.length - 1; i >= 0; i--) {
      hydrangeaLeafShape.lineTo(-hydrangeaHalf[i].x, hydrangeaHalf[i].y);
    }
    hydrangeaLeafShape.closePath();
    const hydrangeaLeafGeo = new THREE.ShapeGeometry(hydrangeaLeafShape, 1);
    const hydrangeaUv = hydrangeaLeafGeo.attributes.uv;
    for (let i = 0; i < hydrangeaUv.count; i++) {

    hydrangeaUv.needsUpdate = true;
    const hydrangeaMatA = new THREE.MeshStandardMaterial({
      map: hydrangeaMap,

    const hydrangeaMatB = new THREE.MeshStandardMaterial({

      roughness: 0.88,
      side: THREE.DoubleSide,

    const hydrangeaMats = [hydrangeaMatA, hydrangeaMatB];
    const hydrangeaStemMat = new THREE.MeshStandardMaterial({ color: 0x526b3e, roughness: 0.92 });
    const hydrangeaStemGeo = new THREE.CylinderGeometry(1, 1, 1, 6);

    function addHydrangeaClumps() {
      const group = new THREE.Group();
      group.position.y = 0.05;

      const clumpPositions = hydrangeaClumpPositions.slice();

      function addHydrangeaStem(a, b, radius) {

        stemDummy.quaternion.setFromUnitVectors(up, direction.normalize());
        stemDummy.scale.set(radius, length, radius);

        stemMatrices.push(stemDummy.matrix.clone());

      function addHydrangeaLeaf(position, tipDirection, scale) {
        leafDummy.position.copy(position);
        leafDummy.quaternion.setFromUnitVectors(up, tipDirection.clone().normalize());
        leafDummy.rotateY(random() * TAU);
        const lengthScale = scale * (0.82 + random() * 0.3);
        const widthScale = scale * (0.85 + random() * 0.3);
        leafDummy.scale.set(widthScale, lengthScale, scale);
        leafDummy.updateMatrix();
        leafBuckets[Math.floor(random() * hydrangeaMats.length)].push(leafDummy.matrix.clone());
      }

      for (const point of clumpPositions) {
        const stemCount = 5 + Math.floor(random() * 3);
        const clumpHeight = 0.9 + random() * 0.45;
        for (let s = 0; s < stemCount; s++) {
          const angle = (s / stemCount) * TAU + random() * 0.6;
          const reach = 0.28 + random() * 0.28;
          const height = clumpHeight * (0.8 + random() * 0.35);
          const start = new THREE.Vector3(point.x + Math.cos(angle) * 0.04, 0.06, point.z + Math.sin(angle) * 0.04);
          const mid = new THREE.Vector3(
            point.x + Math.cos(angle) * reach * 0.55,
            0.12 + height * 0.6,
            point.z + Math.sin(angle) * reach * 0.55
          );
          const tip = new THREE.Vector3(
            point.x + Math.cos(angle + (random() - 0.5) * 0.25) * reach,

      stems.castShadow = true;
      group.add(stems);
    }

    addHydrangeaClumps();
    registerFlowerClusters(hydrangeaClumpPositions, 'hydrangea');

    // Upright false-dragonhead foliage: straight vertical stems with neat
    // opposite pairs of long lanceolate leaves. No flower spikes.
    const lanceolateLeafShape = new THREE.Shape();
    lanceolateLeafShape.moveTo(0, 0);
    lanceolateLeafShape.bezierCurveTo(-0.05, 0.08, -0.08, 0.25, 0, 0.52);
    lanceolateLeafShape.bezierCurveTo(0.08, 0.25, 0.05, 0.08, 0, 0);
    const lanceolateLeafGeo = new THREE.ShapeGeometry(lanceolateLeafShape, 10);
    const lanceolateLeafMats = [0x4f7b43, 0x5d8a50, 0x6d965d].map((color) => (

    console.log(`[Flowers] ${flowerClusters.length} clusters, ${coverageAdded} coverage seeds added.`);


    function getFlowerMaterial(color) {
      if (!flowerMatCache.has(color)) {
        flowerMatCache.set(color, new THREE.MeshStandardMaterial({
          color, roughness: 0.78, side: THREE.DoubleSide,
        }));
      }
      return flowerMatCache.get(color);
    }
    function getFlowerCenterMaterial(color) {
      if (!flowerCenterCache.has(color)) {
        flowerCenterCache.set(color, new THREE.MeshStandardMaterial({ color, roughness: 0.7 }));
      }
      return flowerCenterCache.get(color);
    }

    function makeFlowerHead(type, heightOverride = null) {
      const style = FLOWER_STYLES[type] ?? FLOWER_STYLES.daisy;
      const group = new THREE.Group();
      const h = heightOverride ?? style.height;
      const stem = new THREE.Mesh(flowerStemGeo, flowerStemMat);
      stem.scale.y = Math.max(0.08, h);
      stem.position.y = h * 0.5;
      stem.castShadow = true;
      group.add(stem);
      const petalMat = getFlowerMaterial(style.color);
      if (style.bells) {
        for (let i = 0; i < 4; i++) {
          const leaf = new THREE.Mesh(flowerPetalGeo, flowerStemMat);
          const angle = (i / 4) * TAU + 0.3;
          leaf.position.set(Math.cos(angle) * 0.2, 0.08, Math.sin(angle) * 0.2);
          leaf.scale.set(0.2, 0.035, 0.34);
          leaf.rotation.y = -angle;
          group.add(leaf);
        }
        for (let i = 0; i < 8; i++) {
          const bell = new THREE.Mesh(
            new THREE.ConeGeometry(0.075, 0.17, 6, 1, true),
            petalMat
          );
          const side = i % 2 === 0 ? 1 : -1;
          bell.position.set(side * 0.09, h + i * 0.11, 0.03);
          bell.scale.setScalar(0.9 + (7 - i) * 0.035);
          bell.castShadow = true;
          group.add(bell);
        }
      } else if (style.spike) {
        for (let i = 0; i < 7; i++) {
          const bead = new THREE.Mesh(flowerPetalGeo, petalMat);
          const t = i / 6;
          bead.scale.setScalar((0.07 + 0.05 * (1 - t)) * (0.9 + random() * 0.2));
          bead.position.set((random() - 0.5) * 0.11, h + t * 0.32, (random() - 0.5) * 0.11);
          bead.castShadow = true;
          group.add(bead);
        }
      } else if (style.cluster) {
        for (let i = 0; i < 13; i++) {
          const bead = new THREE.Mesh(flowerPetalGeo, petalMat);
          const angle = random() * TAU;
          const radius = random() * (style.radius || 0.2);
          bead.scale.setScalar(0.15 + random() * 0.1);
          bead.position.set(Math.cos(angle) * radius, h + (random() - 0.5) * 0.16, Math.sin(angle) * radius);
          bead.castShadow = true;
          group.add(bead);
        }
      } else {
        const petals = style.petals || 8;
        const radius = style.radius || 0.18;
        const flowerFold = THREE.MathUtils.degToRad(10 + random() * 20);
        for (let i = 0; i < petals; i++) {
          const angle = (i / petals) * TAU + random() * 0.08;
          const petal = new THREE.Mesh(flowerPetalGeo, petalMat);
          petal.position.set(Math.cos(angle) * radius, h + 0.035, Math.sin(angle) * radius);
          petal.scale.set(radius * 0.75, radius * 0.15, radius * 0.36);
          petal.rotation.y = -angle;
          const petalFold = THREE.MathUtils.clamp(
            flowerFold + THREE.MathUtils.degToRad((random() - 0.5) * 8),
            THREE.MathUtils.degToRad(10),
            THREE.MathUtils.degToRad(30)
          );
          petal.rotateZ(petalFold);
          petal.castShadow = true;
          group.add(petal);
          const inner = petal.clone();
          inner.position.multiplyScalar(0.55);
          inner.position.y = h + 0.075;
          inner.scale.multiplyScalar(0.62);
          group.add(inner);
        }
        const center = new THREE.Mesh(
          flowerCenterGeo,
          getFlowerCenterMaterial(style.center ?? 0xe2c24d)
        );
        center.position.y = h + 0.085;
        center.scale.set(radius * 0.5, radius * 0.22, radius * 0.5);
        group.add(center);
        if (style.long) {
          for (let i = 0; i < 5; i++) {
            const stamen = new THREE.Mesh(
              new THREE.CylinderGeometry(0.007, 0.004, 0.25, 4),
              getFlowerCenterMaterial(0xd8b55d)
            );
            const angle = (i / 5) * TAU;
            stamen.position.set(Math.cos(angle) * 0.12, h - 0.05, Math.sin(angle) * 0.12);
            stamen.rotation.z = Math.cos(angle) * 0.7;
            stamen.rotation.x = Math.sin(angle) * 0.7;
            group.add(stamen);
          }
        }
      }
      group.rotation.y = random() * TAU;
      return group;
    }

    const bloomPlacements = [];
    window.__bloomPlacements = bloomPlacements;

    function findBloomPlacement(cluster, style, headIndex) {
      const baseHeight = cluster.height ?? style.height;
      const radius = Math.max(0.13, (style.radius ?? 0.18) * (style.spike ? 0.55 : 1.0));
      const sunflowerStems = cluster.type === 'sunflower' ? (cluster.stems ?? []) : [];
      if (sunflowerStems.length) sunflowerStems.sort((a, b) => b.height - a.height);
      for (let attempt = 0; attempt < 14; attempt++) {
        let x;
        let z;
        let height;
        if (sunflowerStems[headIndex]) {
          const stem = sunflowerStems[headIndex];
          x = stem.x;
          z = stem.z;
          height = stem.height;
        } else {
          const angle = random() * TAU;
          const spread = headIndex === 0 ? 0.08 : radius * 1.8 + random() * 0.25;
          x = cluster.x + Math.cos(angle) * spread;
          z = cluster.z + Math.sin(angle) * spread;
          height = baseHeight + (cluster.heightOffset ?? 0)
            + (headIndex === 0 ? 0 : radius * 0.95 + 0.16)
            + attempt * 0.14;
        }
        let collides = false;
        for (const other of bloomPlacements) {
          const horizontal = Math.hypot(x - other.x, z - other.z);
          const vertical = Math.abs(height - other.height);
          if (horizontal < (radius + other.radius) * 1.02
            && vertical < (radius + other.radius) * 0.85) {
            collides = true;
            break;
          }
        }
        if (!collides) {
          bloomPlacements.push({ x, z, height, radius });
          return { x, z, height };
        }
      }
      // Guaranteed second-bloom fallback: lift this head above any nearby
      // blossoms so there is still no intersection.
      const fallbackAngle = random() * TAU;
      const fallbackX = cluster.x + Math.cos(fallbackAngle) * radius * 2.2;
      const fallbackZ = cluster.z + Math.sin(fallbackAngle) * radius * 2.2;
      let fallbackHeight = baseHeight + radius * 1.8 + 0.35;
      for (const other of bloomPlacements) {
        if (Math.hypot(fallbackX - other.x, fallbackZ - other.z) < (radius + other.radius) * 1.15) {
          fallbackHeight = Math.max(fallbackHeight, other.height + other.radius + radius * 1.15);
        }
      }
      bloomPlacements.push({ x: fallbackX, z: fallbackZ, height: fallbackHeight, radius });
      return { x: fallbackX, z: fallbackZ, height: fallbackHeight };
    }

    function bloomCluster(cluster) {
      if (cluster.bloomed || bloomCount >= MAX_BLOOMS) return;
      if (!isGrassForWatering(cluster.x, cluster.z)) return;
      cluster.bloomed = true;
      const style = FLOWER_STYLES[cluster.type] ?? FLOWER_STYLES.daisy;
      // Twice as many blossoms per clump. Sunflowers use the tallest actual
      // stem height so their heads sit at the top of the stalk.
      for (let head = 0; head < 2; head++) {
        if (bloomCount >= MAX_BLOOMS) break;
        bloomCount++;
        const placement = findBloomPlacement(cluster, style, head);
        if (!placement) continue;
        const group = makeFlowerHead(cluster.type, placement.height);
        group.position.set(placement.x, 0, placement.z);
        const scale = (0.8 + random() * 0.28) * (head === 0 ? 1 : 0.92);
        group.scale.setScalar(0.02);
        group.userData.bloomScale = scale;
        group.userData.flowerType = cluster.type;
        group.userData.flowerHeight = placement.height;
        scene.add(group);
        bloomAnimations.push({ group, age: 0 });
      }
    }

    window.__bloomFlowerCluster = bloomCluster;

    function bloomNearbyClusters(x, z, radius = 3.8) {
      let made = 0;
      const candidates = [];
      for (const cluster of flowerClusters) {
        if (cluster.bloomed) continue;
        const distance = Math.hypot(cluster.x - x, cluster.z - z);
        if (distance < radius) candidates.push({ cluster, distance });
      }
      candidates.sort((a, b) => {
        const priority = (item) => item.cluster.type === 'hydrangea' ? -100 : 0;
        return (priority(a) + a.distance) - (priority(b) + b.distance);
      });
      for (const item of candidates) {
        if (made >= 2 || bloomCount >= MAX_BLOOMS) break;
        bloomCluster(item.cluster);
        made++;
      }
    }

    // Falling water drops from the can spout.
    const flowCount = 960;
    const flowPositions = new Float32Array(flowCount * 3);
    const flowVelocities = new Float32Array(flowCount * 3);
    const flowLife = new Float32Array(flowCount);
    for (let i = 0; i < flowCount; i++) flowPositions[i * 3 + 1] = -999;
    const flowGeometry = new THREE.BufferGeometry();
    flowGeometry.setAttribute('position', new THREE.BufferAttribute(flowPositions, 3));
    const dropCanvas = document.createElement('canvas');
    dropCanvas.width = 64;
    dropCanvas.height = 64;
    const dropCtx = dropCanvas.getContext('2d');
    const dropGradient = dropCtx.createRadialGradient(32, 26, 2, 32, 32, 28);
    dropGradient.addColorStop(0, 'rgba(236,255,253,1)');
    dropGradient.addColorStop(0.34, 'rgba(170,224,221,0.95)');
    dropGradient.addColorStop(0.75, 'rgba(108,184,184,0.55)');
    dropGradient.addColorStop(1, 'rgba(75,142,146,0)');
    dropCtx.fillStyle = dropGradient;
    dropCtx.beginPath();
    dropCtx.ellipse(32, 30, 13, 22, 0, 0, TAU);
    dropCtx.fill();
    const dropTexture = new THREE.CanvasTexture(dropCanvas);
    dropTexture.colorSpace = THREE.SRGBColorSpace;
    const flowMaterial = new THREE.PointsMaterial({
      color: 0xa8e1dd,
      map: dropTexture,
      size: 0.135,
      transparent: true,
      opacity: 0.9,
      depthWrite: false,
      blending: THREE.NormalBlending,
      alphaTest: 0.02,
      sizeAttenuation: true,
    });
    const waterFlow = new THREE.Points(flowGeometry, flowMaterial);
    waterFlow.frustumCulled = false;
    waterFlow.renderOrder = 5;
    scene.add(waterFlow);
    window.__waterFlow = waterFlow;
    window.__waterFlowLife = flowLife;
    let flowCursor = 0;
    let flowActive = false;
    let bloomTimer = 0;
    const recentLandings = [];
    const waterBloomSites = [];
    const MAX_WATER_FLOWERS = 60;
    window.__waterBloomSites = waterBloomSites;
    const spoutPosition = new THREE.Vector3();
    const spoutDirection = new THREE.Vector3();

    function isGrassForWatering(x, z) {
      if (Math.abs(x) > 15.5 || Math.abs(z) > 15.5) return false;
      if (Math.abs(x) < 1.95 || Math.abs(z) < 1.95) return false;
      if (Math.hypot(x, z) < 6.5) return false;
      return true;
    }

    const flowRight = new THREE.Vector3();
    const flowUp = new THREE.Vector3();
    const flowDirection = new THREE.Vector3();
    const flowWorldUp = new THREE.Vector3(0, 1, 0);

    function emitWater(dt) {
      if (!audience.userData.getWateringSpout?.(spoutPosition, spoutDirection)) return;
      const drops = Math.min(44, Math.max(1, Math.round(dt * 480)));
      flowRight.crossVectors(spoutDirection, flowWorldUp);
      if (flowRight.lengthSq() < 0.0001) flowRight.set(1, 0, 0);
      flowRight.normalize();
      flowUp.crossVectors(flowRight, spoutDirection).normalize();
      const coneHalfAngle = 0.34;
      const coneSpread = Math.tan(coneHalfAngle);
      for (let n = 0; n < drops; n++) {
        const i = flowCursor;
        flowCursor = (flowCursor + 1) % flowCount;
        const idx = i * 3;
        flowPositions[idx] = spoutPosition.x + (random() - 0.5) * 0.07;
        flowPositions[idx + 1] = spoutPosition.y + (random() - 0.5) * 0.07;
        flowPositions[idx + 2] = spoutPosition.z + (random() - 0.5) * 0.07;
        const theta = random() * TAU;
        const radial = Math.sqrt(random()) * coneSpread;
        flowDirection.copy(spoutDirection)
          .addScaledVector(flowRight, Math.cos(theta) * radial)
          .addScaledVector(flowUp, Math.sin(theta) * radial)
          .normalize();
        const speed = 2.7 + random() * 2.3;
        flowVelocities[idx] = flowDirection.x * speed;
        flowVelocities[idx + 1] = flowDirection.y * speed;
        flowVelocities[idx + 2] = flowDirection.z * speed;
        flowLife[i] = 1.05 + random() * 0.8;
      }
      flowGeometry.attributes.position.needsUpdate = true;
    }

    function nearestFlowerType(x, z) {
      let nearest = null;
      let nearestDistance = Infinity;
      for (const cluster of flowerClusters) {
        const distance = Math.hypot(cluster.x - x, cluster.z - z);
        if (distance < nearestDistance) {
          nearestDistance = distance;
          nearest = cluster;
        }
      }
      return nearest?.type ?? 'daisy';
    }

    function createWaterBloom(x, z) {
      if (waterBloomSites.length >= MAX_WATER_FLOWERS) return;
      if (!isGrassForWatering(x, z)) return;
      for (const site of waterBloomSites) {
        if (Math.hypot(site.x - x, site.z - z) < 0.72) return;
      }
      const type = nearestFlowerType(x, z);
      const site = {
        x, z, type, bloomed: false,
        heightOffset: (random() - 0.5) * 0.4,
        coverage: true,
      };
      waterBloomSites.push(site);
      bloomCluster(site);
    }

    function updateWaterAndBloom(delta, active) {
      flowActive = active;
      if (active) emitWater(delta);
      for (let i = 0; i < flowCount; i++) {
        if (flowLife[i] <= 0) continue;
        const idx = i * 3;
        flowLife[i] -= delta;
        if (flowPositions[idx + 1] < 0.04 && flowLife[i] > 0 && active && random() < 0.045) {
          recentLandings.push({ x: flowPositions[idx], z: flowPositions[idx + 2] });
          if (recentLandings.length > 32) recentLandings.shift();
        }
        if (flowLife[i] <= 0 || flowPositions[idx + 1] < 0.04) {
          flowPositions[idx + 1] = -999;
          flowLife[i] = 0;
          continue;
        }
        flowVelocities[idx + 1] -= 8.4 * delta;
        flowPositions[idx] += flowVelocities[idx] * delta;
        flowPositions[idx + 1] += flowVelocities[idx + 1] * delta;
        flowPositions[idx + 2] += flowVelocities[idx + 2] * delta;
      }
      flowGeometry.attributes.position.needsUpdate = true;
      waterFlow.visible = active || flowLife.some((life) => life > 0);
      for (let i = bloomAnimations.length - 1; i >= 0; i--) {
        const item = bloomAnimations[i];
        item.age += delta;
        const t = Math.min(1, item.age / 0.45);
        const eased = 1 - Math.pow(1 - t, 3);
        item.group.scale.setScalar(Math.max(0.02, item.group.userData.bloomScale * eased));
        if (t >= 1) bloomAnimations.splice(i, 1);
      }
      if (active) {
        const sprayX = spoutPosition.x;
        const sprayZ = spoutPosition.z;
        bloomTimer += delta;
        if (bloomTimer > 0.2) {
          bloomTimer = 0;
          const landing = recentLandings.shift();
          bloomNearbyClusters(sprayX, sprayZ, 4.6);
          if (landing) {
            bloomNearbyClusters(landing.x, landing.z, 1.8);
            createWaterBloom(landing.x, landing.z);
          }
        }
      }
    }

    // ---------------------------------------------------------------------
    // Butterflies arrive when 60% of the four lawns are in bloom
    // ---------------------------------------------------------------------
    const BUTTERFLY_COLORS = [0xff9a3c, 0x5b9bd5, 0xf4d35e, 0xe86a92, 0x9b7ede, 0x4ecdc4, 0xff6b6b, 0x87c95a];
    const butterflyWingShape = new THREE.Shape();
    butterflyWingShape.moveTo(0, 0);
    butterflyWingShape.bezierCurveTo(0.08, 0.55, 0.55, 0.66, 0.79, 0.31);
    butterflyWingShape.bezierCurveTo(0.92, 0.08, 0.68, -0.3, 0.33, -0.43);
    butterflyWingShape.bezierCurveTo(0.16, -0.45, 0.035, -0.22, 0, 0);
    const butterflyWingGeo = new THREE.ShapeGeometry(butterflyWingShape, 10);
    const butterflyBodyGeo = new THREE.CylinderGeometry(0.035, 0.018, 0.55, 6);
    const butterflyHeadGeo = new THREE.SphereGeometry(0.045, 7, 5);
    const butterflySpotGeo = new THREE.CircleGeometry(0.07, 10);
    const butterflyBodyMat = new THREE.MeshStandardMaterial({ color: 0x2c211d, roughness: 0.72 });
    const butterflySpotMat = new THREE.MeshBasicMaterial({
      color: 0xfff1cf, side: THREE.DoubleSide, transparent: true, opacity: 0.72, depthWrite: false,
    });
    const butterflyWingMats = BUTTERFLY_COLORS.map((color) => new THREE.MeshStandardMaterial({
      color, roughness: 0.58, metalness: 0.02, side: THREE.DoubleSide,
    }));
    const butterflies = [];
    let butterflySpawned = false;
    let butterflyProgressTimer = 0;
    let butterflyProgress = 0;
    let butterflyTemplates = null;
    let butterflyLoadPromise = null;
    let butterflyLoading = false;
    let butterflyLawnTargets = [];
    let butterflyActiveLawns = [];
    let initialLandingComplete = false;
    let lastRelocationAt = 0;
    const occupiedButterflyFlowers = new Set();
    const BUTTERFLY_MODEL_URLS = [
      './yellowbutterfly.glb',
      './purplebutterfly.glb',
      './pinkbutterfly.glb',
      './greenbutterfly.glb',
      './bluebutterfly.glb',
    ];
    // Tree canopies and the fountain are treated as circular keep-out zones
    // for every butterfly flight phase.
    const butterflyObstacles = [
      ...treeColliders.map(([x, z, radius]) => ({ x, z, radius: radius + 2.8 })),
      { x: 0, z: 0, radius: 4.3 },
    ];

    function keepButterflyClear(position, butterfly) {
      // Lift the flight path above flower heads. The target flower itself is
      // exempt so the butterfly can descend onto it.
      for (const flower of flightFlowerObstacles) {
        if (butterfly && flower.group === butterfly.targetGroup) continue;
        const dx = position.x - flower.x;
        const dz = position.z - flower.z;
        if (Math.hypot(dx, dz) > 0.98) continue;
        if (Math.abs(position.y - flower.y) > 0.95) continue;
        position.y = Math.max(position.y, flower.y + 0.95);
      }
      for (let pass = 0; pass < 2; pass++) {
        for (const obstacle of butterflyObstacles) {
          const dx = position.x - obstacle.x;
          const dz = position.z - obstacle.z;
          const distance = Math.hypot(dx, dz);
          if (distance >= obstacle.radius) continue;
          if (distance < 0.0001) {
            position.x = obstacle.x + obstacle.radius;
            position.z = obstacle.z;
          } else {
            const push = obstacle.radius / distance;
            position.x = obstacle.x + dx * push;
            position.z = obstacle.z + dz * push;
          }
        }
      }
      return position;
    }

    function isClearButterflyLanding(x, z) {
      return butterflyObstacles.every((obstacle) =>
        Math.hypot(x - obstacle.x, z - obstacle.z) > obstacle.radius + 0.35
      );
    }

    let flightFlowerObstacles = [];
    let lastFlowerScan = -Infinity;

    function refreshFlightFlowerObstacles() {
      const list = [];
      scene.traverse((object) => {
        if (!object.userData || object.userData.flowerHeight === undefined) return;
        if (!object.visible) return;
        list.push({
          group: object,
          x: object.position.x,
          z: object.position.z,
          y: object.userData.flowerHeight,
        });
      });
      flightFlowerObstacles = list;
    }

    function addButterflyFlapShader(material, uniforms) {
      material.onBeforeCompile = (shader) => {
        shader.uniforms.uFlap = uniforms.uFlap;
        shader.vertexShader = shader.vertexShader
          .replace('#include <common>', '#include <common>\nuniform float uFlap;')
          .replace('#include <begin_vertex>', `#include <begin_vertex>
            float wingSide = position.x < 0.0 ? -1.0 : 1.0;
            float wingWeight = smoothstep(0.035, 0.34, abs(position.x));
            float wingAngle = clamp(-uFlap * wingSide, -1.309, 1.309);
            float wc = cos(wingAngle);
            float ws = sin(wingAngle);
            vec2 wingPos = vec2(wc * position.x - ws * position.y, ws * position.x + wc * position.y);
            transformed.xy = mix(transformed.xy, wingPos, wingWeight);
          `);
      };
      material.customProgramCacheKey = () => 'butterfly-glb-flap';
      material.needsUpdate = true;
    }

    function loadButterflyTemplates() {
      if (butterflyLoadPromise) return butterflyLoadPromise;
      butterflyLoadPromise = (async () => {
        const loader = new GLTFLoader();
        const templates = [];
        for (const url of BUTTERFLY_MODEL_URLS) {
          console.log(`[Butterflies] Loading model: ${url}`);
          const gltf = await new Promise((resolve, reject) => loader.load(url, resolve, undefined, reject));
          const model = gltf.scene;
          model.updateMatrixWorld(true);
          const bounds = new THREE.Box3().setFromObject(model);
          const center = new THREE.Vector3();
          const size = new THREE.Vector3();
          bounds.getCenter(center);
          bounds.getSize(size);
          model.position.sub(center);
          const holder = new THREE.Group();
          holder.add(model);
          holder.scale.setScalar(0.92 / Math.max(0.001, size.x));
          holder.rotation.x = Math.PI / 2;
          templates.push(holder);
        }
        console.log('[Butterflies] Five GLB models loaded.');
        return templates;
      })();
      return butterflyLoadPromise;
    }

    function makeButterflyFromGLB(template, phase) {
      const group = new THREE.Group();
      const model = template.clone(true);
      const materials = [];
      model.traverse((object) => {
        if (!object.isMesh) return;
        object.castShadow = false;
        object.receiveShadow = false;
        object.frustumCulled = false;
        const sourceMaterials = Array.isArray(object.material) ? object.material : [object.material];
        const cloned = sourceMaterials.map((source) => {
          const material = source.clone();
          material.side = THREE.DoubleSide;
          const uniforms = { uFlap: { value: 0 } };
          addButterflyFlapShader(material, uniforms);
          material.userData.flapUniform = uniforms.uFlap;
          materials.push(material);
          return material;
        });
        object.material = Array.isArray(object.material) ? cloned : cloned[0];
      });
      group.add(model);
      // The current model size is the maximum; each butterfly is randomly
      // scaled down to no less than 60% of that maximum.
      group.scale.setScalar(0.6 + random() * 0.4);
      group.updateMatrixWorld(true);
      const bounds = new THREE.Box3().setFromObject(group);
      const halfSpan = (bounds.max.x - bounds.min.x) * 0.5;
      const landingClearance = Math.max(0.68, halfSpan * 0.92 + 0.2);
      group.userData.phase = phase;
      return { group, materials, landingClearance };
    }

    function makeButterfly(colorIndex, phase) {
      const group = new THREE.Group();
      const body = new THREE.Mesh(butterflyBodyGeo, butterflyBodyMat);
      body.rotation.x = Math.PI / 2;
      body.castShadow = true;
      group.add(body);
      const head = new THREE.Mesh(butterflyHeadGeo, butterflyBodyMat);
      head.position.z = 0.28;
      group.add(head);
      const material = butterflyWingMats[colorIndex % butterflyWingMats.length];
      const leftPivot = new THREE.Group();
      const rightPivot = new THREE.Group();
      leftPivot.scale.x = -1;
      const rightWing = new THREE.Mesh(butterflyWingGeo, material);
      rightWing.rotation.x = -Math.PI / 2;
      rightWing.castShadow = true;
      rightWing.position.y = 0.02;
      rightPivot.add(rightWing);
      const leftWing = rightWing.clone();
      leftPivot.add(leftWing);
      for (const [pivot, sign] of [[leftPivot, -1], [rightPivot, 1]]) {
        const inner = new THREE.Mesh(butterflyWingGeo, butterflySpotMat);
        inner.rotation.x = -Math.PI / 2;
        inner.position.set(sign * 0.3, 0.035, -0.02);
        inner.scale.set(0.5, 0.5, 0.5);
        pivot.add(inner);
        const spot = new THREE.Mesh(butterflySpotGeo, butterflySpotMat);
        spot.rotation.x = -Math.PI / 2;
        spot.position.set(sign * 0.47, 0.04, 0.1);
        spot.scale.setScalar(0.8);
        pivot.add(spot);
      }
      group.add(leftPivot, rightPivot);
      const antennaGeo = new THREE.CylinderGeometry(0.004, 0.004, 0.24, 4);
      for (const sign of [-1, 1]) {
        const antenna = new THREE.Mesh(antennaGeo, butterflyBodyMat);
        antenna.position.set(sign * 0.035, 0.03, 0.4);
        antenna.rotation.z = sign * 0.55;
        antenna.rotation.x = -0.25;
        group.add(antenna);
      }
      group.scale.setScalar(0.62 + random() * 0.22);
      group.userData.phase = phase;
      return { group, leftPivot, rightPivot };
    }

    function isInFourLawns(x, z) {
      return flowerLawns.some((lawn) => Math.abs(x - lawn.x) <= 3 && Math.abs(z - lawn.z) <= 2.2);
    }

    async function spawnButterflies() {
      if (butterflySpawned || butterflyLoading) return;
      butterflyLoading = true;
      try {
        butterflyTemplates = butterflyTemplates || await loadButterflyTemplates();
        if (butterflySpawned) return;
        butterflySpawned = true;
        const lawnTargets = flowerLawns.map(() => []);
        scene.traverse((object) => {
          if (!object.userData || object.userData.flowerHeight === undefined) return;
          const lawnIndex = flowerLawns.findIndex((lawn) =>
            Math.abs(object.position.x - lawn.x) <= 3
            && Math.abs(object.position.z - lawn.z) <= 2.2
          );
          if (lawnIndex < 0) return;
          if (!isClearButterflyLanding(object.position.x, object.position.z)) return;
          object.userData.butterflyLawnIndex = lawnIndex;
          lawnTargets[lawnIndex].push(object);
        });
        for (const list of lawnTargets) {
          for (let i = list.length - 1; i > 0; i--) {
            const j = Math.floor(random() * (i + 1));
            [list[i], list[j]] = [list[j], list[i]];
          }
        }
        // Keep a complete per-lawn target list for later relocations.
        butterflyLawnTargets = lawnTargets.map((list) => list.slice());
        butterflyActiveLawns = lawnTargets.map((list, index) => list.length ? index : -1).filter((index) => index >= 0);
        const totalTargets = lawnTargets.reduce((sum, list) => sum + list.length, 0);
        const limit = Math.min(28, totalTargets);
        const perLawnCounts = lawnTargets.map(() => 0);
        let remaining = limit;
        while (remaining > 0) {
          for (const index of butterflyActiveLawns) {
            if (remaining <= 0) break;
            if (perLawnCounts[index] < lawnTargets[index].length) {
              perLawnCounts[index]++;
              remaining--;
            }
          }
        }
        // Pick evenly spaced flowers around each lawn so the butterflies do
        // not cluster on one side of a flowerbed.
        const targets = [];
        for (const index of butterflyActiveLawns) {
          const lawn = flowerLawns[index];
          const sorted = lawnTargets[index].slice().sort((a, b) =>
            Math.atan2(a.position.z - lawn.z, a.position.x - lawn.x)
            - Math.atan2(b.position.z - lawn.z, b.position.x - lawn.x)
          );
          const amount = perLawnCounts[index];
          if (!amount) continue;
          for (let k = 0; k < amount; k++) {
            const position = Math.floor((k + 0.5) * sorted.length / amount);
            targets.push(sorted[Math.min(sorted.length - 1, position)]);
          }
        }
        for (let i = targets.length - 1; i > 0; i--) {
          const j = Math.floor(random() * (i + 1));
          [targets[i], targets[j]] = [targets[j], targets[i]];
        }
        const count = Math.min(28, targets.length);
        const flockAngle = random() * TAU;
        const flockCenter = new THREE.Vector3(
          (random() - 0.5) * 5,
          14 + random() * 2,
          17 + random() * 4
        );
        for (let i = 0; i < count; i++) {
          const targetGroup = targets[i];
          const target = new THREE.Vector3(
            targetGroup.position.x + (random() - 0.5) * 0.18,
            targetGroup.userData.flowerHeight + 0.16,
            targetGroup.position.z + (random() - 0.5) * 0.18
          );
          const start = flockCenter.clone().add(new THREE.Vector3(
            (random() - 0.5) * 4.5,
            (random() - 0.5) * 2.0,
            (random() - 0.5) * 3.5
          ));
          const entryAngle = flockAngle + (random() - 0.5) * 0.85;
          const circleRadius = 11.5 + random() * 2.8;
          const circleHeight = 4.5 + random() * 3.2;
          const entryPoint = new THREE.Vector3(
            Math.cos(entryAngle) * circleRadius,
            circleHeight,
            Math.sin(entryAngle) * circleRadius
          );
          const entryControl1 = start.clone().add(new THREE.Vector3(
            (random() - 0.5) * 4, -2 - random() * 3, (random() - 0.5) * 4
          ));
          const entryControl2 = entryPoint.clone().add(new THREE.Vector3(
            (random() - 0.5) * 3, 2.5 + random() * 2.5, (random() - 0.5) * 3
          ));
          const template = butterflyTemplates[i % butterflyTemplates.length];
          const butterfly = makeButterflyFromGLB(template, random() * TAU);
          target.y = targetGroup.userData.flowerHeight + butterfly.landingClearance;
          butterfly.group.position.copy(start);
          butterfly.entryCurve = new THREE.CubicBezierCurve3(start, entryControl1, entryControl2, entryPoint);
          butterfly.entryPoint = entryPoint;
          butterfly.entryDelay = random() * 0.55;
          butterfly.entryDuration = (2.15 + random() * 0.55) / 0.7;
          butterfly.entryEnd = butterfly.entryDelay + butterfly.entryDuration;
          butterfly.circleRadius = circleRadius;
          butterfly.circleHeight = circleHeight;
          butterfly.circleAngle = entryAngle;
          butterfly.circleSpeed = (0.86 + random() * 0.1) * 0.7;
          butterfly.circleDuration = (5.8 + random() * 1.15) / 0.7;
          butterfly.circleEnd = butterfly.entryEnd + butterfly.circleDuration;
          butterfly.disperseDuration = (2.1 + random() * 1.2) / 0.7;
          butterfly.disperseEnd = butterfly.circleEnd + butterfly.disperseDuration;
          butterfly.exitCurve = null;
          butterfly.target = target;
          butterfly.targetGroup = targetGroup;
          occupiedButterflyFlowers.add(targetGroup);
          butterfly.lawnIndex = targetGroup.userData.butterflyLawnIndex;
          butterfly.elapsed = 0;
          butterfly.landed = false;
          butterfly.relocating = false;
          butterfly.relocation = null;
          butterfly.landingYaw = random() * TAU;
          scene.add(butterfly.group);
          butterflies.push(butterfly);
        }
        console.log(`[Butterflies] ${butterflies.length} GLB butterflies arrived: every lawn reached 60% bloom.`);
      } catch (error) {
        console.warn('[Butterflies] GLB load failed.', error);
      } finally {
        butterflyLoading = false;
      }
    }

    function scheduleLandingRelocations(time) {
      if (butterflyActiveLawns.length < 2) return;
      const available = butterflies.filter((butterfly) => butterfly.landed && !butterfly.relocating);
      for (let i = available.length - 1; i > 0; i--) {
        const j = Math.floor(random() * (i + 1));
        [available[i], available[j]] = [available[j], available[i]];
      }
      let moved = 0;
      for (const butterfly of available) {
        if (moved >= 2) break;
        const otherLawns = butterflyActiveLawns.filter((index) =>
          index !== butterfly.lawnIndex && butterflyLawnTargets[index]?.length
        );
        if (!otherLawns.length) continue;
        // Prefer the other lawn with the fewest butterflies so the flock
        // stays evenly spread over all four lawns over time.
        otherLawns.sort((a, b) => {
          const countA = butterflies.filter((item) => item.lawnIndex === a).length;
          const countB = butterflies.filter((item) => item.lawnIndex === b).length;
          return countA - countB;
        });
        const nextLawn = otherLawns[0];
        const list = butterflyLawnTargets[nextLawn];
        const occupiedInLawn = [...occupiedButterflyFlowers].filter((group) =>
          group.userData.butterflyLawnIndex === nextLawn
        );
        let candidates = list.filter((group) => !occupiedButterflyFlowers.has(group));
        if (!candidates.length) candidates = list.slice();
        let targetGroup = candidates[Math.floor(random() * candidates.length)];
        let bestDistance = -1;
        for (const candidate of candidates) {
          let nearest = Infinity;
          for (const occupied of occupiedInLawn) {
            nearest = Math.min(nearest, Math.hypot(
              candidate.position.x - occupied.position.x,
              candidate.position.z - occupied.position.z
            ));
          }
          if (occupiedInLawn.length === 0) nearest = Infinity;
          if (nearest > bestDistance) {
            bestDistance = nearest;
            targetGroup = candidate;
          }
        }
        if (butterfly.targetGroup) occupiedButterflyFlowers.delete(butterfly.targetGroup);
        occupiedButterflyFlowers.add(targetGroup);
        const target = new THREE.Vector3(
          targetGroup.position.x + (random() - 0.5) * 0.18,
          targetGroup.userData.flowerHeight + butterfly.landingClearance,
          targetGroup.position.z + (random() - 0.5) * 0.18
        );
        const start = butterfly.group.position.clone();
        const flat = target.clone().sub(start);
        flat.y = 0;
        const distance = flat.length();
        if (distance < 0.1) continue;
        const direction = flat.normalize();
        const control1 = start.clone()
          .addScaledVector(direction, Math.min(2.4, distance * 0.22))
          .add(new THREE.Vector3(0, 1.5 + random() * 1.3, 0));
        const control2 = target.clone().add(new THREE.Vector3(0, 1.6 + random() * 1.4, 0));
        butterfly.relocation = {
          curve: new THREE.CubicBezierCurve3(start, control1, control2, target),
          startTime: time,
          duration: 2.6 + distance / 5.2,
        };
        butterfly.relocating = true;
        butterfly.landed = false;
        butterfly.target = target;
        butterfly.targetGroup = targetGroup;
        butterfly.lawnIndex = nextLawn;
        butterfly.landingYaw = random() * TAU;
        moved++;
      }
    }

    function updateButterflies(delta, time) {
      if (time - lastFlowerScan > 0.7) {
        lastFlowerScan = time;
        refreshFlightFlowerObstacles();
      }
      if (!butterflySpawned) {
        butterflyProgressTimer += delta;
        if (butterflyProgressTimer < 0.35) return;
        butterflyProgressTimer = 0;
        const lawnStats = flowerLawns.map(() => ({ total: 0, bloomed: 0 }));
        for (const cluster of flowerClusters) {
          const lawnIndex = flowerLawns.findIndex((lawn) =>
            Math.abs(cluster.x - lawn.x) <= 3
            && Math.abs(cluster.z - lawn.z) <= 2.2
          );
          if (lawnIndex < 0) continue;
          lawnStats[lawnIndex].total++;
          if (cluster.bloomed) lawnStats[lawnIndex].bloomed++;
        }
        const activeStats = lawnStats.filter((stats) => stats.total > 0);
        const ratios = activeStats.map((stats) => stats.bloomed / stats.total);
        butterflyProgress = ratios.length ? Math.min(...ratios) : 0;
        const allLawnsReady = ratios.length > 0 && ratios.every((ratio) => ratio >= 0.60);
        if (butterflyProgress >= 0.35 && !butterflyTemplates) loadButterflyTemplates().catch((error) => {
          console.warn('[Butterflies] Preload failed.', error);
        });
        if (allLawnsReady) spawnButterflies();
        return;
      }
      for (const butterfly of butterflies) {
        const { group, materials } = butterfly;
        if (butterfly.relocating && butterfly.relocation) {
          const relocation = butterfly.relocation;
          const t = Math.min(1, (time - relocation.startTime) / relocation.duration);
          const eased = t * t * (3 - 2 * t);
          const position = keepButterflyClear(relocation.curve.getPoint(eased), butterfly);
          const ahead = keepButterflyClear(relocation.curve.getPoint(Math.min(1, eased + 0.015)), butterfly);
          group.position.copy(position);
          if (ahead.distanceToSquared(position) > 0.0001) group.lookAt(ahead);
          butterfly.flap = -0.698132 + (Math.sin(time * 21 + butterfly.group.userData.phase) * 0.5 + 0.5) * 2.00713;
          if (t >= 1) {
            butterfly.relocating = false;
            butterfly.relocation = null;
            butterfly.landed = true;
            group.position.copy(butterfly.target);
            group.rotation.set(0, butterfly.landingYaw, 0);
          }
        } else if (!butterfly.landed) {
          if (butterfly.startTime === undefined) butterfly.startTime = time;
          butterfly.elapsed = time - butterfly.startTime;
          const elapsed = butterfly.elapsed;
          const phase = butterfly.group.userData.phase;
          if (elapsed < butterfly.entryDelay) {
            group.position.copy(keepButterflyClear(butterfly.entryCurve.getPoint(0), butterfly));
          } else if (elapsed < butterfly.entryEnd) {
            const t = (elapsed - butterfly.entryDelay) / butterfly.entryDuration;
            const eased = t * t * (3 - 2 * t);
            const position = keepButterflyClear(butterfly.entryCurve.getPoint(eased), butterfly);
            const ahead = keepButterflyClear(butterfly.entryCurve.getPoint(Math.min(1, eased + 0.015)), butterfly);
            group.position.copy(position);
            if (ahead.distanceToSquared(position) > 0.0001) group.lookAt(ahead);
          } else if (elapsed < butterfly.circleEnd) {
            const circleTime = elapsed - butterfly.entryEnd;
            const angle = butterfly.circleAngle + circleTime * butterfly.circleSpeed;
            const height = butterfly.circleHeight
              + Math.sin(time * 1.45 + phase) * 0.62
              + Math.sin(time * 0.72 + phase * 1.7) * 0.32;
            const position = keepButterflyClear(new THREE.Vector3(
              Math.cos(angle) * butterfly.circleRadius,
              height,
              Math.sin(angle) * butterfly.circleRadius
            ), butterfly);
            const ahead = keepButterflyClear(new THREE.Vector3(
              Math.cos(angle + 0.035) * butterfly.circleRadius,
              height,
              Math.sin(angle + 0.035) * butterfly.circleRadius
            ), butterfly);
            group.position.copy(position);
            group.lookAt(ahead);
          } else {
            if (!butterfly.exitCurve) {
              const exitAngle = butterfly.circleAngle + butterfly.circleDuration * butterfly.circleSpeed;
              const exitStart = group.position.clone();
              const tangent = new THREE.Vector3(-Math.sin(exitAngle), 0, Math.cos(exitAngle));
              const exitControl1 = exitStart.clone().addScaledVector(tangent, 3.2).add(new THREE.Vector3(0, 1.5, 0));
              const exitControl2 = butterfly.target.clone().add(new THREE.Vector3(0, 2.8, 0));
              butterfly.exitCurve = new THREE.CubicBezierCurve3(exitStart, exitControl1, exitControl2, butterfly.target);
            }
            const t = Math.min(1, (elapsed - butterfly.circleEnd) / butterfly.disperseDuration);
            const eased = t * t * (3 - 2 * t);
            const position = keepButterflyClear(butterfly.exitCurve.getPoint(eased), butterfly);
            const ahead = keepButterflyClear(butterfly.exitCurve.getPoint(Math.min(1, eased + 0.015)), butterfly);
            group.position.copy(position);
            if (ahead.distanceToSquared(position) > 0.0001) group.lookAt(ahead);
            if (t >= 1) {
              butterfly.landed = true;
              group.position.copy(butterfly.target);
              group.rotation.set(0, butterfly.landingYaw, 0);
            }
          }
          // 115° flap arc. The downward fold stops at 75° so the wing tips
          // stay separated; the open pose reaches 40° upward.
          butterfly.flap = -0.698132 + (Math.sin(time * 21 + phase) * 0.5 + 0.5) * 2.00713;
        } else {
          butterfly.flap = -0.698132 + (Math.sin(time * 5.2 + butterfly.group.userData.phase) * 0.5 + 0.5) * 2.00713;
          group.position.y = butterfly.target.y + Math.sin(time * 2.2 + butterfly.group.userData.phase) * 0.012;
        }
        for (const material of materials) {
          if (material.userData.flapUniform) {
            material.userData.flapUniform.value = butterfly.flap;
          }
        }
      }
      if (!initialLandingComplete && butterflies.length && butterflies.every((butterfly) => butterfly.landed)) {
        initialLandingComplete = true;
        lastRelocationAt = time;
      }
      if (initialLandingComplete && time - lastRelocationAt >= 1) {
        lastRelocationAt = time;
        scheduleLandingRelocations(time);
      }
    }

    window.__butterflyProgress = () => butterflyProgress;
    window.__butterflies = butterflies;

    const keys = new Set();
    const keyAliases = new Set(['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']);
    window.addEventListener('keydown', (event) => {
      if (keyAliases.has(event.code)) {
        keys.add(event.code);
        event.preventDefault();
      }
    });
    window.addEventListener('keyup', (event) => {
      keys.delete(event.code);
    });
    window.addEventListener('blur', () => keys.clear());

    function moveCamera(delta) {
      if (!keys.size) return;
      const forward = new THREE.Vector3();
      camera.getWorldDirection(forward);
      forward.y = 0;
      if (forward.lengthSq() < 0.0001) return;
      forward.normalize();
      const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();
      const movement = new THREE.Vector3();
      if (keys.has('KeyW') || keys.has('ArrowUp')) movement.add(forward);
      if (keys.has('KeyS') || keys.has('ArrowDown')) movement.sub(forward);
      if (keys.has('KeyD') || keys.has('ArrowRight')) movement.add(right);
      if (keys.has('KeyA') || keys.has('ArrowLeft')) movement.sub(right);
      if (movement.lengthSq() === 0) return;
      movement.normalize().multiplyScalar(4.1 * delta);
      const nextPosition = camera.position.clone().add(movement);
      const nextTarget = controls.target.clone().add(movement);
      nextPosition.x = clamp(nextPosition.x, -14.8, 14.8);
      nextPosition.z = clamp(nextPosition.z, -14.8, 14.8);
      nextPosition.y = Math.max(1.2, nextPosition.y);
      nextTarget.x = clamp(nextTarget.x, -14.8, 14.8);
      nextTarget.z = clamp(nextTarget.z, -14.8, 14.8);
      camera.position.copy(nextPosition);
      controls.target.copy(nextTarget);
    }

    // ---------------------------------------------------------------------
    // Animation
    // ---------------------------------------------------------------------
    const clock = new THREE.Clock();

    function updateFountain(time, delta) {
      for (let i = 0; i < dropCount; i++) {
        dropAge[i] += delta;
        const idx = i * 3;
        dropVelocity[idx + 1] -= 3.4 * delta;
        dropPositions[idx] += dropVelocity[idx] * delta;
        dropPositions[idx + 1] += dropVelocity[idx + 1] * delta;
        dropPositions[idx + 2] += dropVelocity[idx + 2] * delta;
        if (dropPositions[idx + 1] < 0.57 || dropAge[i] > dropLife[i]) resetDrop(i);
      }
      dropGeometry.attributes.position.needsUpdate = true;

      for (const ring of poolRings) {
        const phase = (time * ring.userData.speed + ring.userData.phase) % 1;
        const scale = lerp(0.25, 3.5, phase);
        ring.scale.setScalar(scale);
        ring.material.opacity = Math.sin(phase * Math.PI) * 0.24;
      }

      poolWater.position.y = poolWaterBase + Math.sin(time * 0.6) * 0.004;
      lowerWater.position.y = lowerWaterBase + Math.sin(time * 0.74 + 1.3) * 0.003;
      upperWater.position.y = upperWaterBase + Math.sin(time * 0.9 + 0.6) * 0.002;
      if (fountainCascade) fountainCascade.update(delta);
    }

    const yuriDialogueElement = document.querySelector('#yuriDialogue');
    const yuriDialogueLineElement = yuriDialogueElement?.querySelector('.yuri-dialogue__line');
    let yuriDialogueTimer = null;
    let yuriDialogueWasNear = false;

    function currentYuriLine() {
      if (!wateringCanEquipped) return 'If only there were some flowers.';
      if (!wateringCanFilled) return 'You need some water.';
      if (!butterflySpawned) return 'Butterflies come when flowers bloom in profusion.';
      if (initialLandingComplete) return 'I love that. Thank you so much.';
      return null;
    }

    function showYuriDialogue(text) {
      if (!yuriDialogueElement || !yuriDialogueLineElement || !text) return;
      yuriDialogueLineElement.textContent = text;
      yuriDialogueElement.classList.add('is-visible');
      yuriDialogueElement.setAttribute('aria-hidden', 'false');
      if (yuriDialogueTimer) clearTimeout(yuriDialogueTimer);
      yuriDialogueTimer = setTimeout(() => {
        yuriDialogueElement.classList.remove('is-visible');
        yuriDialogueElement.setAttribute('aria-hidden', 'true');
      }, 5400);
    }

    function updateYuriDialogueProximity() {
      const distance = Math.hypot(audience.position.x, audience.position.z + 12.35);
      const near = distance < 2.55;
      if (near && !yuriDialogueWasNear) {
        const line = currentYuriLine();
        if (line) showYuriDialogue(line);
      }
      yuriDialogueWasNear = near;
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.05);
      const time = clock.elapsedTime;

      moveCamera(delta);
      controls.update();
      const wateringOnGrass = wateringCanEquipped && wateringCanFilled
        && isGrassForWatering(audience.position.x, audience.position.z);
      audience.userData.setWatering?.(wateringOnGrass);
      audience.userData.update?.(time, delta, camera);
      if (yuriVRM) yuriVRM.update(delta);
      updateWaterAndBloom(delta, wateringOnGrass);
      updateButterflies(delta, time);
      updateYuriDialogueProximity();
      if (wateringCanPrompt && wateringCanReady && !wateringCanEquipped) {
        const canDistance = Math.hypot(
          audience.position.x - wateringCanRoot.position.x,
          audience.position.z - wateringCanRoot.position.z
        );
        wateringCanPrompt.setVisible(canDistance < 2.9);
        wateringCanPrompt.update();
      }
      if (waterFillPrompt && wateringCanReady && wateringCanEquipped && !wateringCanFilled) {
        const fountainDistance = Math.hypot(audience.position.x, audience.position.z);
        const atFountain = fountainDistance < 4.85;
        waterFillPrompt.setVisible(atFountain);
        if (atFountain) {
          const rimDistance = Math.max(0.001, fountainDistance);
          waterFillPrompt.setAnchor(new THREE.Vector3(
            (audience.position.x / rimDistance) * 3.15,
            1.4,
            (audience.position.z / rimDistance) * 3.15
          ));
          waterFillPrompt.update();
        }
      }

      const solarDrift = Math.sin(time * 0.0065);
      positionSun(
        baseElevation + solarDrift * 0.02,
        baseAzimuth + Math.sin(time * 0.0052 + 0.8) * 0.028
      );
      updateLightDust(delta, time);

      updateFountain(time, delta);

      for (const item of swayItems) {
        const sway = Math.sin(time * item.speed + item.phase) * item.amplitude;
        item.object.rotation.x = item.baseX + sway * 0.6;
        item.object.rotation.z = item.baseZ + sway;
      }

      sky.position.copy(camera.position);
      renderer.render(scene, camera);
      if (!document.body.classList.contains('ready')) {
        document.body.classList.add('ready');
      }
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight, false);
    });

    // Exposed only for lightweight inspection; the page has no other runtime dependencies.
    window.__garden = { scene, camera, renderer, controls };

    animate();
  </script>
</body>
</html>
